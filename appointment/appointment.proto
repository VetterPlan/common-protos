syntax = "proto3";

package appointment;

import "google/protobuf/timestamp.proto";

// ═══════════════════════════════════════════════════════════════════════════
// APPOINTMENT SERVICE
//
// Core business service for VeterPlan's veterinary home visits marketplace.
// Manages the full appointment lifecycle from request to completion,
// including vet matching, state machine transitions, payments, and reviews.
//
// Depends on: Auth, Profile, Pet, VetCertification, Payment, Geolocation,
//             Notification services.
// ═══════════════════════════════════════════════════════════════════════════

service AppointmentService {
  rpc RequestAppointment (RequestAppointmentRequest) returns (AppointmentResponse);
  rpc AcceptAppointment (AcceptAppointmentRequest) returns (AppointmentResponse);
  rpc UpdateAppointmentStatus (UpdateAppointmentStatusRequest) returns (AppointmentResponse);
  rpc ConfirmArrival (ConfirmArrivalRequest) returns (AppointmentResponse);
  rpc CancelAppointment (CancelAppointmentRequest) returns (AppointmentResponse);
  rpc AbortAppointment (AbortAppointmentRequest) returns (AppointmentResponse);
  rpc GetCancellationQuote (GetCancellationQuoteRequest) returns (GetCancellationQuoteResponse);
  rpc GetAppointment (GetAppointmentRequest) returns (AppointmentResponse);
  rpc GetClientAppointments (GetClientAppointmentsRequest) returns (AppointmentsResponse);
  rpc GetVetAppointments (GetVetAppointmentsRequest) returns (AppointmentsResponse);
  rpc GetAvailableVets (GetAvailableVetsRequest) returns (AvailableVetsResponse);
  rpc GetVetAppointmentsForDate (GetVetAppointmentsForDateRequest) returns (GetVetAppointmentsForDateResponse);
  rpc GetNextAvailableSlots (GetNextAvailableSlotsRequest) returns (GetNextAvailableSlotsResponse);
  rpc GetPetAppointmentHistory (GetPetAppointmentHistoryRequest) returns (GetPetAppointmentHistoryResponse);
  rpc GetActivePetEngagements (GetActivePetEngagementsRequest) returns (GetActivePetEngagementsResponse);
  rpc GetActiveClientEngagements (GetActiveClientEngagementsRequest) returns (GetActiveClientEngagementsResponse);
  rpc UpdateVetLocation (UpdateVetLocationRequest) returns (UpdateVetLocationResponse);
  rpc GetAppointmentTracking (GetAppointmentTrackingRequest) returns (GetAppointmentTrackingResponse);
  rpc GetAppointmentHistory (GetAppointmentHistoryRequest) returns (GetAppointmentHistoryResponse);
  rpc GetVaccineRecommendations (GetVaccineRecommendationsRequest) returns (GetVaccineRecommendationsResponse);
  rpc GetFollowUpRecommendations (GetFollowUpRecommendationsRequest) returns (GetFollowUpRecommendationsResponse);
  rpc SubmitReview (SubmitReviewRequest) returns (ReviewResponse);
  rpc GetVetRatingSummary (GetVetRatingSummaryRequest) returns (VetRatingSummaryResponse);
  rpc AdminReportAppointments (AdminReportAppointmentsRequest) returns (AdminReportAppointmentsResponse);
  rpc AdvanceFromPendingPaymentAuth (AdvanceFromPendingPaymentAuthRequest) returns (AppointmentResponse);
  rpc GetSupplyHealthMetrics (SupplyHealthMetricsRequest) returns (SupplyHealthMetricsResponse);
  rpc RescheduleAppointment (RescheduleAppointmentRequest) returns (AppointmentResponse);
  rpc SuspendBookingBlock (SuspendBookingBlockRequest) returns (SuspendBookingBlockResponse);
  rpc RevokeBookingBlockSuspension (RevokeBookingBlockSuspensionRequest) returns (RevokeBookingBlockSuspensionResponse);
  rpc RequestVetReassignment (RequestVetReassignmentRequest) returns (AppointmentResponse);
  rpc ListCompletedAppointments (ListCompletedAppointmentsRequest) returns (ListCompletedAppointmentsResponse);
  rpc ListVetCancellations (ListVetCancellationsRequest) returns (ListVetCancellationsResponse);
  rpc AnonymizeClientData (AnonymizeClientDataRequest) returns (AnonymizeClientDataResponse);
  rpc ListAppointments (ListAppointmentsRequest) returns (ListAppointmentsResponse);
  rpc CountAppointmentsByProfiles (CountAppointmentsByProfilesRequest) returns (CountAppointmentsByProfilesResponse);
}

message ListAppointmentsRequest {
  int32 limit = 1;
  int32 offset = 2;
  repeated AppointmentStatus statuses = 3;
  string date_from = 4;
  string date_to = 5;
  string client_profile_id = 6;
  string vet_profile_id = 7;
  ServiceType service_type = 8;
}

message ListAppointmentsResponse {
  repeated Appointment appointments = 1;
  int32 total_count = 2;
}

enum ProfileRole {
  PROFILE_ROLE_UNSPECIFIED = 0;
  PROFILE_ROLE_CLIENT      = 1;
  PROFILE_ROLE_VET         = 2;
}

message CountAppointmentsByProfilesRequest {
  repeated string profile_ids = 1;   // techo de 100
  ProfileRole role = 2;              // obligatorio
  string date_from = 3;
  string date_to = 4;
  repeated AppointmentStatus statuses = 5;
}

message AppointmentCountByProfile {
  string profile_id = 1;
  int32 total = 2;
}

message CountAppointmentsByProfilesResponse {
  repeated AppointmentCountByProfile counts = 1;
}

message ListCompletedAppointmentsRequest {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message CompletedAppointmentSummary {
  string appointment_id = 1;
  string group_id = 2;
  string vet_profile_id = 3;
  string client_profile_id = 4;
  string pet_id = 5;
  string service_type = 6;
  bool   urgent = 7;
  google.protobuf.Timestamp completed_at = 8;
}

message ListCompletedAppointmentsResponse {
  repeated CompletedAppointmentSummary appointments = 1;
  int32 total_count = 2;
}

message ListVetCancellationsRequest {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
  int32 page = 3;
  int32 page_size = 4;
  string vet_profile_id = 5;
}

message VetCancellationSummary {
  string appointment_id = 1;
  string group_id = 2;
  string vet_profile_id = 3;
  string service_type = 4;
  bool   urgent = 5;
  string cancellation_reason = 6;
  string from_status = 7;
  google.protobuf.Timestamp cancelled_at = 8;
}

message ListVetCancellationsResponse {
  repeated VetCancellationSummary cancellations = 1;
  int32 total_count = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// ENUMS
// ═══════════════════════════════════════════════════════════════════════════

enum AppointmentStatus {
  APPOINTMENT_STATUS_UNSPECIFIED = 0;
  APPOINTMENT_STATUS_REQUESTED = 1;
  APPOINTMENT_STATUS_ACCEPTED = 2;
  APPOINTMENT_STATUS_EN_ROUTE = 3;
  APPOINTMENT_STATUS_ARRIVED = 4;
  APPOINTMENT_STATUS_IN_PROGRESS = 5;
  APPOINTMENT_STATUS_COMPLETED = 6;
  APPOINTMENT_STATUS_CANCELLED = 7;
  APPOINTMENT_STATUS_NO_SHOW = 8;
  APPOINTMENT_STATUS_REJECTED = 9;
  APPOINTMENT_STATUS_EXPIRED = 10;
  APPOINTMENT_STATUS_PENDING_PAYMENT_AUTH = 11;  // P2: Nequi — awaiting push-auth
}

enum ServiceType {
  SERVICE_TYPE_UNSPECIFIED = 0;
  SERVICE_TYPE_CONSULTATION = 1;
  SERVICE_TYPE_VACCINATION = 2;
  SERVICE_TYPE_DEWORMING = 3;
  SERVICE_TYPE_FOLLOW_UP = 4;
  SERVICE_TYPE_MEDICAL_CERTIFICATE = 5;
  SERVICE_TYPE_ULTRASOUND = 6;
  SERVICE_TYPE_ELECTROCARDIOGRAM = 7;
}

enum CancellationReason {
  CANCELLATION_REASON_UNSPECIFIED = 0;
  CANCELLATION_REASON_CLIENT_REQUEST = 1;
  CANCELLATION_REASON_VET_UNAVAILABLE = 2;
  CANCELLATION_REASON_WEATHER = 3;
  CANCELLATION_REASON_PET_EMERGENCY = 4;
  CANCELLATION_REASON_SCHEDULING_CONFLICT = 5;
  CANCELLATION_REASON_NO_RESPONSE = 6;
  CANCELLATION_REASON_SYSTEM_TIMEOUT = 7;
  CANCELLATION_REASON_ADMIN_ACTION = 8;
  CANCELLATION_REASON_OTHER = 9;
  CANCELLATION_REASON_CONSENT_REFUSED = 10;
}

enum StatusChangeReason {
  STATUS_CHANGE_REASON_UNSPECIFIED = 0;
  STATUS_CHANGE_REASON_CLIENT_REQUESTED = 1;
  STATUS_CHANGE_REASON_VET_ACCEPTED = 2;
  STATUS_CHANGE_REASON_VET_REJECTED = 3;
  STATUS_CHANGE_REASON_VET_EN_ROUTE = 4;
  STATUS_CHANGE_REASON_GEOFENCE_ARRIVAL = 5;
  STATUS_CHANGE_REASON_PIN_CONFIRMED = 6;
  STATUS_CHANGE_REASON_VET_STARTED = 7;
  STATUS_CHANGE_REASON_VET_COMPLETED = 8;
  STATUS_CHANGE_REASON_CLIENT_CANCELLED = 9;
  STATUS_CHANGE_REASON_VET_CANCELLED = 10;
  STATUS_CHANGE_REASON_SYSTEM_EXPIRED = 11;
  STATUS_CHANGE_REASON_SYSTEM_NO_SHOW = 12;
  STATUS_CHANGE_REASON_ADMIN_OVERRIDE = 13;
  STATUS_CHANGE_REASON_OTHER = 14;
  STATUS_CHANGE_REASON_PAYMENT_PENDING_AUTH = 15;   // P2: Nequi — awaiting push-auth
  STATUS_CHANGE_REASON_PAYMENT_AUTHORIZED = 16;     // P2: Nequi — auth confirmed
  STATUS_CHANGE_REASON_SYSTEM_PAYMENT_TIMEOUT = 17; // P2: Nequi — auth timed out
  STATUS_CHANGE_REASON_CLIENT_RESCHEDULED = 18;     // Client changed appointment time
  STATUS_CHANGE_REASON_CONSENT_REFUSED = 19;
  STATUS_CHANGE_REASON_PAYMENT_DECLINED = 20;
  STATUS_CHANGE_REASON_VET_REASSIGNMENT = 21;       // Se libera al vet; la cita sigue viva
  STATUS_CHANGE_REASON_VET_ABORTED = 22;            // El vet interrumpe la consulta empezada
  STATUS_CHANGE_REASON_CLIENT_ABORTED = 23;         // El cliente interrumpe la consulta empezada
}

enum UrgencyLevel {
  URGENCY_LEVEL_UNSPECIFIED = 0;
  URGENCY_LEVEL_ROUTINE = 1;
  URGENCY_LEVEL_SOON = 2;
  URGENCY_LEVEL_URGENT = 3;
  URGENCY_LEVEL_EMERGENCY = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Core Entities
// ═══════════════════════════════════════════════════════════════════════════

message Appointment {
  string id = 1;
  string client_profile_id = 2;
  string vet_profile_id = 3;        // Empty until accepted
  repeated string pet_ids = 4;
  ServiceType service_type = 5;
  UrgencyLevel urgency = 6;
  int32 estimated_duration_minutes = 7;
  AppointmentStatus status = 8;
  string confirmation_code = 9;     // 6-digit PIN for arrival confirmation
  string scheduled_date = 10;       // ISO 8601 date (YYYY-MM-DD)
  string scheduled_time_start = 11; // ISO 8601 datetime
  string scheduled_time_end = 12;   // ISO 8601 datetime
  string address_id = 13;
  double address_lat = 14;
  double address_lng = 15;
  string address_text = 16;
  string client_notes = 17;
  string vet_notes = 18;
  double estimated_price = 19;
  double final_price = 20;
  string currency = 21;
  string payment_preauth_id = 22;
  CancellationReason cancellation_reason = 23;
  string cancelled_by = 24;
  google.protobuf.Timestamp created_at = 25;
  google.protobuf.Timestamp updated_at = 26;
  google.protobuf.Timestamp accepted_at = 27;
  google.protobuf.Timestamp en_route_at = 28;
  google.protobuf.Timestamp arrived_at = 29;
  google.protobuf.Timestamp started_at = 30;
  google.protobuf.Timestamp completed_at = 31;
  google.protobuf.Timestamp expires_at = 32;
  repeated StatusHistoryEntry status_history = 33;
  string appointment_mode = 34;        // on_demand, flex_window, scheduled
  string time_window_start = 35;       // ISO 8601 datetime
  string time_window_end = 36;         // ISO 8601 datetime
  string preferred_vet_id = 37;
  string service_metadata = 38;        // JSON string
  string payment_method_id = 39;       // ClientPaymentMethod UUID from payment-service
  int32 eta_minutes = 40;             // Estimated travel time in minutes
  string group_id = 41;
}

message StatusHistoryEntry {
  string id = 1;
  string appointment_id = 2;
  AppointmentStatus previous_status = 3;
  AppointmentStatus new_status = 4;
  StatusChangeReason reason = 5;
  string reason_details = 6;
  string changed_by = 7;            // "CLIENT" | "VET" | "SYSTEM" or UUID
  google.protobuf.Timestamp changed_at = 8;
}

message AvailableVet {
  string vet_profile_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  double distance_km = 4;
  double rating = 5;
  int32 review_count = 6;
  double estimated_price = 7;
  int32 estimated_arrival_minutes = 8;
  repeated string certifications = 9;
  repeated string specialties = 10;
  double score = 11;
  string price_notes = 12;
  bool is_preferred = 13;              // true if preferred_vet_id matches
  double lat = 14;                     // Vet location for map display
  double lng = 15;
}

message ServiceCatalogItem {
  string id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  ServiceType service_type = 5;
  double base_price_min = 6;
  double base_price_max = 7;
  int32 duration_minutes_est = 8;
  bool is_active = 9;
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Requests
// ═══════════════════════════════════════════════════════════════════════════

message PetRequestItem {
  string pet_id = 1;
  ServiceType service_type = 2;
  string service_metadata = 3;         // JSON string con info del subtipo
}

message RequestAppointmentRequest {
  string client_profile_id = 1;
  repeated string pet_ids = 2;
  ServiceType service_type = 3;
  UrgencyLevel urgency = 4;
  string scheduled_date = 5;           // ISO 8601 date
  string scheduled_time_start = 6;     // ISO 8601 datetime
  int32 estimated_duration_minutes = 7;
  string address_id = 8;
  double address_lat = 9;
  double address_lng = 10;
  string address_text = 11;
  string client_notes = 12;
  string appointment_mode = 13;        // on_demand, flex_window, scheduled
  string time_window_start = 14;       // ISO 8601 UTC (required for FLEX_WINDOW/SCHEDULED)
  string time_window_end = 15;         // ISO 8601 UTC (required for FLEX_WINDOW/SCHEDULED)
  string preferred_vet_id = 16;        // Optional: "I want this specific vet"
  string service_metadata = 17;        // JSON string with subtype info
  string payment_method_id = 18;       // Required: ClientPaymentMethod UUID for preauth at acceptance
  string client_email = 19;            // Optional: client email for transactional emails (S2-12)
  double slot_price = 20;              // P1: price seen by client in slot listing (locks price for 90 min, 0 = not provided)
  repeated PetRequestItem pets = 21;
  string promo_id = 22;
}

message AppointmentPrice {
  string appointment_id = 1;
  double estimated_price = 2;
}

message AcceptAppointmentRequest {
  string appointment_id = 1;
  string vet_profile_id = 2;
  double estimated_price = 3;
  int32 estimated_arrival_minutes = 4;
  string vet_notes = 5;
  repeated AppointmentPrice group_prices = 6;
}

message UpdateAppointmentStatusRequest {
  string appointment_id = 1;
  AppointmentStatus new_status = 2;
  StatusChangeReason reason = 3;
  string reason_details = 4;
  string changed_by = 5;
  string vet_notes = 6;
  double final_price = 7;
  optional double vet_lat = 8;
  optional double vet_lng = 9;
}

message ConfirmArrivalRequest {
  string appointment_id = 1;
  string confirmation_code = 2;       // 6-digit PIN
}

message CancelAppointmentRequest {
  string appointment_id = 1;
  CancellationReason reason = 2;
  string reason_details = 3;
  string cancelled_by = 4;            // user_id or "SYSTEM"
}

message GetCancellationQuoteRequest {
  string appointment_id = 1;
  repeated string requester_profile_ids = 2;
}

message GetCancellationQuoteResponse {
  string role = 1;
  bool chargeable = 2;
  double fee_amount_cop = 3;
  double fee_percent = 4;
  double base_amount_cop = 5;
  string base_kind = 6;               // "appointment" | "trip"
  string not_chargeable_reason = 7;
  google.protobuf.Timestamp free_until = 8;
  int32 appointments_affected = 9;
}

message AbortAppointmentRequest {
  string appointment_id = 1;
  CancellationReason reason = 2;
  string reason_details = 3;
}

message GetAppointmentRequest {
  string appointment_id = 1;
  bool include_status_history = 2;
  repeated string requester_profile_ids = 3;
}

message GetClientAppointmentsRequest {
  string client_profile_id = 1;
  AppointmentStatus status_filter = 2;  // UNSPECIFIED = all statuses
  int32 limit = 3;
  int32 offset = 4;
}

message GetVetAppointmentsRequest {
  string vet_profile_id = 1;
  AppointmentStatus status_filter = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetAvailableVetsRequest {
  ServiceType service_type = 1;
  double address_lat = 2;
  double address_lng = 3;
  string scheduled_date = 4;           // ISO 8601 date
  string scheduled_time_start = 5;     // ISO 8601 datetime
  UrgencyLevel urgency = 6;
  string pet_species = 7;             // For certification filtering
  double radius_km = 8;               // Search radius (default: 15km)
  int32 max_results = 9;              // Max vets to return (default: 5)
  string appointment_mode = 10;        // on_demand, flex_window, scheduled
  string time_window_start = 11;       // ISO 8601 UTC
  string time_window_end = 12;         // ISO 8601 UTC
  string preferred_vet_id = 13;        // Optional: boost in ranking
  string client_profile_id = 14;       // Bucket determinista del experimento de exposición
  string pet_age_band = 15;            // puppy | adult | senior — segmento del caso
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Responses
// ═══════════════════════════════════════════════════════════════════════════

message AppointmentResponse {
  Appointment appointment = 1;
  repeated Appointment group_appointments = 2;
}

message AppointmentsResponse {
  repeated Appointment appointments = 1;
  int32 total_count = 2;
}

message AvailableVetsResponse {
  repeated AvailableVet vets = 1;
  int32 total_count = 2;
  double search_radius_km = 3;
}

// ═══════════════════════════════════════════════════════════════════════════
// NEW MESSAGES — Vet Appointments for Date (inter-service)
// ═══════════════════════════════════════════════════════════════════════════

message GetVetAppointmentsForDateRequest {
  string vet_profile_id = 1;
  string date = 2;                     // "2026-02-15"
}

message GetVetAppointmentsForDateResponse {
  repeated VetAppointmentSlot appointments = 1;
}

message VetAppointmentSlot {
  string appointment_id = 1;
  string time_window_start = 2;        // ISO 8601 UTC
  string time_window_end = 3;          // ISO 8601 UTC
  string status = 4;                   // REQUESTED, ACCEPTED, etc.
  string service_type = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
// NEW MESSAGES — Next Available Slots (MVP calculated slots)
// ═══════════════════════════════════════════════════════════════════════════

message GetNextAvailableSlotsRequest {
  string service_type = 1;             // CONSULTATION, VACCINATION, etc.
  double address_lat = 2;              // Client location
  double address_lng = 3;
  int32 hours_ahead = 4;              // How many hours ahead to search (default 48)
  string service_metadata = 5;        // JSON string with subtype info (passthrough, does not affect slot logic)
  bool prefer_vet_directory = 6;
}

message GetNextAvailableSlotsResponse {
  repeated DaySlots days = 1;                  // Grouped by day
  int32 total_vets_in_area = 2;
  int32 service_duration_minutes = 3;          // Duration of the service
  string slot_calculated_at = 4;
  // H23.1. Cada veterinario una sola vez. Vacio salvo que el llamante haya
  // pedido `prefer_vet_directory`.
  repeated SlotVetPreview vet_directory = 5;
}

message DaySlots {
  string date = 1;                     // "2026-02-15"
  string day_label = 2;               // "Hoy", "Mañana", "Sábado 15"
  repeated CalculatedSlot slots = 3;
}

message CalculatedSlot {
  string slot_id = 1;                  // UUID for this slot
  string start_time = 2;              // "10:00" (local Colombia time)
  string end_time = 3;                // "11:00" (end of service visible to client)
  string start_time_utc = 4;          // ISO 8601 UTC
  string end_time_utc = 5;            // ISO 8601 UTC (includes buffer for overlap)
  int32 available_vet_count = 6;
  double lowest_price = 7;
  double highest_price = 8;
  // Se sigue poblando salvo que el llamante pida `prefer_vet_directory`.
  repeated SlotVetPreview vets = 9;
  // H23.1. Indices dentro de `GetNextAvailableSlotsResponse.vet_directory`,
  // EN EL MISMO ORDEN en que irian los previews de `vets`. El orden es
  // significativo: los veterinarios de un hueco van por precio ascendente.
  repeated int32 vet_indices = 10;
}

message SlotVetPreview {
  string vet_profile_id = 1;
  string name = 2;
  string avatar_initials = 3;
  double rating = 4;
  int32 review_count = 5;
  double price = 6;
  int32 eta_minutes = 7;
  string avatar_url = 8;
}

// ═══════════════════════════════════════════════════════════════════════════
// NEW MESSAGES — Pet Appointment History (for follow-up recommendations)
// ═══════════════════════════════════════════════════════════════════════════

message GetPetAppointmentHistoryRequest {
  string pet_id = 1;
  int32 days_back = 2;                // default 90
}

message GetActiveClientEngagementsRequest {
  repeated string client_profile_ids = 1;   // techo de 100
}

message GetActiveClientEngagementsResponse {
  repeated ClientEngagement engagements = 1;
}

message ClientEngagement {
  string client_profile_id = 1;
  string appointment_id = 2;
  string vet_profile_id = 3;   // "" => REQUESTED abierta; engagement ABIERTO, no autorizacion
  string status = 4;           // siempre uno de AppointmentStatus.is_active
}

message GetActivePetEngagementsRequest {
  repeated string pet_ids = 1;        // techo de 100; INVALID_ARGUMENT si se excede
}

message GetActivePetEngagementsResponse {
  repeated PetEngagement engagements = 1;   // solo los que tienen engagement activo
}

message PetEngagement {
  string pet_id = 1;
  string appointment_id = 2;
  string vet_profile_id = 3;
  string status = 4;                  // siempre uno de AppointmentStatus.is_active
}

message GetPetAppointmentHistoryResponse {
  repeated PetAppointmentSummary appointments = 1;
}

message PetAppointmentSummary {
  string appointment_id = 1;
  string service_type = 2;
  string vet_profile_id = 3;
  string vet_name = 4;
  string status = 5;
  string completed_at = 6;
  string service_metadata = 7;         // JSON string
  bool incomplete_attempt = 8;
  string cancellation_reason = 9;      // populated when incomplete_attempt is true
}

// ═══════════════════════════════════════════════════════════════════════════
// NEW MESSAGES — Vaccine Recommendations
// ═══════════════════════════════════════════════════════════════════════════

message GetVaccineRecommendationsRequest {
  string pet_id = 1;                   // UUID of the pet
  string species = 2;                  // "DOG" or "CAT" (to filter catalog)
}

message VaccineRecommendation {
  string vaccine_type = 1;             // "DOG_RABIA", "CAT_TRIPLE_FELINA", etc.
  string vaccine_name = 2;             // "Antirrábica"
  string category = 3;                 // "OVERDUE", "UPCOMING", "SUGGESTED"
  int32 days_relative = 4;             // Negative if overdue (-15), positive if upcoming (12), 0 if suggested
  string last_administered = 5;        // ISO 8601 or empty if never
  string next_due_date = 6;            // ISO 8601 or empty if not applicable
  string display_text = 7;             // "Venció hace 15 días" / "Vence en 12 días" / "Sin registro previo"
}

message GetVaccineRecommendationsResponse {
  repeated VaccineRecommendation recommendations = 1;
  bool has_vaccination_history = 2;    // false if the pet has never been vaccinated
  string pet_name = 3;                 // For message "No encontramos historial para {pet_name}"
}

// ═══════════════════════════════════════════════════════════════════════════
// NEW MESSAGES — Follow-Up Recommendations
// ═══════════════════════════════════════════════════════════════════════════

message GetFollowUpRecommendationsRequest {
  string pet_id = 1;
}

message FollowUpRecommendation {
  string followup_type = 1;            // "POST_CONSULTATION", etc.
  string name = 2;                     // "Control post-consulta"
  string description = 3;              // "Con Dra. María López — hace 8 días"
  string category = 4;                 // "RECOMMENDED" or "GENERIC"
  string related_appointment_id = 5;   // UUID of the previous appointment (if applicable)
  string related_vet_id = 6;           // UUID of the vet (for preferred_vet_id)
  string related_vet_name = 7;         // Vet name (if applicable)
}

message GetFollowUpRecommendationsResponse {
  repeated FollowUpRecommendation recommendations = 1;
  bool has_recent_appointments = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// NEW MESSAGES — Appointment History (audit log of status changes)
// ═══════════════════════════════════════════════════════════════════════════

message GetAppointmentHistoryRequest {
  string appointment_id = 1;           // UUID of the appointment
  int32 limit = 2;                     // Max entries to return (default 50)
  int32 offset = 3;                    // Pagination offset
}

message GetAppointmentHistoryResponse {
  repeated StatusHistoryEntry entries = 1;
  int32 total_count = 2;
  string appointment_id = 3;
}

// ═══════════════════════════════════════════════════════════════════════════
// NEW MESSAGES — Real-time vet location
// ═══════════════════════════════════════════════════════════════════════════

message UpdateVetLocationRequest {
  string appointment_id = 1;           // UUID — must be in EN_ROUTE or ARRIVED status
  string vet_profile_id = 2;           // For ownership validation
  double lat = 3;
  double lng = 4;
  int32  accuracy_m = 5;               // Precisión reportada por el GPS; 0 = desconocida
}

message UpdateVetLocationResponse {
  bool success = 1;
}

message GetAppointmentTrackingRequest {
  string appointment_id = 1;
  repeated string requester_profile_ids = 2;
}

message TrackingRoute {
  string encoded_polyline = 1;
  double origin_lat = 2;
  double origin_lng = 3;
  int32 age_seconds = 4;
  optional int32 remaining_distance_m = 5;
}

message GetAppointmentTrackingResponse {
  AppointmentStatus status = 1;
  bool has_location = 2;
  double vet_lat = 3;
  double vet_lng = 4;
  int32 location_age_seconds = 5;
  bool location_is_stale = 6;
  int32 eta_minutes = 7;
  string eta_method = 8;
  string eta_updated_at = 9;
  double client_lat = 10;
  double client_lng = 11;
  TrackingRoute route = 12;
}

// ═══════════════════════════════════════════════════════════════════════════
// ADMIN REPORTS
// ═══════════════════════════════════════════════════════════════════════════

enum ReportGranularity {
  REPORT_GRANULARITY_UNSPECIFIED = 0;
  REPORT_GRANULARITY_DAY = 1;
  REPORT_GRANULARITY_WEEK = 2;
  REPORT_GRANULARITY_MONTH = 3;
}

message AdminReportAppointmentsRequest {
  string period_start = 1;       // ISO 8601 date "YYYY-MM-DD"
  string period_end = 2;         // ISO 8601 date "YYYY-MM-DD"
  ReportGranularity granularity = 3;
}

message AppointmentCountByStatus {
  AppointmentStatus status = 1;
  int32 count = 2;
}

message AppointmentBucket {
  string bucket_start_date = 1;
  int32 total = 2;
  repeated AppointmentCountByStatus by_status = 3;
}

message AdminReportAppointmentsResponse {
  int32 total = 1;
  repeated AppointmentCountByStatus by_status = 2;
  repeated AppointmentBucket buckets = 3;
}

// ═══════════════════════════════════════════════════════════════════════════
// REVIEWS (S2-3)
// ═══════════════════════════════════════════════════════════════════════════

message SubmitReviewRequest {
  string appointment_id = 1;       // UUID — must be COMPLETED
  string reviewer_profile_id = 2;  // Must be client_profile_id of the appointment
  int32 rating = 3;                // 1-5
  string comment = 4;               // Optional text
}

message ReviewResponse {
  string review_id = 1;
  string appointment_id = 2;
  string vet_profile_id = 3;
  int32 rating = 4;
  string comment = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetVetRatingSummaryRequest {
  string vet_profile_id = 1;
}

message VetRatingSummaryResponse {
  string vet_profile_id = 1;
  double average_rating = 2;
  int32 review_count = 3;
}

// ═══════════════════════════════════════════════════════════════════════════
// P2 — Nequi PENDING_PAYMENT_AUTH
// ═══════════════════════════════════════════════════════════════════════════

message AdvanceFromPendingPaymentAuthRequest {
  string appointment_id = 1;  // Triggered by payment-service when Nequi AUTHORIZED
}

// ═══════════════════════════════════════════════════════════════════════════
// RESCHEDULE
// ═══════════════════════════════════════════════════════════════════════════

message RescheduleAppointmentRequest {
  string appointment_id      = 1;  // UUID of the appointment to reschedule
  string changed_by          = 2;  // UUID of the client requesting the reschedule
  string new_time_window_start = 3; // ISO 8601 datetime
  string new_time_window_end   = 4; // ISO 8601 datetime
  string reason_details      = 5;  // Optional free-text reason
}

// ═══════════════════════════════════════════════════════════════════════════
// Puente con Constancia
// ═══════════════════════════════════════════════════════════════════════════

message SuspendBookingBlockRequest {
  string client_profile_id = 1;
  string reason            = 2;  // por qué; queda en el registro de la exención
  int32  duration_hours    = 3;  // 0 = el default del servicio
  string granted_by        = 4;  // quién la concede (servicio o admin)
  string external_ref      = 5;  // caso/expediente que la respalda
}

message SuspendBookingBlockResponse {
  bool                      suspended    = 1;
  string                    exemption_id = 2;
  google.protobuf.Timestamp expires_at   = 3;
}

message RevokeBookingBlockSuspensionRequest {
  string client_profile_id = 1;
  string reason            = 2;
  string revoked_by        = 3;
}

message RevokeBookingBlockSuspensionResponse {
  bool  revoked       = 1;
  int32 revoked_count = 2;
}

message RequestVetReassignmentRequest {
  string appointment_id = 1;
  string reason         = 2;
  string requested_by   = 3;  // UUID de quien la pide (cliente, vet o servicio)
  string external_ref   = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// P5 — Supply Health Metrics
// ═══════════════════════════════════════════════════════════════════════════

message SupplyHealthMetricsRequest {
  string date_from = 1;   // ISO 8601 date "YYYY-MM-DD"
  string date_to = 2;     // ISO 8601 date "YYYY-MM-DD"
}

message SupplyHealthMetricsResponse {
  double slot_fill_rate = 1;               // completed / total_scheduled
  double median_response_time_minutes = 2; // median(accepted_at - created_at)
  double vet_utilization_rate = 3;         // completed / all active vets
  int32  active_vets = 4;                  // vets with ≥1 completed in period
  int32  total_appointments = 5;
  int32  completed_appointments = 6;
  int32  cancelled_by_vet = 7;
  int32  expired_no_vet = 8;
}

message AnonymizeClientDataRequest {
  string client_profile_id = 1;
}

message AnonymizeClientDataResponse {
  int32 appointments_anonymized = 1;
}
