syntax = "proto3";

package auth;

service AuthService {
  // Authentication
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (LoginResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc SendOtp(SendOtpRequest) returns (SendOtpResponse);
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc RequestPasswordReset (RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc ResendVerificationEmail (ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse);
  rpc GetAccountVerification (GetAccountVerificationRequest) returns (GetAccountVerificationResponse);

  // Role Management (NEW - Sprint 3)
  rpc AssignRole (AssignRoleRequest) returns (AssignRoleResponse);
  rpc GetUserRoles (GetUserRolesRequest) returns (GetUserRolesResponse);
  rpc RemoveRole (RemoveRoleRequest) returns (RemoveRoleResponse);

  // Hard delete (testing utility)
  rpc HardDeleteUser (HardDeleteUserRequest) returns (HardDeleteUserResponse);

  // Admin: look up a user account by email address
  rpc FindUserByEmail (FindUserByEmailRequest) returns (FindUserByEmailResponse);

  // Servicio-a-servicio: la direccion de correo de un usuario, para poder
  // escribirle. NO se expone en la gateway.
  //
  // Existe porque `FindUserByEmail` va en la direccion contraria y ningun otro
  // servicio guarda el correo personal: `VetProfile.clinic_email` es el de la
  // clinica y es opcional. Sin esto, avisar por correo al dueno de un perfil
  // obliga a inventarse la direccion o a no avisar.
  rpc GetUserContact (GetUserContactRequest) returns (GetUserContactResponse);

  // Admin: paginated list of all accounts (clients + vets + admins), with filters
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);

  // ─── DOCUMENTOS LEGALES (T&C, privacidad) ───
  //
  // Append-only: publicar crea una versión y la anterior queda inactiva. La
  // aceptación guarda versión + hash del texto que se mostró, porque sin eso no
  // hay forma de probar QUÉ aceptó cada usuario.

  // Texto vigente de un documento. Público (se lee antes de tener cuenta).
  rpc GetLegalDocument (GetLegalDocumentRequest) returns (LegalDocumentResponse);

  // Registra la aceptación de un usuario. Idempotente por (usuario, tipo, versión).
  rpc AcceptLegalDocument (AcceptLegalDocumentRequest) returns (AcceptLegalDocumentResponse);

  // Qué documentos le faltan por aceptar a un usuario (se consulta en login).
  rpc GetPendingLegalAcceptances (GetPendingLegalAcceptancesRequest) returns (GetPendingLegalAcceptancesResponse);

  // Admin: publica una versión nueva. NUNCA edita la vigente.
  rpc PublishLegalDocument (PublishLegalDocumentRequest) returns (LegalDocumentResponse);

  // Admin: histórico de versiones de un tipo de documento.
  rpc ListLegalDocuments (ListLegalDocumentsRequest) returns (ListLegalDocumentsResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
    string email = 3;
    string phone = 4;
}

message RegisterResponse {
    string message = 1;
    bool success = 2;
    string user_id = 3;
}

message LoginResponse {
  string accessToken = 1;
  string refreshToken = 2;
}

message RefreshTokenRequest {
  string refreshToken = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string name = 3;
  string email = 4;
  repeated string roles = 5;  // CHANGED: from string to repeated string
  string user_type = 6;       // NEW: "client", "vet", "both", or "admin"
  bool is_email_verified = 7; // NEW: renamed from is_verified
  // E1-A3: identificador del access token. Es la clave con la que la gateway
  // consulta la lista de revocación; sin él ese camino de validación es ciego.
  string jti = 8;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  bool success = 1;
  string message = 2;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
}

// `user_id` lo pone la gateway desde el JWT, nunca el cliente: sin el, esto
// seria "cambiale la contrasena a quien quieras". No lleva `confirm_password`
// --comparar dos campos es del formulario, no del contrato--.
message ChangePasswordRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

// Existe porque el envio del registro es best effort: sin esta operacion, un
// encolado fallido deja al usuario esperando un correo que no va a llegar.
message ResendVerificationEmailRequest {
  string user_id = 1;
}

message ResendVerificationEmailResponse {
  bool sent = 1;
  string message = 2;
}

message GetAccountVerificationRequest {
  string user_id = 1;
}

message GetAccountVerificationResponse {
  bool is_email_verified = 1;
  bool is_phone_verified = 2;
  string email = 3;
  string phone = 4;
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  bool success = 1;
  string message = 2;
  string accessToken = 3;
  string refreshToken = 4;
}

message SendOtpRequest {
  string phoneNumber = 1;
}

message SendOtpResponse {
  bool success = 1;
  string message = 2;
  string expiresAt = 3;
  int32 retryAfterSeconds = 4;
}

message VerifyOtpRequest {
  string phoneNumber = 1;
  string otpCode = 2;
}

message VerifyOtpResponse {
  bool success = 1;
  string message = 2;
  string accessToken = 3;
  string refreshToken = 4;
  bool isNewUser = 5;
  int32 attemptsRemaining = 6;
}

message LogoutRequest {
  string refreshToken = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// ROLE MANAGEMENT MESSAGES (NEW - Sprint 3)
// ============================================================================

message AssignRoleRequest {
  string user_id = 1;         // UUID of user to assign role to
  string role_slug = 2;        // "client", "vet", or "admin"
  string assigned_by = 3;      // UUID of admin assigning the role
  optional string reason = 4;  // Optional reason for audit trail
}

message AssignRoleResponse {
  bool success = 1;
  string message = 2;
  RoleAssignment assignment = 3;
}

message GetUserRolesRequest {
  string user_id = 1;
}

message GetUserRolesResponse {
  repeated RoleAssignment roles = 1;
  string user_type = 2;  // Computed: "client", "vet", "both", "admin"
}

message RemoveRoleRequest {
  string user_id = 1;
  string role_slug = 2;
  string removed_by = 3;
  optional string reason = 4;
}

message RemoveRoleResponse {
  bool success = 1;
  string message = 2;
}

message RoleAssignment {
  string role_id = 1;
  string role_slug = 2;
  string role_name = 3;
  string assigned_at = 4;  // ISO 8601 timestamp
  string assigned_by = 5;  // UUID of assigner (if available)
}

// ============================================================================
// HARD DELETE (Testing Utility)
// ============================================================================

message HardDeleteUserRequest {
  string user_id = 1;
}

message HardDeleteUserResponse {
  bool success = 1;
  string message = 2;
  int32 deleted_count = 3;
}

// ============================================================================
// FIND USER BY EMAIL (Admin utility)
// ============================================================================

message FindUserByEmailRequest {
  string email = 1;
}

message FindUserByEmailResponse {
  string user_id = 1;
  string email = 2;
  bool is_active = 3;
  bool is_email_verified = 4;
  string created_at = 5;
  repeated string roles = 6;
  string user_type = 7;
}

message GetUserContactRequest {
  string user_id = 1;
}

message GetUserContactResponse {
  string user_id = 1;
  string email = 2;

  // Una cuenta desactivada o con el correo sin verificar sigue teniendo
  // direccion. Quien avisa decide si escribirle; este servicio no lo decide por
  // el ni devuelve vacio, que se leeria como "no tiene correo".
  bool is_active = 3;
  bool is_email_verified = 4;
}

// Admin: paginated listing of ALL accounts.
message ListUsersRequest {
  int32 limit = 1;          // default 50, max 200
  int32 offset = 2;
  string search = 3;        // optional: case-insensitive email/phone substring
  string role_slug = 4;     // optional: filter by role ("client" | "vet" | "admin")
  string active_filter = 5; // optional: "active" | "inactive" | "" (all)

  // B-5 — "verified" | "unverified" | "" (todos). Mismo idioma que
  // `active_filter`: un bool no distinguiria "sin verificar" de "sin filtro".
  // El dato ya viaja por fila en `UserSummary.is_email_verified`; esto permite
  // que el KPI "Sin verificar email" salga con un total y no contando una pagina.
  string email_verified_filter = 6;
}

message UserSummary {
  string user_id = 1;
  string email = 2;
  string phone = 3;
  bool is_active = 4;
  bool is_email_verified = 5;
  repeated string roles = 6;
  string user_type = 7;     // computed: "client" | "vet" | "both" | "admin" | ""
  string created_at = 8;
}

message ListUsersResponse {
  repeated UserSummary users = 1;
  int32 total_count = 2;
}
// ═══════════════════════════════════════════════════════════════════════════
// DOCUMENTOS LEGALES
// ═══════════════════════════════════════════════════════════════════════════

message LegalDocument {
  string id = 1;
  string doc_type = 2;          // 'terms' | 'privacy'
  int32 version = 3;
  string locale = 4;
  string title = 5;
  string body_md = 6;
  string body_hash = 7;         // sha256 hex; se guarda en la aceptación
  bool requires_reaccept = 8;
  bool is_active = 9;
  string published_at = 10;     // ISO-8601
  string published_by_user_id = 11;
  string notes = 12;

  // B-5 — cuantas personas aceptaron ESTE texto. Se cuenta por `body_hash`, no
  // por (doc_type, version): `terms_acceptances` no guarda `locale`, y dos
  // idiomas comparten numero de version, asi que contar por version sumaria
  // las dos traducciones en la misma cifra.
  //
  // `optional` a proposito. Solo lo rellena `ListLegalDocuments`, que es la
  // consulta de admin; `GetLegalDocument` esta en el camino caliente de aceptar
  // los terminos y no paga un COUNT por llamada. Sin presencia explicita, ese
  // cero significaria "nadie lo ha aceptado" cuando en realidad significa "no
  // se conto", que es la afirmacion contraria.
  optional int32 acceptance_count = 13;
}

message GetLegalDocumentRequest {
  string doc_type = 1;
  string locale = 2;            // vacío = es-CO
  // Opcional: una versión concreta. Vacío = la vigente. Sirve para releer lo
  // que alguien aceptó en su momento.
  int32 version = 3;
}

message LegalDocumentResponse {
  LegalDocument document = 1;
}

message AcceptLegalDocumentRequest {
  string user_id = 1;
  string doc_type = 2;
  int32 version = 3;
  string body_hash = 4;         // el hash de lo que REALMENTE se mostró
  string locale = 5;
  // Contexto de la aceptación (evidencia)
  string ip = 6;
  string user_agent = 7;
  string app_version = 8;
  string device_id = 9;
}

message AcceptLegalDocumentResponse {
  bool accepted = 1;
  string accepted_at = 2;
}

message PendingLegalAcceptance {
  string doc_type = 1;
  int32 version = 2;
  string title = 3;
  string locale = 4;
}

message GetPendingLegalAcceptancesRequest {
  string user_id = 1;
  string locale = 2;
}

message GetPendingLegalAcceptancesResponse {
  repeated PendingLegalAcceptance pending = 1;
}

message PublishLegalDocumentRequest {
  string doc_type = 1;
  string locale = 2;
  string title = 3;
  string body_md = 4;
  bool requires_reaccept = 5;
  string published_by_user_id = 6;
  string notes = 7;
}

message ListLegalDocumentsRequest {
  string doc_type = 1;
  string locale = 2;
}

message ListLegalDocumentsResponse {
  repeated LegalDocument documents = 1;
}
