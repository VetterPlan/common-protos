syntax = "proto3";

package auth;

service AuthService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (LoginResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc SendOtp(SendOtpRequest) returns (SendOtpResponse);
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc RequestPasswordReset (RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc ResendVerificationEmail (ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse);
  rpc GetAccountVerification (GetAccountVerificationRequest) returns (GetAccountVerificationResponse);
  rpc AssignRole (AssignRoleRequest) returns (AssignRoleResponse);
  rpc GetUserRoles (GetUserRolesRequest) returns (GetUserRolesResponse);
  rpc RemoveRole (RemoveRoleRequest) returns (RemoveRoleResponse);
  rpc HardDeleteUser (HardDeleteUserRequest) returns (HardDeleteUserResponse);
  rpc RequestAccountDeletion (RequestAccountDeletionRequest) returns (AccountDeletionResponse);
  rpc AdminRequestAccountDeletion (AdminRequestAccountDeletionRequest) returns (AccountDeletionResponse);
  rpc ConfirmAccountDeletion (AccountDeletionTokenRequest) returns (AccountDeletionResponse);
  rpc CancelAccountDeletionByToken (AccountDeletionTokenRequest) returns (AccountDeletionResponse);
  rpc ExecuteAccountDeletionNow (AccountDeletionTokenRequest) returns (AccountDeletionResponse);
  rpc GetAccountDeletionByToken (AccountDeletionTokenRequest) returns (AccountDeletionResponse);
  rpc CancelAccountDeletion (CancelAccountDeletionRequest) returns (AccountDeletionResponse);
  rpc GetAccountDeletionStatus (GetAccountDeletionStatusRequest) returns (AccountDeletionResponse);
  rpc ListStuckAccountDeletions (ListStuckAccountDeletionsRequest) returns (ListStuckAccountDeletionsResponse);
  rpc ExportUserData (ExportUserDataRequest) returns (ExportUserDataResponse);
  rpc FindUserByEmail (FindUserByEmailRequest) returns (FindUserByEmailResponse);
  rpc GetUserContact (GetUserContactRequest) returns (GetUserContactResponse);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc GetLegalDocument (GetLegalDocumentRequest) returns (LegalDocumentResponse);
  rpc AcceptLegalDocument (AcceptLegalDocumentRequest) returns (AcceptLegalDocumentResponse);
  rpc GetPendingLegalAcceptances (GetPendingLegalAcceptancesRequest) returns (GetPendingLegalAcceptancesResponse);
  rpc PublishLegalDocument (PublishLegalDocumentRequest) returns (LegalDocumentResponse);
  rpc ListLegalDocuments (ListLegalDocumentsRequest) returns (ListLegalDocumentsResponse);

  // Canal de habeas data (Ley 1581): consultas (10 dias habiles) y reclamos
  // (15), con vencimiento calculado al radicar y prorroga unica informada.
  rpc SubmitDataRightsRequest (SubmitDataRightsRequestRequest) returns (DataRightsRequestResponse);
  rpc ListMyDataRightsRequests (ListMyDataRightsRequestsRequest) returns (DataRightsRequestsResponse);
  rpc AdminListDataRightsRequests (AdminListDataRightsRequestsRequest) returns (DataRightsRequestsResponse);
  rpc AdminResolveDataRightsRequest (AdminResolveDataRightsRequestRequest) returns (DataRightsRequestResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message RegisterRequest {
    string username = 1;
    string password = 2;
    string email = 3;
    string phone = 4;
}

message RegisterResponse {
    string message = 1;
    bool success = 2;
    string user_id = 3;
}

message LoginResponse {
  string accessToken = 1;
  string refreshToken = 2;
}

message RefreshTokenRequest {
  string refreshToken = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string name = 3;
  string email = 4;
  repeated string roles = 5;  // CHANGED: from string to repeated string
  string user_type = 6;       // NEW: "client", "vet", "both", or "admin"
  bool is_email_verified = 7; // NEW: renamed from is_verified
  string jti = 8;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  bool success = 1;
  string message = 2;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
}

message ChangePasswordRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

message ResendVerificationEmailRequest {
  string user_id = 1;
}

message ResendVerificationEmailResponse {
  bool sent = 1;
  string message = 2;
}

message GetAccountVerificationRequest {
  string user_id = 1;
}

message GetAccountVerificationResponse {
  bool is_email_verified = 1;
  bool is_phone_verified = 2;
  string email = 3;
  string phone = 4;
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  bool success = 1;
  string message = 2;
  string accessToken = 3;
  string refreshToken = 4;
}

message SendOtpRequest {
  string phoneNumber = 1;
  string purpose = 2;      // "" (login, comportamiento historico) | "registration"
}

message SendOtpResponse {
  bool success = 1;
  string message = 2;
  string expiresAt = 3;
  int32 retryAfterSeconds = 4;
}

message VerifyOtpRequest {
  string phoneNumber = 1;
  string otpCode = 2;
}

message VerifyOtpResponse {
  bool success = 1;
  string message = 2;
  string accessToken = 3;
  string refreshToken = 4;
  bool isNewUser = 5;
  int32 attemptsRemaining = 6;
}

message LogoutRequest {
  string refreshToken = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// ROLE MANAGEMENT MESSAGES (NEW - Sprint 3)
// ============================================================================

message AssignRoleRequest {
  string user_id = 1;         // UUID of user to assign role to
  string role_slug = 2;        // "client", "vet", or "admin"
  string assigned_by = 3;      // UUID of admin assigning the role
  optional string reason = 4;  // Optional reason for audit trail
}

message AssignRoleResponse {
  bool success = 1;
  string message = 2;
  RoleAssignment assignment = 3;
}

message GetUserRolesRequest {
  string user_id = 1;
}

message GetUserRolesResponse {
  repeated RoleAssignment roles = 1;
  string user_type = 2;  // Computed: "client", "vet", "both", "admin"
}

message RemoveRoleRequest {
  string user_id = 1;
  string role_slug = 2;
  string removed_by = 3;
  optional string reason = 4;
}

message RemoveRoleResponse {
  bool success = 1;
  string message = 2;
}

message RoleAssignment {
  string role_id = 1;
  string role_slug = 2;
  string role_name = 3;
  string assigned_at = 4;  // ISO 8601 timestamp
  string assigned_by = 5;  // UUID of assigner (if available)
}

// ============================================================================
// HARD DELETE (Testing Utility)
// ============================================================================

// ═══════════════════════════════════════════════════════════════════════════
// BAJA DE CUENTA
// ═══════════════════════════════════════════════════════════════════════════

message AccountDeletionStep {
  string service = 1;
  string verb = 2;         // borra | anonimiza | conserva
  string state = 3;        // hecho | pendiente | fallido | conserva
  string detail = 4;
}

message AccountDeletion {
  string id = 1;
  string status = 2;       // requested | running | done | incomplete | blocked | cancelled
  string requested_at = 3;
  string scheduled_for = 4;
  string completed_at = 5;
  string cancelled_at = 6;
  int32 attempts = 7;
  repeated AccountDeletionStep steps = 8;
  string blocked_reason = 9;
}

message RequestAccountDeletionRequest {
  string user_id = 1;
  string ip = 2;
  string user_agent = 3;
  string password = 4;
  string otp_code = 5;
}

message AdminRequestAccountDeletionRequest {
  string user_id = 1;
  string admin_user_id = 2;
  string reason = 3;
  string ip = 4;
  string user_agent = 5;
  bool execute_now = 6;
}

message AccountDeletionTokenRequest {
  string token = 1;
  string ip = 2;
  string user_agent = 3;
}

message StuckAccountDeletion {
  string id = 1;
  string user_id = 2;
  string status = 3;
  string scheduled_for = 4;
  int32 attempts = 5;
  int32 days_stuck = 6;
  repeated AccountDeletionStep steps = 7;
}

message ListStuckAccountDeletionsRequest {
  int32 limit = 1;
}

message ListStuckAccountDeletionsResponse {
  repeated StuckAccountDeletion deletions = 1;
  int32 total_count = 2;
}

message ExportUserDataRequest {
  string user_id = 1;
}

message ExportedSection {
  string service = 1;
  string state = 2;      // hecho | pendiente | fallido
  string detail = 3;
  string payload_json = 4;
}

message ExportUserDataResponse {
  string user_id = 1;
  string generated_at = 2;
  bool complete = 3;
  repeated ExportedSection sections = 4;
}

message CancelAccountDeletionRequest {
  string user_id = 1;
}

message GetAccountDeletionStatusRequest {
  string user_id = 1;
}

message AccountDeletionResponse {
  AccountDeletion deletion = 1;
  string outcome = 2;      // scheduled | confirmation_email_sent
}

message HardDeleteUserRequest {
  string user_id = 1;
}

message HardDeleteUserResponse {
  bool success = 1;
  string message = 2;
  int32 deleted_count = 3;
}

// ============================================================================
// FIND USER BY EMAIL (Admin utility)
// ============================================================================

message FindUserByEmailRequest {
  string email = 1;
}

message FindUserByEmailResponse {
  string user_id = 1;
  string email = 2;
  bool is_active = 3;
  bool is_email_verified = 4;
  string created_at = 5;
  repeated string roles = 6;
  string user_type = 7;
}

message GetUserContactRequest {
  string user_id = 1;
}

message GetUserContactResponse {
  string user_id = 1;
  string email = 2;
  bool is_active = 3;
  bool is_email_verified = 4;
  // Telefono del usuario, tal como lo registro en auth (la UNICA fuente:
  // users.phone). Vacio = no tiene; el consumidor no fabrica un valor.
  string phone = 5;
}

message ListUsersRequest {
  int32 limit = 1;          // default 50, max 200
  int32 offset = 2;
  string search = 3;        // optional: case-insensitive email/phone substring
  string role_slug = 4;     // optional: filter by role ("client" | "vet" | "admin")
  string active_filter = 5; // optional: "active" | "inactive" | "" (all)
  string email_verified_filter = 6;
}

message UserSummary {
  string user_id = 1;
  string email = 2;
  string phone = 3;
  bool is_active = 4;
  bool is_email_verified = 5;
  repeated string roles = 6;
  string user_type = 7;     // computed: "client" | "vet" | "both" | "admin" | ""
  string created_at = 8;
}

message ListUsersResponse {
  repeated UserSummary users = 1;
  int32 total_count = 2;
}
// ═══════════════════════════════════════════════════════════════════════════
// DOCUMENTOS LEGALES
// ═══════════════════════════════════════════════════════════════════════════

message LegalDocument {
  string id = 1;
  string doc_type = 2;          // 'terms' | 'privacy'
  int32 version = 3;
  string locale = 4;
  string title = 5;
  string body_md = 6;
  string body_hash = 7;         // sha256 hex; se guarda en la aceptación
  bool requires_reaccept = 8;
  bool is_active = 9;
  string published_at = 10;     // ISO-8601
  string published_by_user_id = 11;
  string notes = 12;
  optional int32 acceptance_count = 13;
}

message GetLegalDocumentRequest {
  string doc_type = 1;
  string locale = 2;            // vacío = es-CO
  int32 version = 3;
}

message LegalDocumentResponse {
  LegalDocument document = 1;
}

message AcceptLegalDocumentRequest {
  string user_id = 1;
  string doc_type = 2;
  int32 version = 3;
  string body_hash = 4;         // el hash de lo que REALMENTE se mostró
  string locale = 5;
  string ip = 6;
  string user_agent = 7;
  string app_version = 8;
  string device_id = 9;
}

message AcceptLegalDocumentResponse {
  bool accepted = 1;
  string accepted_at = 2;
}

message PendingLegalAcceptance {
  string doc_type = 1;
  int32 version = 2;
  string title = 3;
  string locale = 4;
}

message GetPendingLegalAcceptancesRequest {
  string user_id = 1;
  string locale = 2;
}

message GetPendingLegalAcceptancesResponse {
  repeated PendingLegalAcceptance pending = 1;
}

message PublishLegalDocumentRequest {
  string doc_type = 1;
  string locale = 2;
  string title = 3;
  string body_md = 4;
  bool requires_reaccept = 5;
  string published_by_user_id = 6;
  string notes = 7;
}

message ListLegalDocumentsRequest {
  string doc_type = 1;
  string locale = 2;
}

message ListLegalDocumentsResponse {
  repeated LegalDocument documents = 1;
}

message DataRightsRequest {
  string id = 1;
  string user_id = 2;
  string category = 3;      // 'consulta' | 'reclamo'
  string message = 4;
  string status = 5;        // recibida | en_tramite | incompleta | respondida | desistida
  string due_at = 6;        // ISO8601: cuando vence el plazo legal
  bool extended = 7;        // la prorroga (5/8 habiles) ya se ejercio
  string response = 8;
  string responded_by = 9;
  string responded_at = 10;
  string created_at = 11;
}

message SubmitDataRightsRequestRequest {
  string user_id = 1;
  string category = 2;      // 'consulta' | 'reclamo'
  string message = 3;
}

message ListMyDataRightsRequestsRequest {
  string user_id = 1;
}

message AdminListDataRightsRequestsRequest {
  string status = 1;        // vacio = las abiertas (recibida, en_tramite, incompleta)
  int32 limit = 2;
}

message AdminResolveDataRightsRequestRequest {
  string request_id = 1;
  string admin_user_id = 2;
  string action = 3;        // respond | extend | mark_incomplete | desist
  string response = 4;      // obligatorio en respond; opcional en el resto
}

message DataRightsRequestResponse {
  DataRightsRequest request = 1;
}

message DataRightsRequestsResponse {
  repeated DataRightsRequest requests = 1;
}
