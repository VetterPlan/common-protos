syntax = "proto3";

package constancia;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ═══════════════════════════════════════════════════════════════════════════
// CONSTANCIA SERVICE — Sistema Operativo de Confianza
//
// No es un chatbot. Es el registro probatorio de la relación con cada usuario:
// investiga con evidencia trazable, emite recibos firmados y compromisos
// exigibles que se cumplen solos o se compensan solos.
//
// Diseño: docs/DESIGN_CONSTANCIA_TRUST_OS.md (producto)
//         docs/DESIGN_CONSTANCIA_ARQUITECTURA.md (ingeniería)
//
// Contratos que NO se pueden romper:
//   1. Todo hecho que llega al usuario viaja como FactCard con procedencia.
//      El motor de razonamiento nunca redacta cifras, fechas ni estados.
//   2. Toda acción produce un Receipt firmado con `verify_hint`: cómo
//      comprobarlo SIN nosotros.
//   3. Todo compromiso lleva un verificador computable y una fecha. Si se
//      incumple, la remediación se ejecuta sin que el usuario pregunte.
//   4. AdjustPlan existe a propósito: la aversión al algoritmo desaparece
//      cuando la persona puede MODIFICAR el resultado, no solo aceptarlo.
//   5. RequestHuman nunca tiene fricción. La disposición a ser saltada es en
//      sí la señal que gana la confianza.
// ═══════════════════════════════════════════════════════════════════════════

service ConstanciaService {
  rpc OpenCase        (OpenCaseRequest)        returns (CaseResponse);
  rpc GetCase         (GetCaseRequest)         returns (CaseResponse);
  rpc ListUserCases   (ListUserCasesRequest)   returns (ListUserCasesResponse);
  rpc AdminListCases  (AdminListCasesRequest)  returns (AdminListCasesResponse);
  rpc GetTrustMetrics (TrustMetricsRequest)   returns (TrustMetricsResponse);
  rpc SendMessage     (SendMessageRequest)     returns (CaseResponse);
  rpc ConfirmPlan     (ConfirmPlanRequest)     returns (CaseResponse);
  rpc AdjustPlan      (AdjustPlanRequest)      returns (CaseResponse);
  rpc CloseCase       (CloseCaseRequest)       returns (CaseResponse);
  rpc RequestHuman    (RequestHumanRequest)    returns (HandoffResponse);
  rpc GetHandoffBrief (GetHandoffBriefRequest) returns (HandoffBrief);
  rpc GetOpeningState (GetOpeningStateRequest) returns (OpeningState);
  rpc GetCommitments  (GetCommitmentsRequest)  returns (CommitmentList);
  rpc GetReceipt      (GetReceiptRequest)      returns (Receipt);
  rpc VerifyReceipt   (VerifyReceiptRequest)   returns (VerifyReceiptResponse);
  rpc GetMemory       (GetMemoryRequest)       returns (MemoryList);
  rpc ForgetMemory    (ForgetMemoryRequest)    returns (ForgetProof);
  rpc IngestSignal    (IngestSignalRequest)    returns (IngestSignalResponse);
  rpc ListCaseMessages (ListCaseMessagesRequest) returns (CaseMessageList);
  rpc MarkCaseMessagesRead (MarkCaseMessagesReadRequest) returns (CaseReadState);
  rpc ProposeRepair (ProposeRepairRequest) returns (CaseResponse);
  rpc GetActionCatalog (GetActionCatalogRequest) returns (ActionCatalogResponse);
}

// ─── Contexto de acceso ────────────────────────────────────────────────────
// Lo arma la gateway desde el JWT. NUNCA lo manda el cliente.

enum RequesterRole {
  REQUESTER_ROLE_UNSPECIFIED = 0;
  REQUESTER_ROLE_CLIENT      = 1;
  REQUESTER_ROLE_VET         = 2;
  REQUESTER_ROLE_ADMIN       = 3;
  REQUESTER_ROLE_SYSTEM      = 4;
}

message AccessContext {
  string        requester_user_id = 1;
  RequesterRole role              = 2;
  string        break_glass_reason = 3;
}

// ─── Estados ───────────────────────────────────────────────────────────────

enum CaseState {
  CASE_STATE_UNSPECIFIED           = 0;
  CASE_STATE_OPENED                = 1;
  CASE_STATE_INVESTIGATING         = 2;
  CASE_STATE_DIAGNOSED             = 3;
  CASE_STATE_PLANNED               = 4;
  CASE_STATE_AWAITING_CONFIRMATION = 5;
  CASE_STATE_EXECUTING             = 6;
  CASE_STATE_MONITORING            = 7;
  CASE_STATE_RESOLVED              = 8;
  CASE_STATE_ESCALATED             = 9;
  CASE_STATE_FAILED                = 10;
  CASE_STATE_CLOSED                = 11;
}

enum Confidence {
  CONFIDENCE_UNSPECIFIED  = 0;
  CONFIDENCE_VERIFIED     = 1;
  CONFIDENCE_INFERRED     = 2;
  CONFIDENCE_THIRD_PARTY  = 3;
  CONFIDENCE_UNKNOWN      = 4;
}

enum Blame {
  BLAME_UNSPECIFIED  = 0;
  BLAME_VETTERPLAN   = 1;
  BLAME_USER         = 2;
  BLAME_VET          = 3;
  BLAME_THIRD_PARTY  = 4;
  BLAME_NONE         = 5;
  BLAME_UNDETERMINED = 6;
}

// ─── Evidencia ─────────────────────────────────────────────────────────────

message Provenance {
  string                    service     = 1;
  string                    query       = 2;
  google.protobuf.Timestamp observed_at = 3;
  string                    event_id    = 4;
}

message FactCard {
  string                 id           = 1;
  string                 type         = 2;
  string                 rendered     = 3;
  google.protobuf.Struct values       = 4;
  Provenance             provenance   = 5;
  Confidence             confidence   = 6;
  int32                  freshness_s  = 7;
}

message UnverifiedCheck {
  string tool             = 1;
  string reason           = 2;
  bool   affects_outcome  = 3;
  string tool_label       = 4;
  string reason_text      = 5;
  string detail           = 6;
}

// ─── Acciones y constancias ────────────────────────────────────────────────

message PlannedAction {
  string                 intent            = 1;
  string                 describes         = 2;
  google.protobuf.Struct params            = 3;
  bool                   reversible        = 4;
  string                 money_delta_cop   = 5;
  repeated string        adjustable_params = 6;
}

enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED           = 0;
  PLAN_STATUS_DRAFT                 = 1;
  PLAN_STATUS_APPROVED              = 2;
  PLAN_STATUS_REJECTED              = 3;
  PLAN_STATUS_AWAITING_CONFIRMATION = 4;
  PLAN_STATUS_CONFIRMED             = 5;
  PLAN_STATUS_EXECUTING             = 6;
  PLAN_STATUS_EXECUTED              = 7;
  PLAN_STATUS_FAILED                = 8;
}

message ActionPlan {
  string                 id                     = 1;
  repeated PlannedAction actions                = 2;
  google.protobuf.Struct resulting_state        = 3;
  string                 total_money_cop        = 4;
  bool                   requires_confirmation  = 5;
  int32                  risk_level             = 6;
  PlanStatus             status                 = 7;
  repeated GuardianObjection objections        = 8;
}

message GuardianObjection {
  string kind   = 1;
  string intent = 2;
  string detail = 3;
}

// ─── Catálogo de acciones ──────────────────────────────────────────────────

message ActionParamSpec {
  string          name     = 1;
  string          label    = 2;
  ActionParamKind kind     = 3;
  bool            required = 4;
  string          help     = 5;
  repeated string options  = 6;
}

enum ActionParamKind {
  ACTION_PARAM_KIND_UNSPECIFIED = 0;
  ACTION_PARAM_KIND_AMOUNT_COP  = 1;
  ACTION_PARAM_KIND_TEXT        = 2;
  ACTION_PARAM_KIND_DAYS        = 3;
  ACTION_PARAM_KIND_UUID        = 4;
  ACTION_PARAM_KIND_CHOICE      = 5;
}

message ActionCatalogEntry {
  string                   intent                = 1;
  string                   label                 = 2;
  string                   description           = 3;
  repeated ActionParamSpec params                = 4;
  bool                     requires_confirmation = 5;
  int32                    risk_level            = 6;
  bool                     benefits_user_only    = 7;
}

message GetActionCatalogRequest {
  string        case_id = 1;
  AccessContext access  = 2;
}

message ActionCatalogResponse {
  repeated ActionCatalogEntry actions = 1;
}

message Receipt {
  string                    id           = 1;
  string                    case_id      = 2;
  string                    intent       = 3;
  google.protobuf.Struct    what         = 4;
  string                    external_ref = 5;
  string                    verify_hint  = 6;
  string                    signature    = 7;
  google.protobuf.Timestamp created_at   = 8;
}

message VerifyReceiptRequest  { string receipt_id = 1; }
message VerifyReceiptResponse { bool valid = 1; string detail = 2; }
message GetReceiptRequest     { string receipt_id = 1; AccessContext access = 2; }

// ─── Compromisos ───────────────────────────────────────────────────────────

enum CommitmentStatus {
  COMMITMENT_STATUS_UNSPECIFIED = 0;
  COMMITMENT_STATUS_PENDING     = 1;
  COMMITMENT_STATUS_KEPT        = 2;
  COMMITMENT_STATUS_BROKEN      = 3;
  COMMITMENT_STATUS_CANCELLED   = 4;
}

message Commitment {
  string                    id          = 1;
  string                    case_id     = 2;
  string                    text        = 3;
  google.protobuf.Timestamp due_at      = 4;
  CommitmentStatus          status      = 5;
  string                    remediation = 6;
}

message GetCommitmentsRequest { string user_id = 1; AccessContext access = 2; }
message CommitmentList {
  repeated Commitment commitments = 1;
  int32 kept_total   = 2;
  int32 broken_total = 3;
}

// ─── Caso ──────────────────────────────────────────────────────────────────

message CaseTimelineEntry {
  google.protobuf.Timestamp at      = 1;
  string                    type    = 2;
  string                    actor   = 3;
  google.protobuf.Struct    payload = 4;
  string                    label   = 5;
}

enum CaseMessageAuthor {
  CASE_MESSAGE_AUTHOR_UNSPECIFIED = 0;
  CASE_MESSAGE_AUTHOR_OWNER       = 1;
  CASE_MESSAGE_AUTHOR_TEAM        = 2;
}

message CaseMessage {
  int64                     seq     = 1;
  CaseMessageAuthor         author  = 2;
  string                    text    = 3;
  google.protobuf.Timestamp sent_at = 4;
}

message ListCaseMessagesRequest {
  string        case_id   = 1;
  int64         after_seq = 2;
  int32         limit     = 3;
  AccessContext access    = 4;
}

message CaseMessageList {
  repeated CaseMessage messages = 1;
  int64                last_seq = 2;
  bool                 has_more = 3;
  int64                other_side_read_up_to_seq = 4;
}

message MarkCaseMessagesReadRequest {
  string        case_id   = 1;
  int64         up_to_seq = 2;
  AccessContext access    = 3;
}

message ProposedAction {
  string                 intent = 1;
  map<string, string>    params = 2;
}

message ProposeRepairRequest {
  string                  case_id       = 1;
  repeated ProposedAction actions       = 2;
  string                  justification = 3;
  AccessContext           access        = 4;
}

message CaseReadState {
  string case_id                   = 1;
  int64  read_up_to_seq            = 2;
  int64  other_side_read_up_to_seq = 3;
}

message Case {
  string                     id             = 1;
  string                     user_id        = 2;
  string                     subject_type   = 3;
  string                     subject_id     = 4;
  CaseState                  state          = 5;
  string                     shape          = 6;
  string                     diagnosis      = 7;
  // El mismo diagnóstico en palabras. Es el titular de la pantalla: mostrar
  // `diagnosis` en crudo pone `evidencia_incompleta` como encabezado.
  string                     diagnosis_text = 24;
  Blame                      blame          = 8;
  double                     confidence     = 9;
  repeated FactCard          facts          = 10;
  repeated UnverifiedCheck   unverified     = 11;
  ActionPlan                 plan           = 12;
  repeated Receipt           receipts       = 13;
  repeated Commitment        commitments    = 14;
  repeated CaseTimelineEntry timeline       = 15;
  string                     message        = 16;
  google.protobuf.Timestamp  opened_at      = 17;
  google.protobuf.Timestamp  resolved_at    = 18;
  bool                       used_llm       = 19;
  string                     escalation_reason = 20;
  string                     escalation_text   = 23;
  Incident                   incident       = 21;
  CaseParty                  party          = 22;

  // ─── El sujeto y la guardia (B-3) ───
  //
  // Los cuatro estaban escritos en la tabla `cases` y no se podían preguntar:
  // la autoridad conocía el dato y el contrato no dejaba pedirlo.
  //
  // Los dos perfiles son los que conocen payment y appointment de cada parte,
  // NO el `user_id` de auth de arriba: son identidades distintas y confundirlas
  // no da error, devuelve vacío. Viajan **solo para el equipo** — un caso puede
  // llevar el perfil de la contraparte (la matriz de identidad lo permite en
  // varias celdas) y el titular no tiene por qué recibirlo.
  string                     client_profile_id = 25;
  string                     vet_profile_id    = 26;

  // Cuándo el TITULAR tuvo la salida al humano delante. Es el denominador del
  // KPI de elección voluntaria, y se sella una sola vez. **No es "desde cuándo
  // espera": eso es `escalated_at`.**
  google.protobuf.Timestamp  human_offered_at  = 27;

  // El administrador de guardia que lleva el caso: un `user_id` de auth, no un
  // equipo. Viaja **solo para el equipo**: a quién le tocó un escalado es
  // topología nuestra, no información del titular.
  string                     escalated_to      = 28;

  // Desde cuándo espera a una persona. Sale del último evento de escalado, no
  // de una columna: un caso se puede reabrir y volver a escalar, y la cola mide
  // la espera en curso. Ausente si el caso nunca escaló.
  google.protobuf.Timestamp  escalated_at      = 29;
}

enum CaseParty {
  CASE_PARTY_UNSPECIFIED = 0;
  CASE_PARTY_CLIENT      = 1;
  CASE_PARTY_VET         = 2;
}

enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_SUSPECTED   = 1;
  INCIDENT_STATUS_CONFIRMED   = 2;
  INCIDENT_STATUS_RESOLVED    = 3;
  INCIDENT_STATUS_DISMISSED   = 4;
}

message Incident {
  string                    ref            = 1;   // INC-2026-A1B2C3
  string                    type           = 2;
  IncidentStatus            status         = 3;
  string                    severity       = 4;
  int32                     affected_cases = 5;
  google.protobuf.Timestamp first_seen_at  = 6;
  google.protobuf.Timestamp resolved_at    = 7;
}

message CaseResponse { Case case = 1; }

message OpenCaseRequest {
  string                 user_id      = 1;
  string                 subject_type = 2;
  string                 subject_id   = 3;
  string                 trigger      = 4;
  string                 user_text    = 5;
  google.protobuf.Struct payload      = 6;
  AccessContext          access       = 7;
}

message GetCaseRequest       { string case_id = 1; AccessContext access = 2; }
message ListUserCasesRequest {
  string        user_id   = 1;
  bool          only_open = 2;
  AccessContext access    = 3;
  int32         limit     = 4;
}
message ListUserCasesResponse { repeated Case cases = 1; }

message AdminListCasesRequest {
  repeated CaseState states = 1;   // vacío = solo los abiertos
  string        shape       = 2;   // filtro opcional por forma
  int32         limit       = 3;
  int32         offset      = 4;
  AccessContext access      = 5;
}

message TrustMetricsRequest {
  int32         window_days = 1;   // 0 = 30
  AccessContext access      = 2;
}

message TrustMetricsResponse {
  int32  stayed              = 1;
  int32  chose_human         = 2;
  int32  moot                = 3;
  double voluntary_ratio     = 4;   // stayed / (stayed + chose_human); -1 si no hay datos
  int32  commitments_kept    = 5;
  int32  commitments_broken  = 6;
  int32  commitments_pending = 7;
  string unsolicited_value_cop = 8;
  int32  receipts_issued     = 9;
  int32  cases_total         = 10;
  int32  cases_escalated     = 11;
  int32  window_days         = 12;
}

message AdminListCasesResponse {
  repeated Case cases       = 1;
  int32         total_count = 2;
  int32         escalated_count = 3;
}

message SendMessageRequest {
  string        case_id = 1;
  string        text    = 2;
  AccessContext access  = 3;
}

message CloseCaseRequest {
  string        case_id = 1;
  string        reason  = 2;
  AccessContext access  = 3;
}

message ConfirmPlanRequest {
  string        case_id = 1;
  string        plan_id = 2;
  AccessContext access  = 3;
}

message AdjustPlanRequest {
  string                 case_id    = 1;
  string                 plan_id    = 2;
  google.protobuf.Struct adjustments = 3;
  AccessContext          access     = 4;
}

// ─── Puente al humano ──────────────────────────────────────────────────────

message RequestHumanRequest {
  string        case_id = 1;
  string        reason  = 2;
  AccessContext access  = 3;
}

message HandoffResponse {
  string           case_id           = 1;
  optional int32   estimated_wait_s  = 2;
  bool             accepted          = 3;
}

message GetHandoffBriefRequest { string case_id = 1; AccessContext access = 2; }

message HandoffBrief {
  string          case_id           = 1;
  string          one_line          = 2;
  repeated string established       = 3;
  repeated string unknown           = 4;
  repeated string promised          = 5;
  repeated string receipts          = 6;
  string          suggested_opening = 7;
  int32           cases_before      = 8;
  int32           commitments_kept  = 9;
  int32           times_we_failed   = 10;
  double          waited_seconds    = 11;
}

// ─── Apertura proactiva ────────────────────────────────────────────────────
// Lo que se pinta ANTES de que el usuario escriba nada. Constancia nunca abre
// con una pregunta: abre con lo que ya sabe.

message OpeningItem {
  string severity = 1;
  string headline = 2;
  string detail   = 3;
  string case_id  = 4;
  string action   = 5;
}

message GetOpeningStateRequest { string user_id = 1; AccessContext access = 2; }
message OpeningState {
  repeated OpeningItem items          = 1;
  repeated Commitment  open_promises  = 2;
  int32   human_wait_seconds          = 3;
}

// ─── Memoria de dos vías ───────────────────────────────────────────────────
// Visible y editable por el usuario. Solo se guarda una inferencia que estemos
// dispuestos a defender: por eso `evidence` viaja siempre.

message MemoryItem {
  string                    id         = 1;
  string                    kind       = 2;
  string                    content    = 3;
  string                    source     = 4;
  string                    evidence   = 5;
  google.protobuf.Timestamp learned_at = 6;
}

message GetMemoryRequest    { string user_id = 1; AccessContext access = 2; }
message MemoryList          { repeated MemoryItem items = 1; }
message ForgetMemoryRequest { string user_id = 1; string memory_id = 2; bool all = 3; AccessContext access = 4; }
message ForgetProof {
  repeated string           memory_ids   = 1;
  google.protobuf.Timestamp forgotten_at = 2;
  string                    digest       = 3;
}

// ─── Señales del bus ───────────────────────────────────────────────────────

message IngestSignalRequest {
  string                 trigger = 1;
  string                 user_id = 2;
  google.protobuf.Struct payload = 3;
}

message IngestSignalResponse {
  bool   accepted = 1;
  string case_id  = 2;
  string reason   = 3;
}
