syntax = "proto3";

package ecommerce;

service EcommerceService {
  rpc GetVisitPlan(GetVisitPlanRequest) returns (VisitPlan);
  rpc GetVisitPlanSettings(GetVisitPlanSettingsRequest) returns (VisitPlanSettings);
  rpc SetVisitPlanSettings(SetVisitPlanSettingsRequest) returns (VisitPlanSettings);
  rpc QuoteVisitProducts(QuoteVisitProductsRequest) returns (QuoteVisitProductsResponse);
  rpc HoldAppointmentProducts(HoldAppointmentProductsRequest) returns (HoldAppointmentProductsResponse);
  rpc GetAppointmentOrders(GetAppointmentOrdersRequest) returns (OrdersResponse);
  rpc NotifyWhenBackInStock(NotifyWhenBackInStockRequest) returns (NotifyWhenBackInStockResponse);
  rpc ListDeliveries(ListDeliveriesRequest) returns (OrdersResponse);
  rpc DispatchOrder(OrderActionRequest) returns (Order);
  rpc MarkOrderDelivered(OrderActionRequest) returns (Order);
  rpc RecordOrderNotApplied(RecordOrderNotAppliedRequest) returns (Order);
  rpc ListStoreProducts(ListStoreProductsRequest) returns (ListProductsResponse);
  rpc QuoteHomeOrder(QuoteHomeOrderRequest) returns (HomeOrderQuote);
  rpc CreateHomeOrder(CreateHomeOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc GetOrderOwner(GetOrderRequest) returns (GetOrderOwnerResponse);
  rpc ListClientOrders(ListClientOrdersRequest) returns (OrdersResponse);
  rpc CancelHomeOrder(CancelHomeOrderRequest) returns (Order);
  rpc RefundDefectiveOrder(RefundDefectiveOrderRequest) returns (Order);
  rpc ListHomeOrdersToDispatch(ListHomeOrdersToDispatchRequest) returns (OrdersResponse);
  rpc GetShippingSettings(GetShippingSettingsRequest) returns (ShippingSettings);
  rpc SetShippingSettings(SetShippingSettingsRequest) returns (ShippingSettings);
  rpc SuggestHomeProduct(SuggestHomeProductRequest) returns (HomeProductSuggestion);

  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  rpc SetProductActive(SetProductActiveRequest) returns (Product);
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);

  rpc ReceiveLot(ReceiveLotRequest) returns (StockMovement);
  rpc WriteOffStock(WriteOffStockRequest) returns (StockMovement);
  rpc AdjustStockCount(AdjustStockCountRequest) returns (StockMovement);
  rpc ListLots(ListLotsRequest) returns (ListLotsResponse);
  rpc ListStockMovements(ListStockMovementsRequest) returns (ListStockMovementsResponse);

  rpc GetInventoryAlerts(GetInventoryAlertsRequest) returns (InventoryAlerts);
}

message ClinicalReference {
  string table = 1;
  string id = 2;
}

message ProductFields {
  string name = 1;
  string presentation = 2;
  string description = 3;
  string photo_url = 4;
  string category = 5;
  string ica_registration = 6;
  string tariff_heading = 7;
  string vat_treatment = 8;
  string price = 9;
  bool requires_cold_chain = 10;
  int32 min_stock = 11;
  int32 max_stock = 12;
  ClinicalReference clinical_reference = 13;
  repeated string species = 14;
  string weight_min_kg = 15;
  string weight_max_kg = 16;
  string protection = 17;
  bool complementary = 18;
}

message StockSummary {
  int32 on_hand = 1;
  int32 available = 2;
  int32 sellable = 3;
  string nearest_expiry = 4;
}

message Product {
  string id = 1;
  ProductFields fields = 2;
  bool active = 3;
  StockSummary stock = 4;
  string created_at = 5;
  string updated_at = 6;
  string created_by = 7;
  string updated_by = 8;
}

message CreateProductRequest {
  string actor_user_id = 1;
  ProductFields fields = 2;
}

message UpdateProductRequest {
  string actor_user_id = 1;
  string product_id = 2;
  ProductFields fields = 3;
}

message SetProductActiveRequest {
  string actor_user_id = 1;
  string product_id = 2;
  bool active = 3;
}

message GetProductRequest {
  string product_id = 1;
}

message ListProductsRequest {
  bool active_only = 1;
  string category = 2;
}

message ListProductsResponse {
  repeated Product products = 1;
}

message Lot {
  string id = 1;
  string product_id = 2;
  string lot_number = 3;
  string expires_on = 4;
  int32 on_hand = 5;
  int32 available = 6;
  bool sellable = 7;
  string first_received_at = 8;
}

message StockMovement {
  string id = 1;
  string lot_id = 2;
  string product_id = 3;
  string lot_number = 4;
  string kind = 5;
  int32 quantity = 6;
  string unit_cost = 7;
  string supplier = 8;
  string supplier_invoice = 9;
  string reason = 10;
  string note = 11;
  string actor_user_id = 12;
  string created_at = 13;
  int32 lot_on_hand_after = 14;
}

message ReceiveLotRequest {
  string actor_user_id = 1;
  string product_id = 2;
  string lot_number = 3;
  string expires_on = 4;
  int32 quantity = 5;
  string unit_cost = 6;
  string supplier = 7;
  string supplier_invoice = 8;
}

message WriteOffStockRequest {
  string actor_user_id = 1;
  string lot_id = 2;
  int32 quantity = 3;
  string reason = 4;
  string note = 5;
}

message AdjustStockCountRequest {
  string actor_user_id = 1;
  string lot_id = 2;
  int32 counted_quantity = 3;
  string note = 4;
}

message ListLotsRequest {
  string product_id = 1;
  bool include_empty = 2;
}

message ListLotsResponse {
  repeated Lot lots = 1;
}

message ListStockMovementsRequest {
  string product_id = 1;
  string lot_id = 2;
  int32 limit = 3;
}

message ListStockMovementsResponse {
  repeated StockMovement movements = 1;
}

message GetInventoryAlertsRequest {}

message ProductAlert {
  string product_id = 1;
  string product_name = 2;
  string kind = 3;
  int32 stock = 4;
  int32 threshold = 5;
}

message LotAlert {
  string lot_id = 1;
  string product_id = 2;
  string product_name = 3;
  string lot_number = 4;
  string kind = 5;
  string expires_on = 6;
  int32 on_hand = 7;
}

message InventoryAlerts {
  repeated ProductAlert products = 1;
  repeated LotAlert lots = 2;
  string as_of = 3;
}

message GetVisitPlanRequest {
  string client_profile_id = 1;
  repeated string pet_ids = 2;
}

message PlanProduct {
  string product_id = 1;
  string name = 2;
  string presentation = 3;
  string description = 4;
  string photo_url = 5;
  string ica_registration = 6;
  string price = 7;
  bool requires_cold_chain = 8;
  string protection = 9;
}

message PlanRecommendation {
  PlanProduct product = 1;
  string dose_label = 2;
  string source = 3;
  string reason = 4;
}

message PlanMissingProduct {
  string protection = 1;
  string product_id = 2;
  string product_name = 3;
}

message PlanAppliedDose {
  string vaccine_name = 1;
  string date_administered = 2;
}

message PetVisitPlan {
  string pet_id = 1;
  string pet_name = 2;
  string outcome = 3;
  string reason = 4;
  repeated PlanRecommendation recommendations = 5;
  repeated PlanMissingProduct missing = 6;
  repeated PlanAppliedDose applied = 7;
  string next_vaccine_name = 8;
  string next_due_date = 9;
  repeated PlanProduct complementary = 10;
}

message VisitPlan {
  repeated PetVisitPlan pets = 1;
  string estimated_product_total = 2;
  string as_of = 3;
}

message GetVisitPlanSettingsRequest {}

message VisitPlanSettings {
  int32 young_max_age_months = 1;
  string dog_first_dose_protection = 2;
  string cat_first_dose_protection = 3;
}

message SetVisitPlanSettingsRequest {
  VisitPlanSettings settings = 1;
  string actor_user_id = 2;
}

message VisitProductsItem {
  string pet_id = 1;
  repeated string product_ids = 2;
}

message QuoteVisitProductsRequest {
  string client_profile_id = 1;
  repeated VisitProductsItem items = 2;
}

message QuotedLine {
  string product_id = 1;
  string product_name = 2;
  string presentation = 3;
  string unit_price = 4;
  int32 quantity = 5;
}

message PetProductsQuote {
  string pet_id = 1;
  repeated QuotedLine lines = 2;
  string total = 3;
}

message QuoteVisitProductsResponse {
  repeated PetProductsQuote pets = 1;
  string total = 2;
}

message HoldItem {
  string appointment_id = 1;
  string pet_id = 2;
  repeated string product_ids = 3;
}

message HoldAppointmentProductsRequest {
  string client_profile_id = 1;
  string group_id = 2;
  repeated HoldItem items = 3;
  string expected_product_total = 4;
  string window_start_utc = 5;
  string window_end_utc = 6;
  string arrives_by_utc = 7;
  string address_text = 8;
  string address_lat = 9;
  string address_lng = 10;
}

message OrderLine {
  string product_id = 1;
  string product_name = 2;
  string presentation = 3;
  string lot_id = 4;
  string lot_number = 5;
  string expires_on = 6;
  int32 quantity = 7;
  string unit_price = 8;
  bool requires_cold_chain = 9;
}

message Order {
  string id = 1;
  string client_profile_id = 2;
  string appointment_id = 3;
  string group_id = 4;
  string pet_id = 5;
  string status = 6;
  repeated OrderLine lines = 7;
  string total = 8;
  string window_start_utc = 9;
  string window_end_utc = 10;
  string arrives_by_utc = 11;
  string address_text = 12;
  string dispatched_at = 13;
  string delivered_at = 14;
  string closed_at = 15;
  string closed_reason = 16;
  bool chargeable = 17;
  string kind = 18;
  string shipping_fee = 19;
  string paid_at = 20;
}

message ListStoreProductsRequest {}

message CartItem {
  string product_id = 1;
  int32 quantity = 2;
}

message QuoteHomeOrderRequest {
  string client_profile_id = 1;
  string address_id = 2;
  repeated CartItem items = 3;
}

message HomeOrderQuote {
  string subtotal = 1;
  string shipping_fee = 2;
  string total = 3;
  string address_text = 4;
  repeated QuotedLine lines = 5;
}

message CreateHomeOrderRequest {
  string client_profile_id = 1;
  string address_id = 2;
  repeated CartItem items = 3;
  string expected_total = 4;
  string payment_method_id = 5;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderOwnerResponse {
  string client_profile_id = 1;
}

message ListClientOrdersRequest {
  string client_profile_id = 1;
}

message CancelHomeOrderRequest {
  string client_profile_id = 1;
  string order_id = 2;
}

message RefundDefectiveOrderRequest {
  string order_id = 1;
  string actor_user_id = 2;
  string note = 3;
}

message ListHomeOrdersToDispatchRequest {}

message GetShippingSettingsRequest {}

message ShippingSettings {
  bool configured = 1;
  string base_fee = 2;
  string fee_per_km = 3;
  string free_from_value = 4;
}

message SetShippingSettingsRequest {
  string actor_user_id = 1;
  ShippingSettings settings = 2;
}

message SuggestHomeProductRequest {
  string client_profile_id = 1;
  string pet_id = 2;
  string symptoms = 3;
  repeated string vet_plan_clinical_ids = 4;
}

message HomeProductSuggestion {
  string outcome = 1;
  string reason = 2;
  Product product = 3;
}

message HoldAppointmentProductsResponse {
  repeated Order orders = 1;
  string total = 2;
}

message GetAppointmentOrdersRequest {
  repeated string appointment_ids = 1;
}

message OrdersResponse {
  repeated Order orders = 1;
}

message NotifyWhenBackInStockRequest {
  string client_profile_id = 1;
  string product_id = 2;
}

message NotifyWhenBackInStockResponse {
  bool subscribed = 1;
}

message ListDeliveriesRequest {
  string date = 1;
}

message OrderActionRequest {
  string order_id = 1;
  string actor_user_id = 2;
}

message RecordOrderNotAppliedRequest {
  string order_id = 1;
  string actor_user_id = 2;
  string reason = 3;
  string note = 4;
}
