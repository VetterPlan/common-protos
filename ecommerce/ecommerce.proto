syntax = "proto3";

package ecommerce;

service EcommerceService {
  rpc CreateProduct(CreateProductRequest) returns (Product);
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  rpc SetProductActive(SetProductActiveRequest) returns (Product);
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);

  rpc ReceiveLot(ReceiveLotRequest) returns (StockMovement);
  rpc WriteOffStock(WriteOffStockRequest) returns (StockMovement);
  rpc AdjustStockCount(AdjustStockCountRequest) returns (StockMovement);
  rpc ListLots(ListLotsRequest) returns (ListLotsResponse);
  rpc ListStockMovements(ListStockMovementsRequest) returns (ListStockMovementsResponse);

  rpc GetInventoryAlerts(GetInventoryAlertsRequest) returns (InventoryAlerts);
}

message ClinicalReference {
  string table = 1;
  string id = 2;
}

message ProductFields {
  string name = 1;
  string presentation = 2;
  string description = 3;
  string photo_url = 4;
  string category = 5;
  string ica_registration = 6;
  string tariff_heading = 7;
  string vat_treatment = 8;
  string price = 9;
  bool requires_cold_chain = 10;
  int32 min_stock = 11;
  int32 max_stock = 12;
  ClinicalReference clinical_reference = 13;
  repeated string species = 14;
  string weight_min_kg = 15;
  string weight_max_kg = 16;
  string protection = 17;
  bool complementary = 18;
}

message StockSummary {
  int32 on_hand = 1;
  int32 available = 2;
  int32 sellable = 3;
  string nearest_expiry = 4;
}

message Product {
  string id = 1;
  ProductFields fields = 2;
  bool active = 3;
  StockSummary stock = 4;
  string created_at = 5;
  string updated_at = 6;
  string created_by = 7;
  string updated_by = 8;
}

message CreateProductRequest {
  string actor_user_id = 1;
  ProductFields fields = 2;
}

message UpdateProductRequest {
  string actor_user_id = 1;
  string product_id = 2;
  ProductFields fields = 3;
}

message SetProductActiveRequest {
  string actor_user_id = 1;
  string product_id = 2;
  bool active = 3;
}

message GetProductRequest {
  string product_id = 1;
}

message ListProductsRequest {
  bool active_only = 1;
  string category = 2;
}

message ListProductsResponse {
  repeated Product products = 1;
}

message Lot {
  string id = 1;
  string product_id = 2;
  string lot_number = 3;
  string expires_on = 4;
  int32 on_hand = 5;
  int32 available = 6;
  bool sellable = 7;
  string first_received_at = 8;
}

message StockMovement {
  string id = 1;
  string lot_id = 2;
  string product_id = 3;
  string lot_number = 4;
  string kind = 5;
  int32 quantity = 6;
  string unit_cost = 7;
  string supplier = 8;
  string supplier_invoice = 9;
  string reason = 10;
  string note = 11;
  string actor_user_id = 12;
  string created_at = 13;
  int32 lot_on_hand_after = 14;
}

message ReceiveLotRequest {
  string actor_user_id = 1;
  string product_id = 2;
  string lot_number = 3;
  string expires_on = 4;
  int32 quantity = 5;
  string unit_cost = 6;
  string supplier = 7;
  string supplier_invoice = 8;
}

message WriteOffStockRequest {
  string actor_user_id = 1;
  string lot_id = 2;
  int32 quantity = 3;
  string reason = 4;
  string note = 5;
}

message AdjustStockCountRequest {
  string actor_user_id = 1;
  string lot_id = 2;
  int32 counted_quantity = 3;
  string note = 4;
}

message ListLotsRequest {
  string product_id = 1;
  bool include_empty = 2;
}

message ListLotsResponse {
  repeated Lot lots = 1;
}

message ListStockMovementsRequest {
  string product_id = 1;
  string lot_id = 2;
  int32 limit = 3;
}

message ListStockMovementsResponse {
  repeated StockMovement movements = 1;
}

message GetInventoryAlertsRequest {}

message ProductAlert {
  string product_id = 1;
  string product_name = 2;
  string kind = 3;
  int32 stock = 4;
  int32 threshold = 5;
}

message LotAlert {
  string lot_id = 1;
  string product_id = 2;
  string product_name = 3;
  string lot_number = 4;
  string kind = 5;
  string expires_on = 6;
  int32 on_hand = 7;
}

message InventoryAlerts {
  repeated ProductAlert products = 1;
  repeated LotAlert lots = 2;
  string as_of = 3;
}
