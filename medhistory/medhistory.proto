syntax = "proto3";

package medhistory;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ═══════════════════════════════════════════════════════════════════════════
// MEDHISTORY SERVICE — Registro Clínico Estructurado (Fase 1)
//
// Fuente de verdad del encuentro clínico a domicilio. pets-service mantiene el
// "carné actual" (peso, alergias, próxima vacuna) como PROYECCIÓN que este
// servicio actualiza al finalizar el registro.
//
// Diseño: medhistory-service/DESIGN_FASE1_REGISTRO_CLINICO.md
// Depends on: Appointment (appointment_id), Pet (pet_id), Profile (vet/client),
//             VetCertification (ValidateCanPractice), Files (adjuntos)
//
// Contratos a prueba de Fases 2-3 (§13 del diseño) — NO removerlos:
//   1. Clave estable `bloque.campo` + template exportable como JSON Schema
//   2. Procedencia y confianza por campo (FieldMeta)
//   3. Update con semántica de patch por ruta + revisión (concurrencia optimista)
//   4. Evento por patch a pubsub `consultation:{id}`
//   5. Flag client_visible por bloque/campo
//   6. Anexo de captura cruda (audio + transcripción)
// ═══════════════════════════════════════════════════════════════════════════

service MedHistoryService {
  // ─── TEMPLATE ───

  // Devuelve el esquema de bloques (receta) para un ServiceType + especie.
  // La app arma el formulario con esto. Exportable como JSON Schema para
  // alimentar a la IA de Fase 2 como definición de herramienta.
  rpc GetConsultationTemplate (GetConsultationTemplateRequest) returns (ConsultationTemplateResponse);

  // Devuelve el contenido de una tabla de referencia (catálogo de vacunas,
  // rangos de vitales, hallazgos por sistema, etc.). Es lo que llena los
  // desplegables que el template declara en `reference_table`.
  rpc GetReferenceData (GetReferenceDataRequest) returns (GetReferenceDataResponse);

  // B-7 — el PRIMER agregado de este servicio, y por eso lleva escrito por qué
  // se le permite existir.
  //
  // Todo lo demás aquí se pide por registro o por mascota, y cada lectura pasa
  // por `consultation_access_logs`: un expediente clínico no se consulta sin
  // dejar rastro de quién y por qué. Un conteo parecía romper esa regla, y no la
  // rompe **mientras el resultado no se pueda reducir a una persona**. De ahí la
  // forma de la petición: acepta un periodo y nada más.
  //
  // No admite `pet_id`, ni `client_profile_id`, ni `vet_profile_id`. Un conteo
  // con sujeto es una consulta clínica disfrazada: con n=1 revela que ese
  // paciente tiene expediente, que es justo lo que el resto del servicio protege.
  // Si algún día hace falta desempeño por veterinario, es otro caso de uso, con
  // su fila en la baseline y su decisión propia — no un filtro más en este.
  //
  // Se audita igual que una lectura, con `granted_aggregate`: la bitácora no
  // deja de anotar solo porque el resultado sea un número.
  rpc CountFinalizedRecords (CountFinalizedRecordsRequest) returns (CountFinalizedRecordsResponse);

  // Crea o edita una fila de vocabulario. Solo admin (se enforza en la gateway).
  // Editar el contenido clínico REVIERTE is_validated_by_vet a false: si cambió
  // el dato, la aprobación anterior ya no aplica.
  rpc UpsertReferenceItem (UpsertReferenceItemRequest) returns (ReferenceItemResponse);

  // Aprueba (o revoca) filas en bloque tras la revisión del veterinario.
  rpc SetReferenceValidation (SetReferenceValidationRequest) returns (SetReferenceValidationResponse);

  // ─── CICLO DE VIDA DEL REGISTRO ───

  // Abre el borrador al entrar a IN_PROGRESS (llamado por appointment-service).
  // Idempotente: si ya existe un registro para el appointment, lo devuelve.
  rpc StartConsultationRecord (StartConsultationRecordRequest) returns (ConsultationRecordResponse);

  // Autosave parcial mientras el registro es borrador. Semántica de PATCH por
  // ruta de campo — nunca reemplaza el registro completo (contrato §13.3).
  rpc UpdateConsultationRecord (UpdateConsultationRecordRequest) returns (UpdateConsultationRecordResponse);

  // Llamado por appointment-service cuando la cita pasa a COMPLETED.
  // Mueve el registro a PENDING_FINALIZATION y arranca la ventana de 24-48h.
  // Exige solo el mínimo (registro iniciado) para no trabar el cobro.
  rpc MarkPendingFinalization (MarkPendingFinalizationRequest) returns (ConsultationRecordResponse);

  // Llamado por appointment-service cuando la cita se aborta desde IN_PROGRESS.
  // Lleva el registro a ABANDONED, que es terminal: sin él quedaría en DRAFT,
  // vivo en los pendientes de un vet que ya no puede escribirlo.
  rpc AbandonConsultationRecord (AbandonConsultationRecordRequest) returns (ConsultationRecordResponse);

  // Valida los bloques requeridos de la receta, dispara los side-effects vía
  // outbox transaccional y bloquea el registro.
  rpc FinalizeConsultationRecord (FinalizeConsultationRecordRequest) returns (FinalizeConsultationRecordResponse);

  // Corrección post-cierre. Append-only con justificación y traza (legal).
  rpc AmendConsultationRecord (AmendConsultationRecordRequest) returns (ConsultationRecordResponse);

  // ─── LECTURA (control de acceso por engagement) ───

  // Lectura por id o por appointment_id. Auditada.
  rpc GetConsultationRecord (GetConsultationRecordRequest) returns (ConsultationRecordResponse);

  // Timeline longitudinal del pet + tendencia de vitales. Un pet a la vez,
  // nunca listado buscable (guardrail anti-fuga §8).
  rpc GetPetMedicalHistory (GetPetMedicalHistoryRequest) returns (GetPetMedicalHistoryResponse);

  // El dueño dice "ahora no" a una remisión. Apaga los recordatorios y se
  // registra: que el titular declinara es información clínica, no un fracaso.
  rpc DeclineReferral (DeclineReferralRequest) returns (ReferralResponse);

  // Vista/PDF SOAP generada desde los datos estructurados.
  // SOAP es SOLO exportación, nunca UI de captura.
  rpc ExportConsultationSOAP (ExportConsultationSOAPRequest) returns (ExportConsultationSOAPResponse);

  // ─── ADJUNTOS (R2 privado) ───

  // Devuelve una URL PUT prefirmada para subir un adjunto directo a R2, y la
  // clave del objeto a guardar en el anexo. El bucket es privado: la clave NO
  // es una URL pública.
  rpc GenerateAttachmentUploadUrl (GenerateAttachmentUploadUrlRequest) returns (GenerateAttachmentUploadUrlResponse);

  // Devuelve una URL GET prefirmada de corta vida para leer un adjunto, solo
  // tras pasar el control de acceso (mismo engagement que el registro).
  rpc GetAttachmentUrl (GetAttachmentUrlRequest) returns (GetAttachmentUrlResponse);

  // Borra un anexo del registro y su objeto en R2. Solo con el registro
  // abierto: el anexo de un registro cerrado es prueba legal y ahí se corrige
  // por enmienda, no borrando.
  rpc RemoveConsultationAttachment (RemoveConsultationAttachmentRequest) returns (RemoveConsultationAttachmentResponse);

  // ─── CONSENTIMIENTO DIGITAL ───
  //
  // Diseño: docs/DESIGN_CONSENTIMIENTO_DIGITAL.md
  // La plantilla es SIEMPRE de la plataforma; el veterinario aporta los datos
  // del acto concreto y deja constancia de que explicó.

  // Plantilla vigente para una cita. La app la precarga al ACEPTAR la cita,
  // para poder firmar sin señal.
  rpc GetConsentTemplate (GetConsentTemplateRequest) returns (ConsentTemplateResponse);

  // El vet emite la solicitud con los datos del acto; devuelve el texto YA
  // interpolado que el cliente va a leer y firmar.
  rpc RequestConsentSignature (RequestConsentSignatureRequest) returns (RequestConsentSignatureResponse);

  rpc GetPendingConsent (GetPendingConsentRequest) returns (GetPendingConsentResponse);

  // Registra la firma del dueño. Idempotente por client_signature_id: la app
  // reintenta la sincronización sin miedo a duplicar.
  rpc SubmitConsentSignature (SubmitConsentSignatureRequest) returns (ConsentSignatureResponse);

  // Constancia del veterinario: certifica que explicó el procedimiento.
  rpc AttestConsent (AttestConsentRequest) returns (ConsentSignatureResponse);

  // Estado del consentimiento de una cita. Lo consulta appointment-service
  // antes de dejar pasar a IN_PROGRESS.
  rpc GetConsentStatus (GetConsentStatusRequest) returns (GetConsentStatusResponse);

  // Revocación. No es retroactiva sobre lo ya ejecutado.
  rpc RevokeConsent (RevokeConsentRequest) returns (ConsentSignatureResponse);

  // Admin: publica una versión nueva de una plantilla. NUNCA edita la vigente.
  rpc PublishConsentTemplate (PublishConsentTemplateRequest) returns (ConsentTemplateResponse);

  // Admin: histórico de versiones.
  rpc ListConsentTemplates (ListConsentTemplatesRequest) returns (ListConsentTemplatesResponse);

  // Plantillas de documentos que firma el veterinario (hoy: la orden de ayudas
  // diagnósticas). Hermanas de las de consentimiento y con el mismo ciclo:
  // borrador → publicada (inmutable) → retirada. Corregir es versionar.
  rpc ListDocumentTemplates (ListDocumentTemplatesRequest) returns (ListDocumentTemplatesResponse);
  rpc CreateDocumentTemplateVersion (CreateDocumentTemplateVersionRequest) returns (DocumentTemplateResponse);
  rpc PublishDocumentTemplate (PublishDocumentTemplateRequest) returns (DocumentTemplateResponse);
  // Imprime la plantilla con datos de ejemplo: se revisa lo que va a ver una
  // clínica, no un textarea.
  rpc PreviewDocumentTemplate (PreviewDocumentTemplateRequest) returns (PreviewDocumentTemplateResponse);

  // ─── CAPTURA CON IA (Fase 2) ───

  // Encola la estructuración de un segmento: transcribe el audio (o usa el
  // transcript on-device que envía la app) y estructura lo acumulado en campos
  // ai_suggested con confianza y cita. Async: la app escucha el pubsub o
  // consulta GetStructuringStatus. El vet debe tener la cita activa.
  rpc RequestStructuring (RequestStructuringRequest) returns (RequestStructuringResponse);

  // Estado del último job de estructuración de un registro.
  rpc GetStructuringStatus (GetStructuringStatusRequest) returns (GetStructuringStatusResponse);

  // Otorga o revoca el consentimiento del dueño para el procesamiento con IA de
  // la consulta (Ley 1581). Sin consentimiento otorgado, RequestStructuring
  // queda bloqueado y el vet teclea (Fase 1 intacta).
  rpc GrantAiConsent (GrantAiConsentRequest) returns (GrantAiConsentResponse);

  // ─── RESUMEN PARA EL DUEÑO (Fase 2c) ───

  // Genera (o devuelve en caché) el resumen amable para el dueño a partir del
  // registro FINALIZADO. Segunda salida de la misma captura: lenguaje claro, sin
  // jerga. Solo el vet (o admin) genera; el dueño lo lee del registro.
  rpc GenerateOwnerSummary (GenerateOwnerSummaryRequest) returns (GenerateOwnerSummaryResponse);

  // Baja de cuenta (P-4a): desvincula al titular y CONSERVA el acto medico.
  // Ley 576 de 2000: la historia clinica es obligatoria y confidencial, y es
  // la evidencia del veterinario sobre su propia conducta profesional.
  rpc AnonymizeClientData (AnonymizeClientDataRequest) returns (AnonymizeClientDataResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// ENUMS
// ═══════════════════════════════════════════════════════════════════════════

// Ciclo de vida del registro (§7). COMPLETED de la cita NO finaliza el registro.
enum ConsultationStatus {
  CONSULTATION_STATUS_UNSPECIFIED = 0;
  CONSULTATION_STATUS_DRAFT = 1;                  // Abierto, autosave activo
  CONSULTATION_STATUS_PENDING_FINALIZATION = 2;   // Cita COMPLETED, ventana 24-48h
  CONSULTATION_STATUS_FINALIZED = 3;              // Bloqueado, side-effects disparados
  CONSULTATION_STATUS_AMENDED = 4;                // Finalizado + al menos una enmienda
  CONSULTATION_STATUS_ABANDONED = 5;              // La cita se abortó: terminal, fuera de pendientes
}

// Espejo de appointment.ServiceType — los protos son autocontenidos (sin imports
// cruzados). Mantener sincronizado con protos/appointment/appointment.proto.
enum ServiceType {
  SERVICE_TYPE_UNSPECIFIED = 0;
  SERVICE_TYPE_CONSULTATION = 1;
  SERVICE_TYPE_VACCINATION = 2;
  SERVICE_TYPE_DEWORMING = 3;
  SERVICE_TYPE_FOLLOW_UP = 4;
  SERVICE_TYPE_MEDICAL_CERTIFICATE = 5;
  SERVICE_TYPE_ULTRASOUND = 6;
  SERVICE_TYPE_ELECTROCARDIOGRAM = 7;
}

// Espejo de pet.Species. Mantener sincronizado con protos/pet/pet.proto.
enum Species {
  SPECIES_UNSPECIFIED = 0;
  SPECIES_DOG = 1;
  SPECIES_CAT = 2;
  SPECIES_BIRD = 3;
  SPECIES_RABBIT = 4;
  SPECIES_HAMSTER = 5;
  SPECIES_FISH = 6;
  SPECIES_REPTILE = 7;
  SPECIES_OTHER = 8;
}

// Perfil de especie que resuelve la receta (§12.3). MVP: DOG y CAT completos,
// el resto cae a GENERIC (campos universales + texto libre, sin rangos).
enum SpeciesProfile {
  SPECIES_PROFILE_UNSPECIFIED = 0;
  SPECIES_PROFILE_DOG = 1;
  SPECIES_PROFILE_CAT = 2;
  SPECIES_PROFILE_GENERIC = 3;
}

// Procedencia del dato — CRÍTICO MÉDICO-LEGAL (contrato §13.2).
// Un registro firmado debe distinguir lo que escribió el vet de lo que
// sugirió la IA y él aprobó.
enum FieldSource {
  FIELD_SOURCE_UNSPECIFIED = 0;
  FIELD_SOURCE_VET_MANUAL = 1;      // Digitado por el veterinario
  FIELD_SOURCE_AI_SUGGESTED = 2;    // Sugerido por IA (Fase 2) — requiere revisión
  FIELD_SOURCE_PREFILLED = 3;       // Pre-llenado desde el carné o cálculo
  FIELD_SOURCE_CLIENT_REPORTED = 4; // Reportado por el dueño
}

enum DiagnosisType {
  DIAGNOSIS_TYPE_UNSPECIFIED = 0;
  DIAGNOSIS_TYPE_PROBLEM = 1;       // Lista de problemas
  DIAGNOSIS_TYPE_DIFFERENTIAL = 2;  // Diferencial
  DIAGNOSIS_TYPE_PRESUMPTIVE = 3;   // Presuntivo
  DIAGNOSIS_TYPE_DEFINITIVE = 4;    // Definitivo
}

// Estado de un sistema en el examen por sistemas (§16.6).
// Default NO_EVALUADO — registrar como normal algo no examinado es riesgo legal.
enum SystemExamState {
  SYSTEM_EXAM_STATE_UNSPECIFIED = 0;
  SYSTEM_EXAM_STATE_NOT_EVALUATED = 1;
  SYSTEM_EXAM_STATE_NORMAL = 2;
  SYSTEM_EXAM_STATE_ABNORMAL = 3;
}

enum AttachmentType {
  ATTACHMENT_TYPE_UNSPECIFIED = 0;
  ATTACHMENT_TYPE_INFORMED_CONSENT = 1;  // Anexo obligatorio legal
  ATTACHMENT_TYPE_LAB_RESULT = 2;
  ATTACHMENT_TYPE_IMAGE = 3;
  ATTACHMENT_TYPE_REFERRAL = 4;
  ATTACHMENT_TYPE_VACCINE_LABEL = 5;     // Foto de etiqueta del frasco (§16.2)
  ATTACHMENT_TYPE_AUDIO_CAPTURE = 6;     // Captura cruda Fase 2 (contrato §13.6)
  ATTACHMENT_TYPE_TRANSCRIPT = 7;        // Transcripción cruda Fase 2
  ATTACHMENT_TYPE_OTHER = 8;
  // La orden de ayudas diagnósticas que firma el vet (Fase 4e). Se adjunta al
  // registro para que el dueño la vea y la descargue por el camino de siempre.
  ATTACHMENT_TYPE_DIAGNOSTIC_ORDER = 9;
}

// Requerimiento de un bloque dentro de una receta (matriz §16.8).
enum BlockRequirement {
  BLOCK_REQUIREMENT_UNSPECIFIED = 0;
  BLOCK_REQUIREMENT_REQUIRED = 1;
  BLOCK_REQUIREMENT_OPTIONAL = 2;
  BLOCK_REQUIREMENT_NOT_APPLICABLE = 3;
}

// Tipo de campo del template — la app renderiza el control con esto y el
// servicio valida el patch contra esto.
enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  FIELD_TYPE_STRING = 1;
  FIELD_TYPE_TEXT = 2;
  FIELD_TYPE_DATE = 3;
  FIELD_TYPE_DECIMAL = 4;
  FIELD_TYPE_INT = 5;
  FIELD_TYPE_BOOL = 6;
  FIELD_TYPE_ENUM = 7;
  FIELD_TYPE_MULTI_SELECT = 8;
  FIELD_TYPE_ATTACHMENT = 9;
  FIELD_TYPE_OBJECT_LIST = 10;  // Bloque repetible (ej. examenes_complementarios)
}

// Rol del solicitante para el control de acceso por engagement (§8).
enum RequesterRole {
  REQUESTER_ROLE_UNSPECIFIED = 0;
  REQUESTER_ROLE_CLIENT = 1;  // Dueño: lee siempre, no edita clínico
  REQUESTER_ROLE_VET = 2;     // Lee/escribe solo con cita activa
  REQUESTER_ROLE_ADMIN = 3;   // Break-glass, siempre auditado
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Contexto de acceso
// ═══════════════════════════════════════════════════════════════════════════

// Acompaña TODA lectura y escritura. El servicio audita cada acceso
// (quién / cuándo / qué cita) — guardrail anti-fuga §8.
message AccessContext {
  string requester_user_id = 1;
  string requester_profile_id = 2;
  RequesterRole role = 3;
  // Cita que habilita el acceso del vet. Obligatorio para role = VET.
  string appointment_id = 4;
  // Justificación — obligatoria para acceso break-glass de ADMIN.
  string break_glass_reason = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Template (receta de bloques)
// ═══════════════════════════════════════════════════════════════════════════

// Predicado de aplicabilidad de un campo (§12.1). Ausente = aplica siempre.
// La especie NO es eje de recetas: entra como predicado a nivel de campo.
message AppliesTo {
  repeated Species species = 1;
  int32 min_age_months = 2;
  int32 max_age_months = 3;
}

message TemplateField {
  string key = 1;                  // Clave estable dentro del bloque (contrato §13.1)
  string label = 2;                // Etiqueta en español
  FieldType type = 3;
  bool required = 4;               // Requerido para finalizar si el bloque aplica
  bool client_visible = 5;         // Contrato §13.5 — visible en pantalla compartida (Fase 3)
  repeated string options = 6;     // Para ENUM / MULTI_SELECT
  AppliesTo applies_to = 7;
  string unit = 8;                 // Ej. "kg", "°C", "lpm"
  string help_text = 9;
  // Tabla de referencia que alimenta este campo (§12.2 / §16.9).
  // Ej. "vaccine_catalog", "vital_reference_ranges", "system_findings".
  string reference_table = 10;
  bool deprecated = 11;            // Campo obsoleto: se marca, nunca se borra
  repeated TemplateField children = 12;  // Solo para OBJECT_LIST
  // Campo de REDACCIÓN: la IA lo escribe en prosa a partir del dictado, en vez
  // de extraer un valor puntual (ej. anamnesis_visita.relato). La app lo
  // renderiza como texto largo revisable, no como control de dato.
  bool synthesize = 13;
}

message TemplateBlock {
  string key = 1;                  // Ej. "bloque_vacunacion"
  string label = 2;
  BlockRequirement requirement = 3;
  bool client_visible = 4;
  bool is_repeated = 5;            // Bloque 0..N (ej. examenes_complementarios)
  repeated TemplateField fields = 6;
}

message ConsultationTemplate {
  ServiceType service_type = 1;
  SpeciesProfile species_profile = 2;
  // Versión de la receta. Se guarda en cada registro para que los registros
  // viejos rendericen como se capturaron (integridad médico-legal §5).
  string version = 3;
  repeated TemplateBlock blocks = 4;
  // El mismo template serializado como JSON Schema — insumo directo de la IA
  // de Fase 2 como definición de herramienta (contrato §13.1).
  google.protobuf.Struct json_schema = 5;
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Entidades del registro
// ═══════════════════════════════════════════════════════════════════════════

// Metadata de procedencia por campo (contrato §13.2). Vive en un JSONB hermano
// del valor, no envolviéndolo — mantiene los valores legibles y consultables.
message FieldMeta {
  FieldSource source = 1;
  double confidence = 2;           // 0.0–1.0, solo significativo si source = AI_SUGGESTED
  bool reviewed_by_vet = 3;        // Requisito para finalizar un campo AI_SUGGESTED
  google.protobuf.Timestamp updated_at = 4;
  string updated_by_profile_id = 5;
  // Fase 2: qué frase del vet justifica este campo (source = AI_SUGGESTED).
  // Es el diferenciador: la revisión es instantánea porque el vet ve la cita.
  string citation = 6;
}

// Datos de un bloque flexible. `data` y `field_meta` comparten las mismas claves.
message BlockData {
  string block_key = 1;
  google.protobuf.Struct data = 2;       // { "next_due_date": "2027-07-23", ... }
  map<string, FieldMeta> field_meta = 3; // { "next_due_date": {source, ...} }
}

// Vitales tipados — habilitan tendencias, alertas por rango y comparación
// longitudinal. Los rangos normales dependen de la especie (§12.2).
message Vitals {
  double weight_kg = 1;
  double temperature_c = 2;
  int32 heart_rate_bpm = 3;
  int32 respiratory_rate_bpm = 4;
  double crt_seg = 5;              // TLLC — tiempo de llenado capilar
  double skin_tent_seg = 6;        // TRPC — tiempo de retorno del pliegue cutáneo
  string pulse = 7;
  string mucous_membrane = 8;
  double dehydration_pct = 9;
  int32 body_condition_score = 10; // Escala por especie (1–9 en perro/gato)
  // Campos fuera del rango normal de la especie, calculado al capturar.
  repeated string out_of_range_fields = 11;
}

message Diagnosis {
  string id = 1;
  string label = 2;                // Texto libre en español
  DiagnosisType type = 3;
  // Hooks de codificación — nullable desde el día 1, se llenan luego con
  // auto-mapeo a VeNom(ES) vía IA (§decisión 3). NO removerlos.
  string code = 4;
  string code_system = 5;          // Ej. "venom"
  bool is_primary = 6;
  string notes = 7;
}

message PrescriptionItem {
  string id = 1;
  string medication = 2;
  string dose = 3;
  string route = 4;
  string frequency = 5;
  string duration = 6;
  double quantity = 7;
  string instructions = 8;
  string product_ref = 9;          // Hook al catálogo → ecommerce (Fase 4)
}

message FollowUp {
  bool needed = 1;
  int32 recommended_interval_days = 2;
  string reason = 3;
  string vet_recommendations = 4;  // Campo de upsell / cuidado preventivo
}

// Data única de estar en la casa (§6). 5 campos núcleo + 2 opcionales.
message HomeObservation {
  repeated string hazards = 1;         // Multi-select: plantas tóxicas, químicos, etc.
  string indoor_outdoor = 2;           // solo_interior · exterior · mixto
  string sanitation = 3;               // bueno · regular · deficiente
  int32 litter_box_count = 4;          // Solo gatos (applies_to)
  string litter_box_hygiene = 5;       // Solo gatos
  string stress_enrichment = 6;
  repeated string air_quality = 7;     // humo · humedad/moho · ventilación deficiente
  string feeding_setup = 8;            // Opcional
  string surfaces_mobility = 9;        // Opcional
}

message Attachment {
  string id = 1;
  AttachmentType type = 2;
  string url = 3;                  // files-service
  string caption = 4;
  string body_region = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Append-only. Requisito legal para cualquier corrección post-cierre.
message Amendment {
  string id = 1;
  string amended_by_profile_id = 2;
  string justification = 3;
  google.protobuf.Struct diff = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Remisión interna: lo que el vet pide y VetterPlan sabe agendar (Fase 4).
// Lo que NO podemos hacer va en una orden de exámenes, que es otro documento.
enum ReferralStatus {
  REFERRAL_STATUS_UNSPECIFIED = 0;
  REFERRAL_STATUS_ISSUED = 1;      // Único estado activo; el único que avisa
  REFERRAL_STATUS_SCHEDULED = 2;
  REFERRAL_STATUS_DECLINED = 3;    // El dueño dijo "ahora no". Se registra igual
  REFERRAL_STATUS_EXPIRED = 4;
}

message Referral {
  string id = 1;
  string record_id = 2;
  string pet_id = 3;
  ServiceType service_type = 4;    // Solo lo agendable en la plataforma
  string reason = 5;               // Justificación clínica; es lo que lee el dueño
  string urgency = 6;              // routine · soon · urgent
  ReferralStatus status = 7;
  string issued_by_profile_id = 8;
  google.protobuf.Timestamp issued_at = 9;
  google.protobuf.Timestamp expires_at = 10;   // 30 días desde la emisión
  google.protobuf.Timestamp closed_at = 11;
  string closed_reason = 12;
}

message ConsultationRecord {
  string id = 1;
  string appointment_id = 2;
  string pet_id = 3;
  string client_profile_id = 4;
  string vet_profile_id = 5;

  Species species = 6;
  ServiceType service_type = 7;
  // Receta usada al capturar — permite renderizar el registro tal como se creó.
  string template_version = 8;
  SpeciesProfile species_profile = 9;

  ConsultationStatus status = 10;
  string chief_complaint = 11;

  // Contador de revisión para concurrencia optimista (contrato §13.3).
  // Autosave, IA y vista en vivo escriben sobre el mismo borrador.
  int64 revision = 12;

  Vitals vitals = 13;
  repeated BlockData blocks = 14;
  repeated Diagnosis diagnoses = 15;
  repeated PrescriptionItem prescriptions = 16;
  FollowUp follow_up = 17;
  HomeObservation home_observation = 18;
  repeated Attachment attachments = 19;
  repeated Amendment amendments = 20;

  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
  google.protobuf.Timestamp finalized_at = 23;
  // Vencimiento de la ventana de finalización (24–48h tras COMPLETED).
  google.protobuf.Timestamp finalization_deadline = 24;

  // Consentimiento IA (Ley 1581). Ausente/no otorgado = captura por voz
  // bloqueada; la app debe ofrecer teclear en su lugar.
  AiConsent ai_consent = 25;
  // Resumen amable para el dueño (Fase 2c), derivado del registro finalizado.
  string owner_summary = 26;
  google.protobuf.Timestamp owner_summary_generated_at = 27;

  // Raza y talla del paciente, congeladas al abrir el registro.
  //
  // `breed_size` no es cosmético: el peso no dice la etapa de vida ni el rango
  // normal —8 kg es un gran danés cachorro o un adulto pequeño— y de él salen
  // los rangos de frecuencia cardiaca por talla y las bandas del vademécum.
  // Vacío = no consta; nunca se deduce del peso.
  string breed_name = 28;
  string breed_size = 29;

  // Emitidas al finalizar, en la misma transacción que el cierre.
  repeated Referral referrals = 30;
}

// Consentimiento del dueño para el procesamiento con IA de la consulta (Ley 1581).
message AiConsent {
  bool granted = 1;
  string consent_version = 2;          // versión del texto de consentimiento aceptado
  string captured_by_profile_id = 3;   // quién lo registró (vet que lo capturó o el dueño)
  google.protobuf.Timestamp granted_at = 4;
  google.protobuf.Timestamp revoked_at = 5;  // presente si se revocó
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Patch (contrato §13.3)
// ═══════════════════════════════════════════════════════════════════════════

// Un cambio dirigido a una ruta de campo. Ej. path = "bloque_vacunacion.next_due_date".
// Para bloques repetibles: "examenes_complementarios[2].result_summary".
message FieldPatch {
  string path = 1;
  google.protobuf.Value value = 2;  // null = limpiar el campo
  FieldSource source = 3;
  double confidence = 4;
  bool reviewed_by_vet = 5;
  string citation = 6;             // Fase 2: frase que justifica el valor
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Requests / Responses
// ═══════════════════════════════════════════════════════════════════════════

message GetConsultationTemplateRequest {
  ServiceType service_type = 1;
  Species species = 2;
  int32 pet_age_months = 3;        // Resuelve predicados applies_to por edad
  // Versión específica de la receta. Vacío = versión vigente.
  string template_version = 4;
}

message ConsultationTemplateResponse {
  ConsultationTemplate template = 1;
}

message GetReferenceDataRequest {
  // vaccine_catalog · dewormer_catalog · vital_reference_ranges ·
  // body_condition_scales · system_findings · home_hazards
  string table = 1;
  Species species = 2;
  // Filtra por banda de edad donde aplique (desparasitantes, vacunas).
  int32 pet_age_months = 3;
  // Solo para system_findings. Vacío = todos los sistemas.
  string system_key = 4;
  // Modo revisión (panel de admin): devuelve TODAS las filas sin filtrar por
  // especie, edad ni estado activo, para poder auditarlas y aprobarlas.
  bool review_mode = 5;
}

// Fila genérica: `attributes` lleva los campos propios de cada tabla
// (default_interval_days, min_value/max_value, parasite_target, …).
message ReferenceItem {
  string code = 1;
  string label = 2;
  // Falso mientras un médico veterinario no haya revisado la fila.
  // La UI debe poder advertirlo.
  bool is_validated_by_vet = 3;
  google.protobuf.Struct attributes = 4;
  string id = 5;
  bool is_active = 6;

  // B-5 — la especie a la que aplica la fila, como campo propio.
  //
  // Ya viajaba dentro de `attributes.species_profile`, pero ahi es un valor de
  // un Struct sin contrato: el panel tenia que adivinar la clave y el tipo. Las
  // tablas no particionadas por especie (`system_findings`) lo dejan vacio, y
  // vacio significa "aplica a todas", no "no se sabe".
  string species_profile = 7;

  // B-5 — cuando y quien toco la fila por ultima vez. Un vocabulario clinico
  // que alguien aprueba necesita decir sobre que version se aprobo.
  //
  // Vacios en una fila que nadie ha editado desde que existen estas columnas:
  // la ausencia es "no consta", nunca "lo edito el sistema". `updated_by` es el
  // user id de auth del actor, el mismo que ya llegaba en
  // `UpsertReferenceItemRequest.actor_user_id` y hasta ahora solo iba al log.
  google.protobuf.Timestamp updated_at = 8;
  string updated_by = 9;
}

message GetReferenceDataResponse {
  string table = 1;
  repeated ReferenceItem items = 2;
  // True solo si TODAS las filas devueltas están validadas.
  bool fully_validated = 3;
  int32 pending_validation_count = 4;
}

message UpsertReferenceItemRequest {
  string table = 1;
  // Vacío = crear una fila nueva.
  string id = 2;
  Species species = 3;
  string code = 4;
  string label = 5;
  // Campos propios de la tabla. Los que no vengan se dejan como están.
  google.protobuf.Struct attributes = 6;
  bool is_active = 7;
  string actor_user_id = 8;
}

message ReferenceItemResponse {
  string table = 1;
  ReferenceItem item = 2;
}

message SetReferenceValidationRequest {
  string table = 1;
  repeated string ids = 2;
  bool is_validated_by_vet = 3;
  string actor_user_id = 4;
}

message CountFinalizedRecordsRequest {
  // YYYY-MM-DD en América/Bogotá. El día de cierre entra entero.
  string period_start = 1;
  string period_end = 2;

  // Quién pregunta. No autoriza —de eso se encarga la gateway— pero sin esto la
  // bitácora no sabría a quién anotar, y un acceso sin autor no es auditoría.
  AccessContext access = 3;
}

message CountFinalizedRecordsResponse {
  // Registros CERRADOS dentro del periodo, por `finalized_at`.
  //
  // Ojo con leerlo como «citas con historia clínica»: es lo más cerca que el
  // servicio puede estar de esa frase, pero cuenta registros, y un registro
  // cuelga de una cita concreta. Si algún día una cita pudiera tener dos, el
  // número dejaría de coincidir sin que nadie lo notara.
  int32 finalized = 1;

  // Registros ABIERTOS dentro del periodo, por `created_at`. Da el contexto que
  // convierte al primero en una tasa: sin él, «120 finalizados» no dice si
  // sobran o faltan.
  int32 started = 2;

  // Abiertos en el periodo y todavía sin cerrar hoy. No es `started - finalized`:
  // un registro abierto en junio pudo cerrarse en julio.
  int32 still_open = 3;
}

message SetReferenceValidationResponse {
  string table = 1;
  int32 updated_count = 2;
  repeated string not_found_ids = 3;
}

message StartConsultationRecordRequest {
  string appointment_id = 1;
  // Grupo de la visita. El consentimiento se firma antes de que exista el
  // registro, así que cuelga del grupo; esto es lo que después los enlaza.
  string appointment_group_id = 10;
  string pet_id = 2;
  string client_profile_id = 3;
  string vet_profile_id = 4;
  ServiceType service_type = 5;
  Species species = 6;
  int32 pet_age_months = 7;
  // Datos del carné que pre-llenan el registro (peso previo, alergias activas).
  // Se marcan con source = PREFILLED.
  google.protobuf.Struct carnet_prefill = 8;
  AccessContext access = 9;

  // Los manda quien abre el registro con lo que ya recibió de pets-service.
  // `breed_size`: SMALL / MEDIUM / LARGE / GIANT (catálogo de razas de pets).
  string breed_name = 12;
  string breed_size = 13;
}

message ConsultationRecordResponse {
  ConsultationRecord record = 1;
  // Devuelto en Start para que la app arme el formulario sin un segundo viaje.
  ConsultationTemplate template = 2;
}

message UpdateConsultationRecordRequest {
  string record_id = 1;
  repeated FieldPatch patches = 2;
  // Concurrencia optimista: si no coincide con la revisión actual → ABORTED.
  // Omitirlo = forzar (último gana), solo para autosave del propio vet.
  // `optional` porque un registro recién creado tiene revision=0: sin presencia,
  // el cliente que devuelve la revisión que leyó pedía forzado sin saberlo, y
  // justo en la primera edición, que es cuando el autosave y la revisión de lo
  // sugerido por la IA se pisan.
  optional int64 expected_revision = 3;
  AccessContext access = 4;
}

message UpdateConsultationRecordResponse {
  string record_id = 1;
  int64 revision = 2;
  repeated string applied_paths = 3;
  repeated string rejected_paths = 4;  // Rutas inválidas para la receta
  google.protobuf.Timestamp updated_at = 5;
}

message MarkPendingFinalizationRequest {
  // Uno de los dos. appointment_id es el que usa appointment-service.
  string record_id = 1;
  string appointment_id = 2;
}

message AbandonConsultationRecordRequest {
  string record_id = 1;
  string appointment_id = 2;
  string reason_details = 3;
}

message FinalizeConsultationRecordRequest {
  string record_id = 1;
  AccessContext access = 2;
}

// Bloque o campo que impide finalizar.
message ValidationIssue {
  string block_key = 1;
  string field_path = 2;
  string message = 3;
}

message FinalizeConsultationRecordResponse {
  ConsultationRecord record = 1;
  bool success = 2;
  // Si success = false, qué falta (bloques requeridos de la receta).
  repeated ValidationIssue issues = 3;
  // Side-effects encolados en el outbox transaccional (no fire-and-forget).
  repeated string queued_side_effects = 4;
}

message AmendConsultationRecordRequest {
  string record_id = 1;
  repeated FieldPatch patches = 2;
  string justification = 3;        // Obligatoria
  AccessContext access = 4;
}

message GetConsultationRecordRequest {
  // Uno de los dos. record_id tiene precedencia si vienen ambos.
  string record_id = 1;
  string appointment_id = 2;
  AccessContext access = 3;
}

message DeclineReferralRequest {
  string referral_id = 1;
  string note = 2;              // Opcional, en palabras del dueño
  AccessContext access = 3;
}

message ReferralResponse {
  Referral referral = 1;
}

message GetPetMedicalHistoryRequest {
  string pet_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  // Filtra el timeline por tipo de servicio. Vacío = todos.
  repeated ServiceType service_types = 4;
  bool include_vitals_trend = 5;
  AccessContext access = 6;
}

// Entrada resumida del timeline — no arrastra el registro completo.
message MedicalHistoryEntry {
  string record_id = 1;
  string appointment_id = 2;
  ServiceType service_type = 3;
  ConsultationStatus status = 4;
  string chief_complaint = 5;
  string primary_diagnosis = 6;
  string vet_profile_id = 7;
  string vet_name = 8;
  google.protobuf.Timestamp consulted_at = 9;
}

message VitalsTrendPoint {
  google.protobuf.Timestamp measured_at = 1;
  double weight_kg = 2;
  double temperature_c = 3;
  int32 heart_rate_bpm = 4;
  int32 respiratory_rate_bpm = 5;
  int32 body_condition_score = 6;
}

message GetPetMedicalHistoryResponse {
  repeated MedicalHistoryEntry entries = 1;
  int32 total_count = 2;
  repeated VitalsTrendPoint vitals_trend = 3;
  MedicalHistoryScope scope = 4;
}

enum MedicalHistoryScope {
  MEDICAL_HISTORY_SCOPE_UNSPECIFIED = 0;
  MEDICAL_HISTORY_SCOPE_SUMMARY = 1;
  MEDICAL_HISTORY_SCOPE_CLINICAL = 2;
}

message ExportConsultationSOAPRequest {
  string record_id = 1;
  bool generate_pdf = 2;
  AccessContext access = 3;
}

message ExportConsultationSOAPResponse {
  string subjective = 1;
  string objective = 2;
  string assessment = 3;
  string plan = 4;
  string pdf_url = 5;              // Vacío si generate_pdf = false
  google.protobuf.Timestamp generated_at = 6;
}

// ═══════════════════════════════════════════════════════════════════════════
// ADJUNTOS (R2 privado)
// ═══════════════════════════════════════════════════════════════════════════

message GenerateAttachmentUploadUrlRequest {
  string record_id = 1;
  AttachmentType attachment_type = 2;
  string file_extension = 3;       // pdf · jpg · png · m4a ...
  string content_type = 4;         // application/pdf · image/jpeg ...
  AccessContext access = 5;
}

message GenerateAttachmentUploadUrlResponse {
  string upload_url = 1;           // PUT prefirmado, subir directo a R2
  string object_key = 2;
  int32 expires_in = 3;            // segundos de validez del upload_url
}

message GetAttachmentUrlRequest {
  string record_id = 1;
  string object_key = 2;           // la clave guardada en el anexo
  AccessContext access = 3;
}

message GetAttachmentUrlResponse {
  string download_url = 1;         // GET prefirmado, corta vida
  int32 expires_in = 2;
}

message RemoveConsultationAttachmentRequest {
  string record_id = 1;
  string attachment_id = 2;        // id del anexo, no la clave del objeto
  AccessContext access = 3;
}

message RemoveConsultationAttachmentResponse {
  string record_id = 1;
  int64 revision = 2;
  // false si el objeto ya no estaba en R2: la fila igual se borra, el anexo
  // huérfano en el registro es peor que un objeto huérfano en el bucket.
  bool object_deleted = 3;
}

// ═══════════════════════════════════════════════════════════════════════════
// CAPTURA CON IA (Fase 2)
// ═══════════════════════════════════════════════════════════════════════════

enum StructuringStatus {
  STRUCTURING_STATUS_UNSPECIFIED = 0;
  STRUCTURING_STATUS_PENDING = 1;       // encolado
  STRUCTURING_STATUS_TRANSCRIBING = 2;
  STRUCTURING_STATUS_STRUCTURING = 3;
  STRUCTURING_STATUS_DONE = 4;
  STRUCTURING_STATUS_FAILED = 5;
}

message RequestStructuringRequest {
  string record_id = 1;
  // Fuente del segmento — al menos una:
  //  - audio_object_key: la clave del audio subido (transcribe server-side, autoritativo).
  //  - transcript_text: el transcript on-device (salta la transcripción, ahorra costo).
  string audio_object_key = 2;
  string transcript_text = 3;
  AccessContext access = 4;
  // Secciones del template que cubre el segmento. Vacío = todo el template.
  repeated string block_keys = 5;
}

message RequestStructuringResponse {
  string job_id = 1;
  StructuringStatus status = 2;
}

message GetStructuringStatusRequest {
  string record_id = 1;
  string job_id = 2;              // opcional; vacío = último job del registro
  AccessContext access = 3;
}

// Un campo que la IA sugirió, con su justificación — para la UI de revisión.
message StructuredSuggestion {
  string path = 1;
  double confidence = 2;
  string citation = 3;           // qué frase del vet lo justifica
}

message GetStructuringStatusResponse {
  string job_id = 1;
  StructuringStatus status = 2;
  string error = 3;
  // Transcript acumulado hasta ahora (autoritativo, del servidor).
  string transcript = 4;
  // Campos sugeridos en este job (para resaltar en la UI).
  repeated StructuredSuggestion suggestions = 5;
  // Lo que el vet dijo pero no cayó en ningún campo de la receta.
  repeated string unmapped = 6;
  // Revisión del registro tras aplicar las sugerencias.
  int64 record_revision = 7;
}

message GrantAiConsentRequest {
  string record_id = 1;
  bool granted = 2;                // true = otorga · false = revoca
  string consent_version = 3;      // versión del texto de consentimiento mostrado
  AccessContext access = 4;
}

message GrantAiConsentResponse {
  AiConsent consent = 1;
}

message GenerateOwnerSummaryRequest {
  string record_id = 1;
  bool regenerate = 2;             // fuerza regenerar aunque haya uno en caché
  AccessContext access = 3;
}

message GenerateOwnerSummaryResponse {
  string summary = 1;
  google.protobuf.Timestamp generated_at = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// CONSENTIMIENTO DIGITAL
// ═══════════════════════════════════════════════════════════════════════════

enum ConsentKind {
  CONSENT_KIND_UNSPECIFIED = 0;
  CONSENT_KIND_CLINICAL = 1;         // lo firma el dueño con el dedo
  CONSENT_KIND_AI_CAPTURE = 2;       // toggle de la Fase 2
  CONSENT_KIND_VET_ATTESTATION = 3;  // la declaración del veterinario
}

// Categoría de RIESGO, no de servicio: una por ServiceType serían ocho
// documentos diciendo lo mismo.
enum ConsentCategory {
  CONSENT_CATEGORY_UNSPECIFIED = 0;
  CONSENT_CATEGORY_GENERAL = 1;      // consulta, vacunación, desparasitación
  CONSENT_CATEGORY_PROCEDURE = 2;    // ecografía, ECG, radiografía
}

enum ConsentTemplateStatus {
  CONSENT_TEMPLATE_STATUS_UNSPECIFIED = 0;
  CONSENT_TEMPLATE_STATUS_DRAFT = 1;
  CONSENT_TEMPLATE_STATUS_PUBLISHED = 2;
  CONSENT_TEMPLATE_STATUS_RETIRED = 3;
}

message ConsentTemplate {
  string id = 1;
  ConsentKind kind = 2;
  ConsentCategory category = 3;
  int32 version = 4;
  string locale = 5;
  string title = 6;
  string body_md = 7;              // markdown con {{variables}}
  string body_hash = 8;            // sha256; el cliente lo devuelve al firmar
  repeated string variables = 9;   // las que el texto realmente usa
  ConsentTemplateStatus status = 10;
  google.protobuf.Timestamp published_at = 11;
  string published_by_user_id = 12;
  string notes = 13;
}

message GetConsentTemplateRequest {
  // Por cita (resuelve la categoría desde el tipo de servicio) o explícito.
  string appointment_id = 1;
  ConsentKind kind = 2;
  ConsentCategory category = 3;
  string locale = 4;
  int32 version = 5;               // 0 = la vigente
  AccessContext access = 6;
}

message ConsentTemplateResponse {
  ConsentTemplate template = 1;
}

message RequestConsentSignatureRequest {
  string appointment_id = 1;
  string appointment_group_id = 2;
  // Datos del acto que solo el vet conoce. Lo obligatorio lo declara la
  // plantilla publicada: son sus variables menos las que resuelve el sistema.
  google.protobuf.Struct act_details = 3;
  // Contexto que arma la GATEWAY desde appointment/profile: medhistory no
  // llama a appointment (esa dependencia va en el otro sentido).
  repeated string pet_names = 4;
  string vet_name = 5;
  string vet_license = 6;        // tarjeta profesional, de su certificación
  string client_name = 7;
  ServiceType service_type = 8;  // resuelve la categoría de la plantilla
  string locale = 9;
  AccessContext access = 10;
  string client_profile_id = 11;
  string client_user_id = 12;
  string client_reason = 13;
}

message RequestConsentSignatureResponse {
  ConsentTemplate template = 1;
  // El texto YA interpolado que el cliente debe leer y firmar.
  string rendered_text = 2;
  string rendered_hash = 3;
  repeated string record_ids = 4;      // registros que cubre (grupo de mascotas)
  string appointment_group_id = 5;
  string request_id = 6;
  bool client_notified = 7;
}

message PendingConsent {
  string id = 1;
  string appointment_id = 2;
  string appointment_group_id = 3;
  ConsentTemplate template = 4;
  string rendered_text = 5;
  string rendered_hash = 6;
  google.protobuf.Struct act_details = 7;
  repeated string pet_names = 8;
  string vet_name = 9;
  string vet_profile_id = 10;
  string client_profile_id = 11;
  google.protobuf.Timestamp requested_at = 12;
}

message GetPendingConsentRequest {
  string appointment_id = 1;
  string appointment_group_id = 2;
  AccessContext access = 3;
}

message GetPendingConsentResponse {
  bool has_pending = 1;
  PendingConsent consent = 2;
  bool signed = 3;
  ConsentSignature signature = 4;
}

message ConsentSignature {
  string id = 1;
  string client_signature_id = 2;
  string appointment_group_id = 3;
  string template_id = 4;
  int32 template_version = 5;
  string rendered_text = 6;
  string rendered_hash = 7;
  google.protobuf.Struct act_details = 8;
  string signer_user_id = 9;
  string signer_profile_id = 10;
  google.protobuf.Timestamp read_confirmed_at = 11;
  google.protobuf.Timestamp accepted_at = 12;
  google.protobuf.Timestamp signed_at_device = 13;
  google.protobuf.Timestamp received_at = 14;
  int32 clock_skew_seconds = 15;
  string signature_png_key = 16;
  string pdf_key = 17;
  string vet_profile_id = 18;
  google.protobuf.Timestamp vet_attested_at = 19;
  google.protobuf.Timestamp revoked_at = 20;
  string revocation_reason = 21;
  repeated string record_ids = 22;
}

message SubmitConsentSignatureRequest {
  // Lo genera el DISPOSITIVO antes de firmar: clave de idempotencia offline.
  string client_signature_id = 1;
  string appointment_id = 2;
  string appointment_group_id = 19;
  // El vet responsable del acto y el titular que firma; los arma la gateway.
  string vet_profile_id = 20;
  string client_profile_id = 21;
  string template_id = 3;
  string template_hash = 4;         // el de la plantilla que se mostró
  google.protobuf.Struct act_details = 5;
  string rendered_text = 6;         // el texto exacto que se leyó

  // Lectura efectiva e intención, separadas del trazo a propósito.
  google.protobuf.Timestamp read_confirmed_at = 7;
  google.protobuf.Timestamp accepted_at = 8;
  google.protobuf.Timestamp signed_at_device = 9;

  // Trazo compacto: [[x,y,t],...] con enteros escalados 0..10000.
  google.protobuf.ListValue strokes = 10;
  string signature_png_key = 11;    // subido a R2 con URL prefirmada

  string device_id = 12;
  string app_version = 13;
  string ip = 14;
  double lat = 15;
  double lng = 16;
  int32 location_accuracy_m = 17;

  AccessContext access = 18;
}

message ConsentSignatureResponse {
  ConsentSignature signature = 1;
}

message AttestConsentRequest {
  string signature_id = 1;
  string appointment_id = 2;
  string vet_profile_id = 4;
  AccessContext access = 3;
}

message GetConsentStatusRequest {
  string appointment_id = 1;
  string record_id = 2;
  string appointment_group_id = 3;
  AccessContext access = 4;
  repeated string follow_up_pet_ids = 5;
  string follow_up_vet_profile_id = 6;
  uint32 follow_up_window_days = 7;
}

message GetConsentStatusResponse {
  bool signed = 1;              // el dueño firmó
  bool attested = 2;            // el vet dejó constancia
  bool valid = 3;               // ambas y sin revocar → puede arrancar la cita
  ConsentSignature signature = 4;
  string blocking_reason = 5;   // qué falta, para mostrarlo en la app del vet
  bool requested = 6;           // el vet ya emitió y el titular lo tiene pendiente
  bool reused_from_episode = 7;
}

message RevokeConsentRequest {
  string signature_id = 1;
  string reason = 2;
  AccessContext access = 3;
}

message PublishConsentTemplateRequest {
  ConsentKind kind = 1;
  ConsentCategory category = 2;
  string locale = 3;
  string title = 4;
  string body_md = 5;
  string published_by_user_id = 6;
  string notes = 7;
}

message ListConsentTemplatesRequest {
  ConsentKind kind = 1;
  ConsentCategory category = 2;
  string locale = 3;
}

message ListConsentTemplatesResponse {
  repeated ConsentTemplate templates = 1;
}

message DocumentTemplate {
  string id = 1;
  string kind = 2;              // diagnostic_order
  int32 version = 3;
  string locale = 4;
  string title = 5;
  string intro = 6;
  string body_md = 7;           // con {{variables}}
  string body_hash = 8;
  string footer = 9;
  repeated string variables = 10;
  string status = 11;           // draft · published · retired
  google.protobuf.Timestamp published_at = 12;
  google.protobuf.Timestamp created_at = 13;
  string notes = 14;
}

message ListDocumentTemplatesRequest {
  string kind = 1;              // Vacío = todas
}

message ListDocumentTemplatesResponse {
  repeated DocumentTemplate templates = 1;
  // Las {{variables}} que el servicio sabe llenar para ese kind. Quien redacta
  // necesita saberlo ANTES de escribir: una que no esté aquí no se rechaza
  // tarde, se imprimiría entre llaves en un documento clínico.
  repeated string available_variables = 2;
}

message CreateDocumentTemplateVersionRequest {
  string kind = 1;
  string title = 2;
  string intro = 3;
  string body_md = 4;
  string footer = 5;
  string notes = 6;
  string actor_user_id = 7;
}

message PublishDocumentTemplateRequest {
  string template_id = 1;
  string actor_user_id = 2;
}

message DocumentTemplateResponse {
  DocumentTemplate template = 1;
}

message PreviewDocumentTemplateRequest {
  string template_id = 1;
}

message PreviewDocumentTemplateResponse {
  bytes pdf = 1;                // El documento con datos de ejemplo
  string rendered_text = 2;     // El texto interpolado, para revisarlo en claro
}

message AnonymizeClientDataRequest {
  string client_profile_id = 1;
}

message AnonymizeClientDataResponse {
  int32 records_anonymized = 1;
  int32 summaries_cleared = 2;
  int32 consents_anonymized = 3;
}
