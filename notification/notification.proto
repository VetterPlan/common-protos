syntax = "proto3";

package notification;

import "google/protobuf/timestamp.proto";

// ═══════════════════════════════════════════════════════════════════════════
// NOTIFICATION SERVICE
//
// Delivers push notifications to mobile devices via Firebase Cloud Messaging.
// Called by appointment-service (and future services) via gRPC to send
// targeted push messages tied to appointment lifecycle events.
//
// Responsibilities:
//   - Register / unregister FCM device tokens per user
//   - Send single-user push notifications
//   - Broadcast to a topic (e.g. admin alerts)
//
// All SendPush* calls are fire-and-forget from the caller's perspective —
// the service handles FCM retries internally.
// ═══════════════════════════════════════════════════════════════════════════

service NotificationService {

  // Register an FCM device token for a user (call on app launch / token refresh)
  rpc RegisterDeviceToken (RegisterDeviceTokenRequest) returns (RegisterDeviceTokenResponse);

  // Remove a device token (call on logout or token invalidation)
  rpc UnregisterDeviceToken (UnregisterDeviceTokenRequest) returns (UnregisterDeviceTokenResponse);

  // Send a push notification to a specific user (all their active devices)
  rpc SendPushNotification (SendPushNotificationRequest) returns (SendPushNotificationResponse);

  // Broadcast to a named topic (e.g. "admin-alerts")
  rpc BroadcastToTopic (BroadcastToTopicRequest) returns (BroadcastToTopicResponse);

  // Consulta de entregas. Sin esto no se puede saber si un aviso LLEGÓ, y por
  // tanto no se puede detectar el fallo más caro que existe: el silencio.
  //
  // Contrato crítico: si el servicio no puede responder, debe devolver error,
  // NUNCA una lista vacía. Vacío significa "no hubo entregas" y quien consulta
  // lo interpreta como "le fallamos al usuario". Confundir "no hay" con "no
  // pude consultar" dispara compensaciones automáticas sobre un hecho falso.
  rpc ListDeliveries (ListDeliveriesRequest) returns (ListDeliveriesResponse);

  // Send transactional email via SendGrid/SES (S2-12). Async, non-blocking.
  rpc SendEmail (SendEmailRequest) returns (SendEmailResponse);

  // ─── SCHEDULED REMINDERS ───
  // Programa un push para enviarse en `due_at` (no ahora). El motor de
  // recordatorios de notification-service lo persiste y lo dispara cuando vence.
  // Idempotente por idempotency_key: reprogramar el mismo recordatorio no
  // duplica. Lo llaman pets-service (vacunas/desparasitación próximas) y
  // medhistory-service (follow-up agendado por el vet).
  rpc ScheduleReminder (ScheduleReminderRequest) returns (ScheduleReminderResponse);

  // Cancela un recordatorio aún no enviado (p.ej. si se re-agenda la dosis).
  rpc CancelReminder (CancelReminderRequest) returns (CancelReminderResponse);

  // ─── COPY EDITABLE (panel de admin) ───
  // El texto de cada aviso vivía en el código: cambiar una palabra costaba un
  // despliegue. Estos RPCs lo mueven a la DB, con el default del código como
  // respaldo (fila ausente = texto original, así revertir no despliega nada).
  //
  // Contrato crítico: `variables` es lo único interpolable. Un texto que use
  // una variable que ningún servicio envía NO se guarda — si se guardara, no
  // fallaría acá sino al enviarse, y el aviso no saldría.
  rpc ListNotificationCopy (ListNotificationCopyRequest) returns (ListNotificationCopyResponse);
  rpc UpdateNotificationCopy (UpdateNotificationCopyRequest) returns (NotificationCopyEntry);
  rpc PreviewNotificationCopy (PreviewNotificationCopyRequest) returns (PreviewNotificationCopyResponse);
  rpc RevertNotificationCopy (RevertNotificationCopyRequest) returns (NotificationCopyEntry);
}

// ═══════════════════════════════════════════════════════════════════════════
// ENUMS
// ═══════════════════════════════════════════════════════════════════════════

enum NotificationPlatform {
  NOTIFICATION_PLATFORM_UNSPECIFIED = 0;
  NOTIFICATION_PLATFORM_IOS         = 1;
  NOTIFICATION_PLATFORM_ANDROID     = 2;
  NOTIFICATION_PLATFORM_WEB         = 3;
}

// Semantic event types — used by the service to build localised copy
// and choose the correct notification channel/priority.
enum NotificationEvent {
  NOTIFICATION_EVENT_UNSPECIFIED        = 0;

  // Appointment lifecycle (client perspective)
  NOTIFICATION_EVENT_APPOINTMENT_REQUESTED  = 1;  // booking confirmed
  NOTIFICATION_EVENT_APPOINTMENT_ACCEPTED   = 2;  // vet has accepted
  NOTIFICATION_EVENT_APPOINTMENT_CANCELLED  = 3;
  NOTIFICATION_EVENT_APPOINTMENT_REJECTED   = 4;

  // Vet on the way (client perspective)
  NOTIFICATION_EVENT_VET_EN_ROUTE           = 5;
  NOTIFICATION_EVENT_VET_ARRIVED            = 6;

  // Service underway (both)
  NOTIFICATION_EVENT_SERVICE_STARTED        = 7;
  NOTIFICATION_EVENT_SERVICE_COMPLETED      = 8;

  // No-show
  NOTIFICATION_EVENT_CLIENT_NO_SHOW         = 9;  // sent to vet
  NOTIFICATION_EVENT_APPOINTMENT_NO_SHOW    = 10; // sent to client

  // Payment
  NOTIFICATION_EVENT_PAYMENT_AUTHORIZED     = 11;
  NOTIFICATION_EVENT_PAYMENT_CAPTURED       = 12;
  NOTIFICATION_EVENT_PAYMENT_FAILED         = 13;

  // Vet-specific
  NOTIFICATION_EVENT_NEW_APPOINTMENT_NEARBY = 20; // broadcast to area vets
  NOTIFICATION_EVENT_VET_PAYOUT_SENT        = 21;

  // No-show warnings (client perspective — before auto NO_SHOW fires)
  NOTIFICATION_EVENT_NO_SHOW_WARNING        = 22; // sent at 10 min and 20 min after ARRIVED

  // Review reminder (client perspective)
  NOTIFICATION_EVENT_REVIEW_REMINDER        = 23; // sent 2h after COMPLETED if no review yet

  // Medical record (client perspective)
  NOTIFICATION_EVENT_MEDICAL_RECORD_READY   = 24; // vet finalizó el registro clínico

  // Recordatorios de cuidado preventivo (client perspective) — motor de recurrencia
  NOTIFICATION_EVENT_VACCINE_DUE            = 25; // próxima dosis de vacuna
  NOTIFICATION_EVENT_DEWORMING_DUE          = 26; // próxima desparasitación
  NOTIFICATION_EVENT_FOLLOW_UP_DUE          = 27; // seguimiento agendado por el vet

  // Consentimiento informado (client perspective)
  NOTIFICATION_EVENT_CONSENT_SIGNATURE_REQUESTED = 28; // el vet emitió el documento a firmar

  // Consentimiento informado (vet perspective)
  NOTIFICATION_EVENT_CONSENT_ISSUE_FAILED = 29; // la emisión automática falló: el vet debe emitirlo a mano

  // Reputación (client perspective)
  NOTIFICATION_EVENT_OUTCOME_CHECKIN = 30; // 72 h después de la visita: ¿cómo sigue el animal?

  NOTIFICATION_EVENT_CONSTANCIA_DECISION_NEEDED  = 31;
  NOTIFICATION_EVENT_CONSTANCIA_HUMAN_TOOK_OVER  = 32;
  NOTIFICATION_EVENT_CONSTANCIA_RESOLVED         = 33;

  // System / admin
  NOTIFICATION_EVENT_SYSTEM_ALERT           = 99;
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES
// ═══════════════════════════════════════════════════════════════════════════

message RegisterDeviceTokenRequest {
  string user_id    = 1;  // profile UUID (client or vet)
  string fcm_token  = 2;  // FCM registration token from the device
  NotificationPlatform platform = 3;
  string device_id  = 4;  // stable device identifier (for deduplication)
}

message RegisterDeviceTokenResponse {
  bool   success = 1;
}

message UnregisterDeviceTokenRequest {
  string fcm_token = 1;
}

message UnregisterDeviceTokenResponse {
  bool success = 1;
}

// Extra key-value pairs merged into the FCM data payload.
message NotificationDataEntry {
  string key   = 1;
  string value = 2;
}

message SendPushNotificationRequest {
  // Recipient — at least one of user_id or fcm_tokens must be set.
  // If user_id is provided, the service looks up all active tokens for that user.
  string recipient_user_id = 1;

  // Event type — drives copy generation and channel priority inside the service.
  NotificationEvent event = 2;

  // Optional explicit title/body (overrides auto-generated copy when set).
  string title = 3;
  string body  = 4;

  // Structured context passed as FCM data payload (deep-link, IDs, etc.)
  repeated NotificationDataEntry data = 5;

  // Idempotency key — de-duplicates retries within a 24-hour window.
  string idempotency_key = 6;

  // Situación concreta, cuando el evento solo no la determina. Un mismo
  // NotificationEvent lleva textos distintos —APPOINTMENT_CANCELLED es "Cita
  // cancelada", "Pago rechazado" y "Visita reasignada"—, así que el llamador
  // declara CUÁL es y notification-service pone las palabras. Vacío = el texto
  // por defecto del evento. El catálogo vive en notification-service y es
  // editable desde el panel de admin sin desplegar.
  string copy_key = 7;
}

message SendPushNotificationResponse {
  bool   success           = 1;
  int32  tokens_sent       = 2;  // number of FCM messages dispatched
  int32  tokens_failed     = 3;
  string error_message     = 4;  // non-empty only on hard failure
}

message BroadcastToTopicRequest {
  string topic             = 1;  // FCM topic name (no leading slash)
  string title             = 2;
  string body              = 3;
  repeated NotificationDataEntry data = 4;
  string copy_key          = 5;  // ver SendPushNotificationRequest.copy_key
}

message BroadcastToTopicResponse {
  bool   success       = 1;
  string error_message = 2;
}

// S2-12: Email templates
enum EmailTemplate {
  EMAIL_TEMPLATE_UNSPECIFIED = 0;
  EMAIL_TEMPLATE_APPOINTMENT_CONFIRMED = 1;
  EMAIL_TEMPLATE_SERVICE_COMPLETED_RECEIPT = 2;
}

message SendEmailRequest {
  string recipient_email = 1;

  EmailTemplate template = 2 [deprecated = true];
  map<string, string> template_data = 3;
  string idempotency_key = 4;
  string template_key = 5;
  google.protobuf.Timestamp due_at = 6;
  string recipient_user_id = 7;
}

message SendEmailResponse {
  bool success = 1;
  string error_message = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// SCHEDULED REMINDERS
// ═══════════════════════════════════════════════════════════════════════════

message ScheduleReminderRequest {
  // A quién se le envía. El llamador resuelve el user_id.
  string recipient_user_id = 1;

  // Tipo de evento — maneja el copy y la prioridad del canal.
  NotificationEvent event = 2;

  string title = 3;
  string body  = 4;

  // Payload estructurado (deep-link, IDs) que llega como data de FCM.
  repeated NotificationDataEntry data = 5;

  // Cuándo enviarlo. El llamador ya restó el tiempo de anticipación
  // (p.ej. avisar 7 días antes del vencimiento).
  google.protobuf.Timestamp due_at = 6;

  // Deduplica: reprogramar la misma dosis no crea otro recordatorio.
  // Ej. "vaccine_due:{vaccination_id}:{next_due_date}".
  string idempotency_key = 7;

  // Servicio y motivo que lo agendó, para auditoría y para la vista de admin.
  // Ej. "pets_preventive", "medhistory_followup".
  string source = 8;

  // Situación concreta (ver SendPushNotificationRequest.copy_key). El texto se
  // resuelve al ENVIAR, no al programar: un recordatorio agendado a 30 días
  // saldría con el copy de hace un mes.
  string copy_key = 9;
}

message ScheduleReminderResponse {
  // false si ya existía uno con el mismo idempotency_key (no se duplicó).
  bool scheduled = 1;
  string reminder_id = 2;
}

message CancelReminderRequest {
  // Uno de los dos.
  string reminder_id = 1;
  string idempotency_key = 2;
}

message CancelReminderResponse {
  bool cancelled = 1;
}

// ═══════════════════════════════════════════════════════════════════════════
// REGISTRO DE ENTREGAS
//
// El envío FCM era fire-and-forget: no quedaba rastro de si el push llegó. Sin
// ese rastro, un bug de configuración puede dejar a todos los usuarios sin
// avisos durante días sin que nada lo note (pasó el 2026-07-30 con
// NOTIFICATION_GRPC_URL apuntando a localhost).
// ═══════════════════════════════════════════════════════════════════════════

enum DeliveryChannel {
  DELIVERY_CHANNEL_UNSPECIFIED = 0;
  DELIVERY_CHANNEL_PUSH        = 1;
  DELIVERY_CHANNEL_EMAIL       = 2;
}

message Delivery {
  string                    id                = 1;
  string                    recipient_user_id = 2;
  NotificationEvent         event             = 3;
  DeliveryChannel           channel           = 4;

  // true solo si el proveedor confirmó la entrega. Un envío aceptado por la
  // API pero no entregado al dispositivo NO cuenta como entregado.
  bool                      delivered         = 5;
  string                    failure_reason    = 6;

  int32                     tokens_sent       = 7;
  int32                     tokens_failed     = 8;
  string                    idempotency_key   = 9;
  google.protobuf.Timestamp attempted_at      = 10;
  google.protobuf.Timestamp delivered_at      = 11;
}

message ListDeliveriesRequest {
  string                    user_id = 1;
  google.protobuf.Timestamp since   = 2;

  // Filtro opcional. Sin él devuelve todos los eventos de la ventana.
  NotificationEvent         event   = 3;
  DeliveryChannel           channel = 4;
  int32                     limit   = 5;
}

message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;

  // Ventana efectivamente cubierta por el registro. Si el servicio solo
  // conserva 30 días y se pregunta por 90, quien consulta tiene que saber que
  // la ausencia de entregas fuera de esa ventana no significa nada.
  google.protobuf.Timestamp retained_since = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// COPY EDITABLE
// ═══════════════════════════════════════════════════════════════════════════

// Un campo editable de un correo. Push usa title/body; correo tiene varios.
message CopySlot {
  string name  = 1;  // subject | eyebrow | title | message | preheader | ...
  string label = 2;  // etiqueta para el panel
  string text  = 3;
}

message NotificationCopyEntry {
  // Clave editable. Más fina que el evento: un mismo NotificationEvent lleva
  // textos distintos según la situación.
  string copy_key = 1;

  // Evento y destinatario al que pertenece, para agrupar en el panel.
  string event    = 2;
  string audience = 3;  // client | vet | topic

  // Texto vigente (el override si existe, el default del código si no).
  string title = 4;
  string body  = 5;

  // Texto original del código, para mostrar el diff y ofrecer "revertir".
  string default_title = 6;
  string default_body  = 7;

  // Lo único que se puede interpolar. El panel las ofrece y rechaza cualquier
  // otra al guardar.
  repeated string variables = 8;

  // false = nadie lo ha tocado, se está usando el default.
  bool overridden = 9;

  // Para bloqueo optimista: se manda de vuelta en UpdateNotificationCopy. 0
  // mientras no haya override.
  int32  version    = 10;
  string updated_by = 11;
  google.protobuf.Timestamp updated_at = 12;

  // push | email. El correo no cabe en título + cuerpo: trae sus slots acá y
  // deja title/body vacíos.
  string channel = 13;
  repeated CopySlot slots         = 14;
  repeated CopySlot default_slots = 15;

  // Nombres para humanos. El panel lo usa gente que no tiene por qué saber
  // inglés, y `event`/`copy_key` son identificadores, no etiquetas. Viven acá
  // —donde se declara la clave— para que agregar una obligue a nombrarla.
  string label       = 16;  // "Último aviso antes de cancelar"
  string description = 17;  // cuándo se dispara
  string event_label = 18;  // "Avisos del PIN"
}

message ListNotificationCopyRequest {
  // Filtros opcionales. Sin ellos devuelve el catálogo entero.
  string event = 1;
  bool   only_overridden = 2;
  string channel = 3;  // push | email; vacío = ambos
}

message ListNotificationCopyResponse {
  repeated NotificationCopyEntry entries = 1;
}

message UpdateNotificationCopyRequest {
  string copy_key = 1;
  string title    = 2;
  string body     = 3;

  // Quién lo cambia. Queda en el historial: este texto sale hacia todos los
  // usuarios y "quién escribió esto" tiene que tener respuesta.
  string updated_by = 4;

  // Versión sobre la que se editó. Si otro admin guardó en el medio, se
  // rechaza con ABORTED en vez de pisarlo. 0 = no había override.
  int32 expected_version = 5;

  // Para correo: los slots que se cambian. Los que no se manden quedan como
  // están. title/body se ignoran cuando esto viene lleno.
  repeated CopySlot slots = 6;
}

message PreviewNotificationCopyRequest {
  string copy_key = 1;

  // Texto tentativo. Vacío = previsualiza el vigente.
  string title = 2;
  string body  = 3;

  // Valores de ejemplo para las variables.
  repeated NotificationDataEntry sample_data = 4;

  // Para correo: slots tentativos. Vacío = previsualiza los vigentes.
  repeated CopySlot slots = 5;
}

message PreviewNotificationCopyResponse {
  string rendered_title = 1;
  string rendered_body  = 2;

  // Para correo: el HTML que produce el render de marca. Lo que se ve en el
  // panel es lo que sale del servidor, no una aproximación del navegador.
  string rendered_html = 4;

  // Variables usadas en el texto que no traen valor de ejemplo: así se ve el
  // hueco antes de publicar, no después de enviar.
  repeated string missing_variables = 3;
}

message RevertNotificationCopyRequest {
  string copy_key   = 1;
  string updated_by = 2;
}
