// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Core Entities
// ═══════════════════════════════════════════════════════════════════════════

message Payment {
  string id = 1;
  string appointment_id = 2;
  string client_profile_id = 3;
  string vet_profile_id = 4;

  // Amounts
  double amount_subtotal = 5;
  double platform_fee_amount = 6;
  double gateway_fee_amount = 7;
  double vet_payout_amount = 8;
  double amount_total = 9;
  double wallet_amount_used = 10;
  double gateway_amount_charged = 11;
  double tip_amount = 12;

  string currency = 13;
  PaymentStatus status = 14;
  PaymentGateway gateway = 15;

  // Gateway info
  string gateway_transaction_id = 16;
  string gateway_auth_code = 17;

  // Refund tracking
  double refund_total_amount = 18;
  double refund_to_wallet_amount = 19;
  double refund_to_gateway_amount = 20;
  double no_show_fee_amount = 21;

  string idempotency_key = 22;

  // Timestamps
  google.protobuf.Timestamp created_at = 23;
  google.protobuf.Timestamp authorized_at = 24;
  google.protobuf.Timestamp captured_at = 25;
  google.protobuf.Timestamp voided_at = 26;
  google.protobuf.Timestamp refunded_at = 27;

  // Capture retry tracking
  google.protobuf.Timestamp capture_failed_at = 28;
  int32 capture_retry_count = 29;
  google.protobuf.Timestamp capture_next_retry_at = 30;

  // Estado CRUDO devuelto por la pasarela: DECLINED | APPROVED | PENDING |
  // VOIDED | ERROR. Sin esto no se distingue un rechazo real de un cobro en
  // curso, y tratar PENDING como fallo cobra dos veces y crea deuda falsa.
  // Nuestro `status` es una interpretación; esto es el dato de origen.
  string gateway_status = 31;
  string gateway_status_detail = 32;

  // Últimos 4 de la tarjeta usada. Sin PAN ni BIN: solo lo que le sirve al
  // usuario para reconocer cuál de sus tarjetas fue.
  string card_last4 = 33;
}

message Wallet {
  string id = 1;
  string owner_id = 2;
  WalletOwnerType owner_type = 3;
  double balance = 4;
  double pending_balance = 5;
  double available_balance = 6;
  double total_credited = 7;
  double total_debited = 8;
  string currency = 9;
  bool is_active = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message WalletTransaction {
  string id = 1;
  string wallet_id = 2;
  WalletTransactionType type = 3;
  double amount = 4;
  double balance_before = 5;
  double balance_after = 6;
  WalletTransactionReason reason = 7;
  WalletReferenceType reference_type = 8;
  string reference_id = 9;
  string description = 10;
  google.protobuf.Timestamp created_at = 11;

  // La clave con la que se pidió el movimiento. La columna existe desde la
  // migración 011 y el contrato no la devolvía, así que quien necesitara saber
  // QUÉ acción causó este crédito no podía preguntarlo: el saldo dice cuánto
  // hay, no de dónde salió.
  //
  // Es la referencia causal, no una segunda idempotencia: la fuente sigue
  // siendo la clave del outbox de quien pidió el movimiento.
  string idempotency_key = 12;
}

message ClientPaymentMethod {
  string id = 1;
  string client_profile_id = 2;
  PaymentMethodType type = 3;
  CardBrand card_brand = 4;
  string last_four = 5;
  int32 expiry_month = 6;
  int32 expiry_year = 7;
  string holder_name = 8;
  string nequi_phone = 9;
  bool is_default = 10;
  bool is_active = 11;
  google.protobuf.Timestamp created_at = 12;
}

message VetBankAccount {
  string id = 1;
  string vet_profile_id = 2;
  string bank_name = 3;
  BankAccountType account_type = 4;
  string account_number_masked = 5;
  string holder_name = 6;
  DocumentType holder_document_type = 7;
  bool is_verified = 8;
  bool is_primary = 9;
  google.protobuf.Timestamp created_at = 10;
}

message VetPayout {
  string id = 1;
  string vet_profile_id = 2;
  string period_start = 3;
  string period_end = 4;
  int32 total_appointments = 5;
  double total_earnings = 6;
  double total_tips = 7;
  double total_no_show_earnings = 8;
  double net_payout = 9;
  PayoutStatus status = 10;
  string bank_account_id = 11;
  string wompi_transfer_ref = 12;
  google.protobuf.Timestamp processed_at = 13;
  string failed_reason = 14;
  google.protobuf.Timestamp created_at = 15;
}

message Refund {
  string id = 1;
  string payment_id = 2;
  double amount = 3;
  RefundDestination destination = 4;
  double wallet_amount = 5;
  double gateway_amount = 6;
  RefundReason reason = 7;
  string reason_details = 8;
  RefundStatus status = 9;
  string wompi_refund_id = 10;
  string initiated_by = 11;
  string idempotency_key = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp completed_at = 14;

  // De quién es este reembolso. Sale del pago al que pertenece —no hay columna
  // nueva en `refunds`: duplicar el dueño crearía dos verdades sobre el mismo
  // hecho, que es lo que §20 del plan de VetterPay rechaza—. Se revela aquí
  // para que quien autorice no tenga que encadenar servicios para deducirlo.
  //
  // NO confundir con `refund_owner` (F3-4), que dice quién ASUME el coste. Este
  // dice quién lo RECIBE, y es el único que sirve para autorizar una lectura.
  string client_profile_id = 15;
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Requests
// ═══════════════════════════════════════════════════════════════════════════

// ─── Payment Lifecycle ───

message CreatePaymentRequest {
  string appointment_id = 1;
  string client_profile_id = 2;
  string vet_profile_id = 3;
  double amount_subtotal = 4;
  string currency = 5;
  string idempotency_key = 6;
  // VP-H7. `amount_subtotal` es el precio del servicio SIN descontar; el
  // descuento viaja aparte para que quede escrito en el pago quien lo pago.
  // Restarlo antes de llamar hace que la comision se reparta sobre el total ya
  // rebajado y el veterinario financie la campana sin saberlo.
  string promo_id = 7;
  double discount_amount = 8;
  // F1-R2. `amount_subtotal` es la BASE del servicio, sin IVA. El IVA viaja
  // aparte porque no entra en la base de comision: comisionar sobre impuestos
  // encarece el servicio artificialmente. Es del veterinario, no de VetterPlan,
  // y se le transfiere con su pago.
  double iva_amount = 9;
}

message AuthorizePaymentRequest {
  string payment_id = 1;
  string payment_method_id = 2;
  string acceptance_token = 3;
  string accept_personal_auth = 4;
  string idempotency_key = 5;
}

message CapturePaymentRequest {
  string payment_id = 1;
  string idempotency_key = 2;
  // Vet-confirmed final price to capture (COP). 0 = capture the full
  // pre-authorized amount. Capped server-side at the authorized total.
  double amount = 3;
}

message VoidPaymentRequest {
  string payment_id = 1;
  string reason = 2;
  string idempotency_key = 3;
}

message RefundPaymentRequest {
  string payment_id = 1;
  double amount = 2;
  RefundDestination destination = 3;
  RefundReason reason = 4;
  string reason_details = 5;
  string initiated_by = 6;
  string idempotency_key = 7;
}

message ChargeNoShowFeeRequest {
  string payment_id = 1;
  string idempotency_key = 2;
}

message ChargeCancellationFeeRequest {
  string payment_id = 1;
  string idempotency_key = 2;
  // 'no_show' | 'consent_refused'. Vacío = no_show.
  string reason = 3;
}

message QuoteCancellationFeeRequest {
  string payment_id = 1;
  // Mismos valores que ChargeCancellationFeeRequest.reason. Vacío = no_show.
  string reason = 2;
}

message QuoteCancellationFeeResponse {
  // false cuando el motivo no cobra, o cuando el pago no admite cobro todavía.
  bool chargeable = 1;
  double fee_percent = 2;
  double fee_amount_cop = 3;
  // La base sobre la que se aplicó el porcentaje.
  double amount_total_cop = 4;
  // Por qué no se cobra, cuando chargeable es false. Para mostrar "es gratis"
  // sin que el cliente tenga que deducirlo de un cero.
  string not_chargeable_reason = 5;
}

message AddTipRequest {
  string payment_id = 1;
  double amount = 2;
  string payment_method_id = 3;
  string idempotency_key = 4;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentByAppointmentRequest {
  string appointment_id = 1;
}

message ListPaymentsByAppointmentRequest {
  string appointment_id = 1;
}

message ListPaymentsByAppointmentResponse {
  repeated Payment payments = 1;
}

message GetRefundsRequest {
  string payment_id = 1;
}

message GetRefundsByClientRequest {
  string client_profile_id = 1;
  int32  limit  = 2;   // 0 = el default del servicio
  int32  offset = 3;
}

message GetClientCollectionStatusRequest {
  string client_profile_id = 1;
}

message OutstandingCollection {
  string payment_id = 1;
  string appointment_id = 2;
  double amount = 3;
  string currency = 4;
  int32 retry_count = 5;
  bool retries_exhausted = 6;
  google.protobuf.Timestamp failed_at = 7;
  google.protobuf.Timestamp next_retry_at = 8;
  string last_error = 9;
}

message GetClientCollectionStatusResponse {
  bool has_outstanding = 1;
  double total_amount = 2;
  string currency = 3;
  int32 count = 4;
  repeated OutstandingCollection collections = 5;
}

message ListFailedCollectionsRequest {
  int32 limit = 1;
  int32 offset = 2;
  bool only_exhausted = 3;
}

message ClientOutstandingSummary {
  string client_profile_id = 1;
  double total_amount = 2;
  int32 count = 3;
  google.protobuf.Timestamp oldest_failed_at = 4;
}

message ListFailedCollectionsResponse {
  repeated ClientOutstandingSummary clients = 1;
  int32 total_count = 2;
  double total_amount = 3;
}

message WriteOffCollectionRequest {
  string payment_id = 1;
  string admin_user_id = 2;
  string reason = 3;
}

// ─── Wallet ───

message CreateWalletRequest {
  string owner_id = 1;
  WalletOwnerType owner_type = 2;
}

message GetWalletRequest {
  string owner_id = 1;
  WalletOwnerType owner_type = 2;
  string wallet_id = 3;
}

message GetWalletTransactionsRequest {
  string wallet_id = 1;
  WalletTransactionType type_filter = 2;
  WalletTransactionReason reason_filter = 3;
  int32 limit = 4;
  int32 offset = 5;
}

// `idempotency_key` es opcional por compatibilidad, pero sin ella el llamador no
// puede distinguir un timeout de un abono perdido: reintentar abona dos veces.
// Con ella, repetir la llamada devuelve el mismo saldo sin mover un peso.
message CreditWalletRequest {
  string owner_id = 1;
  WalletOwnerType owner_type = 2;
  double amount = 3;
  WalletTransactionReason reason = 4;
  WalletReferenceType reference_type = 5;
  string reference_id = 6;
  string description = 7;
  string idempotency_key = 8;
}

// Existe para que un abono se pueda REVERTIR. Sin esto, todo crédito es
// irreversible y quien lo emite no puede compensarse a sí mismo si se equivoca.
// Nunca deja el saldo en negativo: si no alcanza, falla en voz alta.
message DebitWalletRequest {
  string owner_id = 1;
  WalletOwnerType owner_type = 2;
  double amount = 3;
  WalletTransactionReason reason = 4;
  WalletReferenceType reference_type = 5;
  string reference_id = 6;
  string description = 7;
  string idempotency_key = 8;
}

message GetBalanceRequest {
  string owner_id = 1;
  WalletOwnerType owner_type = 2;
}

message FreezeWalletRequest {
  string wallet_id = 1;
  string reason = 2;
  string actor_id = 3;
}

message UnfreezeWalletRequest {
  string wallet_id = 1;
  string reason = 2;
  string actor_id = 3;
}

// ─── Payment Methods ───

message AddPaymentMethodRequest {
  string client_profile_id = 1;
  PaymentMethodType type = 2;
  string wompi_token = 3;
  string acceptance_token = 4;
  string accept_personal_auth = 5;
  // Card-specific
  string holder_name = 6;
  // Nequi-specific
  string nequi_phone = 7;
  // Required by Wompi for payment source creation
  string customer_email = 8;
  // Card expiry from frontend tokenization (fallback when Wompi doesn't return them)
  int32 card_expiry_month = 9;
  int32 card_expiry_year = 10;
}

message GetPaymentMethodsRequest {
  string client_profile_id = 1;
}

message RemovePaymentMethodRequest {
  string payment_method_id = 1;
  string client_profile_id = 2;
}

// ─── Payouts ───

message RequestPayoutRequest {
  string vet_profile_id = 1;
  string bank_account_id = 2;
}

message GetPayoutHistoryRequest {
  string vet_profile_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

// ─── Bank Accounts ───

message AddBankAccountRequest {
  string vet_profile_id = 1;
  string bank_name = 2;
  BankAccountType account_type = 3;
  string account_number = 4;
  string holder_name = 5;
  DocumentType holder_document_type = 6;
  string holder_document_number = 7;
  bool is_primary = 8;
}

message GetBankAccountsRequest {
  string vet_profile_id = 1;
}

// ─── Vet Earnings ───

message GetVetBlockedEarningsRequest {
  string vet_profile_id = 1;
  int32  limit  = 2;   // 0 = el default del servicio
}

message BlockedEarning {
  string payment_id = 1;
  string vet_profile_id = 2;          // el dueño, revelado: no se deduce
  string appointment_id = 3;
  double vet_payout_amount = 4;       // lo suyo, no lo que pagó el cliente
  PaymentStatus payment_status = 5;
  google.protobuf.Timestamp capture_failed_at = 6;
  int32  capture_retry_count = 7;
  google.protobuf.Timestamp capture_next_retry_at = 8;
}

message VetBlockedEarningsResponse {
  repeated BlockedEarning earnings = 1;
  int32 total_count = 2;
}

message GetVetEarningsRequest {
  string vet_profile_id = 1;
  string period_start = 2;
  string period_end = 3;
}

message GetClientSpendingHistoryRequest {
  string client_profile_id = 1;
  string date_from = 2;   // ISO 8601 date
  string date_to = 3;     // ISO 8601 date
}

message ClientSpendingSummary {
  string appointment_id = 1;
  string vet_profile_id = 2;
  double amount = 3;
  string currency = 4;
  string captured_at = 5;
}

message ClientSpendingHistoryResponse {
  string client_profile_id = 1;
  string date_from = 2;
  string date_to = 3;
  double total_spent = 4;
  int32 count = 5;
  repeated ClientSpendingSummary items = 6;  // Optional summary list
}

// ═══════════════════════════════════════════════════════════════════════════
// MESSAGES - Responses
// ═══════════════════════════════════════════════════════════════════════════

message PaymentResponse {
  Payment payment = 1;
}

message RefundResponse {
  Refund refund = 1;
  Payment payment = 2;
}

message RefundsResponse {
  repeated Refund refunds = 1;
  int32 total_count = 2;
}

message WalletResponse {
  Wallet wallet = 1;
}

message WalletTransactionsResponse {
  repeated WalletTransaction transactions = 1;
  int32 total_count = 2;
}

message BalanceResponse {
  double balance = 1;
  double pending_balance = 2;
  double available_balance = 3;
  string currency = 4;
}

message PaymentMethodResponse {
  ClientPaymentMethod payment_method = 1;
}

message PaymentMethodsResponse {
  repeated ClientPaymentMethod payment_methods = 1;
  int32 total_count = 2;
}

message PayoutResponse {
  VetPayout payout = 1;
}

message PayoutHistoryResponse {
  repeated VetPayout payouts = 1;
  int32 total_count = 2;
}

message BankAccountResponse {
  VetBankAccount bank_account = 1;
}

message BankAccountsResponse {
  repeated VetBankAccount bank_accounts = 1;
  int32 total_count = 2;
}

message VetEarningsResponse {
  string vet_profile_id = 1;
  string period_start = 2;
  string period_end = 3;
  double total_earnings = 4;
  double total_tips = 5;
  double total_no_show_compensation = 6;
  double total_payouts = 7;
  double pending_payout = 8;
  double wallet_balance = 9;
  int32 total_appointments = 10;
  // F1-R2. El IVA que el vet recaudo a traves de la plataforma y que se le
  // transfirio con su pago. NO son ganancias suyas: las declara y las paga.
  // Va aparte para que la suma de los conceptos siga cuadrando con lo que
  // entro a su wallet.
  double total_iva_collected = 11;
}

// ─── Vet Cancellation Fee (P1.8) ───

message ChargeVetCancellationFeeRequest {
  string payment_id = 1;       // Payment for the cancelled appointment
  string vet_profile_id = 2;   // Vet whose wallet will be debited
  string idempotency_key = 3;
  double fee_amount_cop = 4;   // Override fee in COP (0 = use default % from settings)
}

// ═══════════════════════════════════════════════════════════════════════════
// FASE 3 — DISPUTES
// ═══════════════════════════════════════════════════════════════════════════

enum DisputeStatus {
  DISPUTE_STATUS_UNSPECIFIED = 0;
  DISPUTE_STATUS_OPEN = 1;
  DISPUTE_STATUS_UNDER_REVIEW = 2;
  DISPUTE_STATUS_RESOLVED_CLIENT = 3;
  DISPUTE_STATUS_RESOLVED_VET = 4;
  DISPUTE_STATUS_CANCELLED = 5;
}

enum DisputeReason {
  DISPUTE_REASON_UNSPECIFIED = 0;
  DISPUTE_REASON_SERVICE_NOT_RENDERED = 1;
  DISPUTE_REASON_QUALITY_ISSUE = 2;
  DISPUTE_REASON_INCORRECT_CHARGE = 3;
  DISPUTE_REASON_VET_NO_SHOW = 4;
  DISPUTE_REASON_OTHER = 5;
}

message Dispute {
  string id = 1;
  string payment_id = 2;
  string appointment_id = 3;
  string opened_by = 4;
  DisputeReason reason = 5;
  string reason_details = 6;
  DisputeStatus status = 7;
  string resolved_by = 8;
  string resolution_notes = 9;
  string refund_id = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp resolved_at = 12;
}

message OpenDisputeRequest {
  string payment_id = 1;
  string appointment_id = 2;
  string opened_by = 3;          // client_profile_id
  DisputeReason reason = 4;
  string reason_details = 5;
  string idempotency_key = 6;
}

message ResolveDisputeRequest {
  string dispute_id = 1;
  string resolved_by = 2;        // admin_id
  // RESOLVED_CLIENT triggers a full refund; RESOLVED_VET closes with no refund
  DisputeStatus resolution = 3;
  string resolution_notes = 4;
  string idempotency_key = 5;
}

message GetDisputeRequest {
  string dispute_id = 1;
}

message ListDisputesRequest {
  string payment_id = 2;         // filter by payment (optional)
  string opened_by = 3;          // filter by client (optional)
  DisputeStatus status_filter = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message DisputeResponse {
  Dispute dispute = 1;
}

message ListDisputesResponse {
  repeated Dispute disputes = 1;
  int32 total_count = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// FASE 3 — PROMOTIONS (feature-flagged)
// ═══════════════════════════════════════════════════════════════════════════

message ValidatePromoCodeRequest {
  string code = 1;
  string client_profile_id = 2;
  string service_type = 3;       // to check SPECIFIC_SERVICE promos
  double appointment_amount = 4; // to calculate discount
}

message ValidatePromoCodeResponse {
  bool is_valid = 1;
  string promo_id = 2;
  double discount_amount = 3;    // COP amount to deduct
  double final_amount = 4;
  string error_message = 5;      // set when is_valid=false
}

// ─── Tiered commission ───

message GetVetCommissionTierRequest {
  string vet_profile_id = 1;
}

message GetVetCommissionTierResponse {
  string tier = 1;               // "bronze" | "silver" | "gold" | "platinum"
  int32 platform_fee_percent = 2;
  int32 completed_appointments = 3;
  int32 next_tier_threshold = 4; // 0 if already at top tier
}

// ═══════════════════════════════════════════════════════════════════════════
// ADMIN REPORTS
// ═══════════════════════════════════════════════════════════════════════════

message AdminReportIncomeRequest {
  string period_start = 1;        // ISO 8601 date "YYYY-MM-DD"
  string period_end = 2;         // ISO 8601 date "YYYY-MM-DD"
}

message IncomeGlobalSummary {
  double total_revenue = 1;
  double platform_fees = 2;
  double vet_payouts = 3;
}

message IncomeByVet {
  string vet_profile_id = 1;
  string vet_name = 2;
  double total_earnings = 3;
  int32 appointment_count = 4;
}

message IncomeByService {
  string service_type = 1;
  double total_revenue = 2;
  int32 appointment_count = 3;
}

message AdminReportIncomeResponse {
  IncomeGlobalSummary global = 1;
  repeated IncomeByVet by_vet = 2;
  repeated IncomeByService by_service = 3;
}

message AdminTopVetsByIncomeRequest {
  int32 limit = 1;               // default 10
  string period_start = 2;
  string period_end = 3;
}

message TopVetByIncome {
  string vet_profile_id = 1;
  string vet_name = 2;
  double total_earnings = 3;
  int32 appointment_count = 4;
  string tier = 5;
}

message AdminTopVetsByIncomeResponse {
  repeated TopVetByIncome vets = 1;
}

message AdminDisputeStatsRequest {}

message AdminDisputeStatsResponse {
  int32 total_payments = 1;      // CAPTURED payments (successful charges)
  int32 total_disputes = 2;
  int32 open_disputes = 3;
  double dispute_rate = 4;       // total_disputes / total_payments (0.0-1.0)
}

message AdminCommissionByTierRequest {}

message CommissionByTierEntry {
  string tier = 1;
  int32 vet_count = 2;
  double total_earnings = 3;
  double platform_fees = 4;
}

message AdminCommissionByTierResponse {
  repeated CommissionByTierEntry tiers = 1;
}

// ═══════════════════════════════════════════════════════════════════════════
// P4 — RECONCILIATION
// ═══════════════════════════════════════════════════════════════════════════

message GetReconciliationReportRequest {
  string date = 1;  // ISO 8601 date "YYYY-MM-DD"
}

message TriggerReconciliationRequest {
  string date = 1;  // ISO 8601 date to reconcile
}

message ListReconciliationReportsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ReconciliationDiscrepancyProto {
  string type = 1;              // STATUS_MISMATCH | AMOUNT_MISMATCH | MISSING_LOCAL | MISSING_WOMPI
  string payment_id = 2;
  string appointment_id = 3;
  string local_status = 4;
  string wompi_status = 5;
  double local_amount = 6;
  double wompi_amount = 7;
  string severity = 8;          // LOW | MEDIUM | HIGH | CRITICAL
  bool auto_resolved = 9;
  string resolution_action = 10;
}

message ReconciliationReportResponse {
  string date = 1;
  int32 total_checked = 2;
  int32 total_discrepancies = 3;
  int32 auto_resolved_count = 4;
  int32 manual_review_count = 5;
  double gmv_cop = 6;
  double platform_revenue_cop = 7;
  repeated ReconciliationDiscrepancyProto items = 8;
}

message ListReconciliationReportsResponse {
  repeated ReconciliationReportResponse reports = 1;
  int32 total = 2;
}
