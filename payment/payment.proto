// MESSAGES - Requests
// ═══════════════════════════════════════════════════════════════════════════

// ─── Payment Lifecycle ───

message CreatePaymentRequest {
  string appointment_id = 1;
  string client_profile_id = 2;
  string vet_profile_id = 3;
  double amount_subtotal = 4;
  string currency = 5;
  string idempotency_key = 6;
  string promo_id = 7;
  double discount_amount = 8;
  double iva_amount = 9;
}

message AuthorizePaymentRequest {
  string payment_id = 1;
  string payment_method_id = 2;
  string acceptance_token = 3;
  string accept_personal_auth = 4;
  string idempotency_key = 5;
}

message CapturePaymentRequest {
  string payment_id = 1;
  string idempotency_key = 2;
  double amount = 3;
}

message VoidPaymentRequest {
  string payment_id = 1;
  string reason = 2;
  string idempotency_key = 3;
}

message RefundPaymentRequest {
  string payment_id = 1;
  double amount = 2;
  RefundDestination destination = 3;
  RefundReason reason = 4;
  string reason_details = 5;
  string initiated_by = 6;
  string idempotency_key = 7;
}

message ChargeNoShowFeeRequest {
  string payment_id = 1;
  string idempotency_key = 2;
}

message ChargeCancellationFeeRequest {
  string payment_id = 1;
  string idempotency_key = 2;
  string reason = 3;
}

message QuoteCancellationFeeRequest {
  string payment_id = 1;
  string reason = 2;
}

message QuoteCancellationFeeResponse {
  bool chargeable = 1;
  double fee_percent = 2;
  double fee_amount_cop = 3;
  double amount_total_cop = 4;
  string not_chargeable_reason = 5;
}

message AddTipRequest {
  string payment_id = 1;
  double amount = 2;
  string payment_method_id = 3;
  string idempotency_key = 4;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentByAppointmentRequest {
  string appointment_id = 1;
}

message ListPaymentsByAppointmentRequest {
  string appointment_id = 1;
}

message ListPaymentsByAppointmentResponse {
  repeated Payment payments = 1;
}

message GetRefundsRequest {
  string payment_id = 1;
}

message GetRefundsByClientRequest {
  string client_profile_id = 1;
  int32  limit  = 2;   // 0 = el default del servicio
  int32  offset = 3;
}

message GetClientCollectionStatusRequest {
  string client_profile_id = 1;
}

message OutstandingCollection {
  string payment_id = 1;
  string appointment_id = 2;
  double amount = 3;
  string currency = 4;
  int32 retry_count = 5;
  bool retries_exhausted = 6;
  google.protobuf.Timestamp failed_at = 7;
  google.protobuf.Timestamp next_retry_at = 8;
  string last_error = 9;
  string vet_profile_id = 10;
}

message GetClientCollectionStatusResponse {
  bool has_outstanding = 1;
  double total_amount = 2;
  string currency = 3;
  int32 count = 4;
  repeated OutstandingCollection collections = 5;
}

message ListFailedCollectionsRequest {
  int32 limit = 1;
  int32 offset = 2;
  bool only_exhausted = 3;
}

message ClientOutstandingSummary {
  string client_profile_id = 1;
  double total_amount = 2;
  int32 count = 3;
  google.protobuf.Timestamp oldest_failed_at = 4;
  repeated OutstandingCollection visits = 5;
}

message ListFailedCollectionsResponse {
  repeated ClientOutstandingSummary clients = 1;
  int32 total_count = 2;
  double total_amount = 3;
}

message ListPaymentsRequest {
  int32 limit = 1;
  int32 offset = 2;
  repeated PaymentStatus statuses = 3;
  string period_start = 4;
  string period_end = 5;
  string client_profile_id = 6;
  string vet_profile_id = 7;
  string appointment_id = 8;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  int32 total_count = 2;
}

message WriteOffCollectionRequest {
  string payment_id = 1;
  string admin_user_id = 2;
  string reason = 3;
}

// ─── Wallet ───

message CreateWalletRequest {
  string owner_id = 1;
  WalletOwnerType owner_type = 2;
}

message GetWalletRequest {
  string owner_id = 1;
  WalletOwnerType owner_type = 2;
  string wallet_id = 3;
}

message GetWalletBalancesByOwnersRequest {
  repeated string owner_ids = 1;   // techo de 100
}

message WalletBalance {
