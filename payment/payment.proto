  string reference_id = 6;
  string description = 7;
  string idempotency_key = 8;
}

message GetBalanceRequest {
  string owner_id = 1;
  WalletOwnerType owner_type = 2;
}

message FreezeWalletRequest {
  string wallet_id = 1;
  string reason = 2;
  string actor_id = 3;
}

message UnfreezeWalletRequest {
  string wallet_id = 1;
  string reason = 2;
  string actor_id = 3;
}

// ─── Payment Methods ───

message AddPaymentMethodRequest {
  string client_profile_id = 1;
  PaymentMethodType type = 2;
  string wompi_token = 3;
  string acceptance_token = 4;
  string accept_personal_auth = 5;
  string holder_name = 6;
  string nequi_phone = 7;
  string customer_email = 8;
  int32 card_expiry_month = 9;
  int32 card_expiry_year = 10;
}

message GetPaymentMethodsRequest {
  string client_profile_id = 1;
}

message RemovePaymentMethodRequest {
  string payment_method_id = 1;
  string client_profile_id = 2;
}

// ─── Payouts ───

message RequestPayoutRequest {
  string vet_profile_id = 1;
  string bank_account_id = 2;
}

message GetPayoutHistoryRequest {
  string vet_profile_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

// ─── Bank Accounts ───

message AddBankAccountRequest {
  string vet_profile_id = 1;
  string bank_name = 2;
  BankAccountType account_type = 3;
  string account_number = 4;
  string holder_name = 5;
  DocumentType holder_document_type = 6;
  string holder_document_number = 7;
  bool is_primary = 8;
}

message GetBankAccountsRequest {
  string vet_profile_id = 1;
}

// ─── Vet Earnings ───

message GetVetBlockedEarningsRequest {
  string vet_profile_id = 1;
  int32  limit  = 2;   // 0 = el default del servicio
}

message BlockedEarning {
  string payment_id = 1;
  string vet_profile_id = 2;          // el dueño, revelado: no se deduce
  string appointment_id = 3;
  double vet_payout_amount = 4;       // lo suyo, no lo que pagó el cliente
  PaymentStatus payment_status = 5;
  google.protobuf.Timestamp capture_failed_at = 6;
  int32  capture_retry_count = 7;
  google.protobuf.Timestamp capture_next_retry_at = 8;
}

message VetBlockedEarningsResponse {
  repeated BlockedEarning earnings = 1;
  int32 total_count = 2;
}

message GetVetEarningsRequest {
  string vet_profile_id = 1;
  string period_start = 2;
  string period_end = 3;
}

// ─── Perfil tributario del veterinario (P-3.0) ───

enum VetTaxRegime {
  VET_TAX_REGIME_UNSPECIFIED = 0;
  VET_TAX_REGIME_PERSONA_NATURAL_DECLARANTE = 1;
  VET_TAX_REGIME_PERSONA_NATURAL_NO_DECLARANTE = 2;
  VET_TAX_REGIME_REGIMEN_SIMPLE = 3;
  VET_TAX_REGIME_PERSONA_JURIDICA = 4;
}

message VetTaxProfile {
  string vet_profile_id = 1;
  VetTaxRegime tax_regime = 2;
  bool is_iva_responsible = 3;
  int32 valid_for_year = 4;
  bool art_383_election = 5;
  string art_383_acceptance_id = 6;
  string rut_document_key = 7;
