syntax = "proto3";

package payment;

import "google/protobuf/timestamp.proto";

// ═══════════════════════════════════════════════════════════════════════════
// PAYMENT SERVICE
//
// Manages payments, wallets, refunds, payouts, and payment methods for
// VeterPlan's veterinary home visits marketplace.
//
// Integrates with Wompi (Colombia) for card/Nequi processing.
// Provides wallet functionality for instant refunds and split payments.
//
// Depends on: Appointment Service (payment lifecycle triggers)
// Called by: Appointment Service, API Gateway, Admin
// ═══════════════════════════════════════════════════════════════════════════

service PaymentService {
  // ─── PAYMENT LIFECYCLE (10 RPCs) ───

  // Create a PENDING payment when appointment is requested. No money moves.
  rpc CreatePayment (CreatePaymentRequest) returns (PaymentResponse);

  // Pre-authorize payment (Wompi preauth + wallet HOLD). Called when vet accepts.
  rpc AuthorizePayment (AuthorizePaymentRequest) returns (PaymentResponse);

  // Capture authorized payment. Called when appointment completes.
  rpc CapturePayment (CapturePaymentRequest) returns (PaymentResponse);

  // Void/release pre-authorization without charging. Called on cancel/expire pre-capture.
  rpc VoidPayment (VoidPaymentRequest) returns (PaymentResponse);

  // Process refund with client-chosen destination (WALLET/GATEWAY/MIXED).
  rpc RefundPayment (RefundPaymentRequest) returns (RefundResponse);

  // Charge no-show fee (30% capture + 70% void + partial refund).
  rpc ChargeNoShowFee (ChargeNoShowFeeRequest) returns (PaymentResponse);

  // Tarifa por VIAJE PERDIDO. Mismo cálculo que el no-show con otro motivo:
  // el desplazamiento cuesta lo mismo se niegue el cliente a firmar el
  // consentimiento o no abra la puerta. Reemplaza a ChargeNoShowFee, que queda
  // como alias.
  rpc ChargeCancellationFee (ChargeCancellationFeeRequest) returns (PaymentResponse);

  // Charge 10% cancellation fee to vet wallet when vet cancels from ACCEPTED/EN_ROUTE.
  rpc ChargeVetCancellationFee (ChargeVetCancellationFeeRequest) returns (PaymentResponse);

  // Cuánto costaría cobrar ese motivo, SIN cobrar nada. Existe para que el
  // cliente pueda ver el coste antes de confirmar una cancelación: la política
  // ya cobraba y no había forma de anunciarlo.
  //
  // Los porcentajes viven aquí, junto a la base que los aplica (E1-A8), y por
  // eso la cotización también: duplicarlos en appointment los dejaría derivar.
  // No toca ninguna fila y no necesita idempotency_key.
  rpc QuoteCancellationFee (QuoteCancellationFeeRequest) returns (QuoteCancellationFeeResponse);

  // Add tip post-appointment. Goes to vet wallet.
  rpc AddTip (AddTipRequest) returns (PaymentResponse);

  // Get payment by ID.
  rpc GetPayment (GetPaymentRequest) returns (PaymentResponse);

  // Get payment by appointment ID.
  rpc GetPaymentByAppointment (GetPaymentByAppointmentRequest) returns (PaymentResponse);

  // Devuelve TODOS los pagos de una cita, no el primero. Sin esto un cobro
  // duplicado es invisible: `GetPaymentByAppointment` devuelve uno solo y quien
  // pregunta "¿le cobramos dos veces?" no tiene cómo saberlo.
  rpc ListPaymentsByAppointment (ListPaymentsByAppointmentRequest) returns (ListPaymentsByAppointmentResponse);

  // Get refunds for a payment.
  rpc GetRefunds (GetRefundsRequest) returns (RefundsResponse);

  // Los reembolsos de un cliente, acotados por su perfil EN EL ORIGEN. Sin
  // esto, enumerarlos exigía recorrer sus pagos uno a uno, y no había forma de
  // partir del cliente — que es de lo único que dispone quien pregunta por qué
  // no le ha llegado su dinero.
  rpc GetRefundsByClient (GetRefundsByClientRequest) returns (RefundsResponse);

  // Cobros pendientes de un cliente: servicios ya prestados que la pasarela no
  // pudo cobrar. Lo consulta appointment-service antes de aceptar una cita
  // nueva, y la app para avisarle al dueño que tiene un pago pendiente.
  rpc GetClientCollectionStatus (GetClientCollectionStatusRequest) returns (GetClientCollectionStatusResponse);

  // Cobros pendientes de todos los clientes. Operación de cobranza (admin).
  rpc ListFailedCollections (ListFailedCollectionsRequest) returns (ListFailedCollectionsResponse);

  // Da por perdido un cobro incobrable (admin). Sin esto un CAPTURE_FAILED solo
  // sale con un cobro exitoso: si la pasarela nunca va a aprobarlo, el cliente
  // queda bloqueado para siempre y nadie puede levantarlo.
  rpc WriteOffCollection (WriteOffCollectionRequest) returns (PaymentResponse);

  // ─── WALLET (7 RPCs) ───

  // Create wallet for new user (called by Profile Service on profile creation).
  rpc CreateWallet (CreateWalletRequest) returns (WalletResponse);

  // Get wallet with balance info.
  rpc GetWallet (GetWalletRequest) returns (WalletResponse);

  // Get wallet transaction history with pagination and filters.
  rpc GetWalletTransactions (GetWalletTransactionsRequest) returns (WalletTransactionsResponse);

  // Credit wallet (refund, promo, referral, compensation). Internal/Admin.
  rpc CreditWallet (CreditWalletRequest) returns (WalletResponse);
  rpc DebitWallet  (DebitWalletRequest)  returns (WalletResponse);

  // Get balance only (lightweight for UI header).
  rpc GetBalance (GetBalanceRequest) returns (BalanceResponse);

  // Freeze wallet (fraud prevention).
  rpc FreezeWallet (FreezeWalletRequest) returns (WalletResponse);

  // Unfreeze wallet.
  rpc UnfreezeWallet (UnfreezeWalletRequest) returns (WalletResponse);

  // ─── PAYMENT METHODS (3 RPCs) ───

  // Add tokenized card/Nequi via Wompi.
  rpc AddPaymentMethod (AddPaymentMethodRequest) returns (PaymentMethodResponse);

  // List active payment methods for a client.
  rpc GetPaymentMethods (GetPaymentMethodsRequest) returns (PaymentMethodsResponse);

  // Soft-delete a payment method.
  rpc RemovePaymentMethod (RemovePaymentMethodRequest) returns (PaymentMethodResponse);

  // ─── PAYOUTS (2 RPCs) ───

  // Vet requests payout. Calculates earnings and transfers via Wompi.
  rpc RequestPayout (RequestPayoutRequest) returns (PayoutResponse);

  // Get payout history for a vet with pagination.
  rpc GetPayoutHistory (GetPayoutHistoryRequest) returns (PayoutHistoryResponse);

  // ─── BANK ACCOUNTS & EARNINGS (3 RPCs) ───

  // Register vet bank account (encrypted AES-256-GCM).
  rpc AddBankAccount (AddBankAccountRequest) returns (BankAccountResponse);

  // List vet bank accounts.
  rpc GetBankAccounts (GetBankAccountsRequest) returns (BankAccountsResponse);

  // Get vet earnings summary by period.
  rpc GetVetEarnings (GetVetEarningsRequest) returns (VetEarningsResponse);

  // El dinero del veterinario que está RETENIDO, con el pago concreto que lo
  // retiene. `GetVetEarnings` da el total (`pending_payout`) y con un total no
  // se puede abrir un expediente: `vet.earnings_blocked` identifica su caso por
  // `payment_id`, porque el vet cobra EN LA CAPTURA y es esa captura la que
  // falló.
  //
  // No devuelve nada del cliente —ni el total que pagó, ni su medio de pago, ni
  // el estado de la pasarela—: el expediente es del vet.
  rpc GetVetBlockedEarnings (GetVetBlockedEarningsRequest) returns (VetBlockedEarningsResponse);

  // Get client spending history by period (S2-11).
  rpc GetClientSpendingHistory (GetClientSpendingHistoryRequest) returns (ClientSpendingHistoryResponse);

  // ─── DISPUTES (FASE 3) ───

  // Client opens a dispute for a completed appointment.
  rpc OpenDispute (OpenDisputeRequest) returns (DisputeResponse);

  // Admin resolves a dispute (refund or keep payment).
  rpc ResolveDispute (ResolveDisputeRequest) returns (DisputeResponse);

  // Get dispute by ID.
  rpc GetDispute (GetDisputeRequest) returns (DisputeResponse);

  // List disputes (admin/client).
  rpc ListDisputes (ListDisputesRequest) returns (ListDisputesResponse);

  // ─── PROMOTIONS (FASE 3 — disabled until PROMOTIONS_ENABLED=true) ───

  // Validate and return discount for a promo code (does not apply it yet).
  rpc ValidatePromoCode (ValidatePromoCodeRequest) returns (ValidatePromoCodeResponse);

  // Get vet commission tier based on completed appointment count.
  rpc GetVetCommissionTier (GetVetCommissionTierRequest) returns (GetVetCommissionTierResponse);

  // ─── RECONCILIATION (P4) ───

  // Get reconciliation report for a specific date.
  rpc GetReconciliationReport (GetReconciliationReportRequest) returns (ReconciliationReportResponse);

  // List reconciliation reports (paginated).
  rpc ListReconciliationReports (ListReconciliationReportsRequest) returns (ListReconciliationReportsResponse);

  // Manually trigger reconciliation for a specific date.
  rpc TriggerReconciliation (TriggerReconciliationRequest) returns (ReconciliationReportResponse);

  // ─── ADMIN REPORTS ───

  // Income report by period (global, by vet, by service).
  rpc AdminReportIncome (AdminReportIncomeRequest) returns (AdminReportIncomeResponse);

  // Top vets by earnings in period.
  rpc AdminTopVetsByIncome (AdminTopVetsByIncomeRequest) returns (AdminTopVetsByIncomeResponse);

  // Dispute stats: total payments, total disputes, dispute rate.
  rpc AdminDisputeStats (AdminDisputeStatsRequest) returns (AdminDisputeStatsResponse);

  // Commission summary grouped by tier (Bronze/Silver/Gold/Platinum).
  rpc AdminCommissionByTier (AdminCommissionByTierRequest) returns (AdminCommissionByTierResponse);
}

// ═══════════════════════════════════════════════════════════════════════════
// ENUMS
// ═══════════════════════════════════════════════════════════════════════════

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_AUTHORIZED = 2;
  PAYMENT_STATUS_CAPTURED = 3;
  PAYMENT_STATUS_PARTIALLY_REFUNDED = 4;
  PAYMENT_STATUS_REFUNDED = 5;
  PAYMENT_STATUS_FAILED = 6;
  PAYMENT_STATUS_VOIDED = 7;
  // Capture was attempted but failed (Wompi down/timeout) — retries in progress
  PAYMENT_STATUS_CAPTURE_FAILED = 8;
}

enum PaymentGateway {
  PAYMENT_GATEWAY_UNSPECIFIED = 0;
  PAYMENT_GATEWAY_WOMPI = 1;
  PAYMENT_GATEWAY_WALLET_ONLY = 2;
}

enum WalletOwnerType {
  WALLET_OWNER_TYPE_UNSPECIFIED = 0;
  WALLET_OWNER_TYPE_CLIENT = 1;
  WALLET_OWNER_TYPE_VET = 2;
}

enum WalletTransactionType {
  WALLET_TRANSACTION_TYPE_UNSPECIFIED = 0;
  WALLET_TRANSACTION_TYPE_CREDIT = 1;
  WALLET_TRANSACTION_TYPE_DEBIT = 2;
  WALLET_TRANSACTION_TYPE_HOLD = 3;
  WALLET_TRANSACTION_TYPE_RELEASE = 4;
}

enum WalletTransactionReason {
  WALLET_TRANSACTION_REASON_UNSPECIFIED = 0;
  WALLET_TRANSACTION_REASON_PAYMENT = 1;
  WALLET_TRANSACTION_REASON_REFUND = 2;
  WALLET_TRANSACTION_REASON_REFUND_TO_WALLET = 3;
  WALLET_TRANSACTION_REASON_TIP = 4;
  WALLET_TRANSACTION_REASON_REFERRAL_BONUS = 5;
  WALLET_TRANSACTION_REASON_PROMO_CREDIT = 6;
  WALLET_TRANSACTION_REASON_FIRST_CONSULT_BONUS = 7;
  WALLET_TRANSACTION_REASON_COMPENSATION = 8;
  WALLET_TRANSACTION_REASON_NO_SHOW_FEE = 9;
  WALLET_TRANSACTION_REASON_PAYOUT = 10;
  WALLET_TRANSACTION_REASON_ADMIN_ADJUSTMENT = 11;
  WALLET_TRANSACTION_REASON_HOLD_FOR_PAYMENT = 12;
  WALLET_TRANSACTION_REASON_RELEASE_HOLD = 13;
  WALLET_TRANSACTION_REASON_VET_CANCELLATION_FEE = 14;
  WALLET_TRANSACTION_REASON_CHARGEBACK_REVERSAL = 15;
  WALLET_TRANSACTION_REASON_PAYOUT_REVERSAL = 16;
  WALLET_TRANSACTION_REASON_COMPENSATION_REVERSAL = 17;
}

enum WalletReferenceType {
  WALLET_REFERENCE_TYPE_UNSPECIFIED = 0;
  WALLET_REFERENCE_TYPE_PAYMENT = 1;
  WALLET_REFERENCE_TYPE_APPOINTMENT = 2;
  WALLET_REFERENCE_TYPE_PAYOUT = 3;
  WALLET_REFERENCE_TYPE_PROMO = 4;
  WALLET_REFERENCE_TYPE_REFUND = 5;

  // Un movimiento cuya causa es un expediente de Constancia. Sin esto, la
  // devolución de una penalidad al veterinario se guardaba con referencia
  // vacía y no había forma de atarla a la reparación que la ordenó.
  WALLET_REFERENCE_TYPE_CASE = 6;
}

enum PaymentMethodType {
  PAYMENT_METHOD_TYPE_UNSPECIFIED = 0;
  PAYMENT_METHOD_TYPE_CARD = 1;
  PAYMENT_METHOD_TYPE_NEQUI = 2;
}

enum CardBrand {
  CARD_BRAND_UNSPECIFIED = 0;
  CARD_BRAND_VISA = 1;
  CARD_BRAND_MASTERCARD = 2;
  CARD_BRAND_AMEX = 3;
  CARD_BRAND_OTHER = 4;
}

enum BankAccountType {
  BANK_ACCOUNT_TYPE_UNSPECIFIED = 0;
  BANK_ACCOUNT_TYPE_SAVINGS = 1;
  BANK_ACCOUNT_TYPE_CHECKING = 2;
