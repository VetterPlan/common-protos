// ═══════════════════════════════════════════════════════════════════════════
// P4 — RECONCILIATION
// ═══════════════════════════════════════════════════════════════════════════

message GetReconciliationReportRequest {
  string date = 1;  // ISO 8601 date "YYYY-MM-DD"
}

message TriggerReconciliationRequest {
  string date = 1;  // ISO 8601 date to reconcile
}

message ListReconciliationReportsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ReconciliationDiscrepancyProto {
  string type = 1;              // STATUS_MISMATCH | AMOUNT_MISMATCH | MISSING_LOCAL | MISSING_WOMPI
  string payment_id = 2;
  string appointment_id = 3;
  string local_status = 4;
  string wompi_status = 5;
  double local_amount = 6;
  double wompi_amount = 7;
  string severity = 8;          // LOW | MEDIUM | HIGH | CRITICAL
  bool auto_resolved = 9;
  string resolution_action = 10;
}

message ReconciliationReportResponse {
  string date = 1;
  int32 total_checked = 2;
  int32 total_discrepancies = 3;
  int32 auto_resolved_count = 4;
  int32 manual_review_count = 5;
  double gmv_cop = 6;
  double platform_revenue_cop = 7;
  repeated ReconciliationDiscrepancyProto items = 8;

  // B-5 — los dos lados de la comparacion del dia, sumados.
  //
  // `local_total_cop` NO es `gmv_cop`: el GMV incluye lo cobrado sin pasar por
  // la pasarela (saldo de wallet), y eso Wompi no lo ha visto nunca. Comparar
  // el GMV contra Wompi acusaria una diferencia que no es una discrepancia.
  // Este suma solo los pagos capturados que llevan `gateway_transaction_id`,
  // que es exactamente el conjunto que se conteo contra la pasarela.
  //
  // Los tres son `optional` porque un informe anterior a esta version no los
  // tiene, y un cero afirmaria "ese dia no se movio dinero".
  optional double wompi_total_cop = 9;
  optional double local_total_cop = 10;

  // Falso = la consulta a Wompi se corto a medias (error de la API o de red) y
  // el lado de la pasarela esta INCOMPLETO. El total sigue viajando porque es
  // lo que se leyo, pero no se puede restar contra el local ni presentar como
  // "cuadra": la ausencia de una transaccion no es prueba de que no exista.
  // Ausente = informe anterior a esta version, donde no se registro.
  optional bool wompi_query_complete = 11;
}

message ListReconciliationReportsResponse {
  repeated ReconciliationReportResponse reports = 1;
  int32 total = 2;
}
