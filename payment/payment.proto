  int32 platform_fee_percent = 2;
  int32 completed_appointments = 3;
  int32 next_tier_threshold = 4; // 0 if already at top tier
}

message GetCommissionTiersByVetsRequest {
  repeated string vet_profile_ids = 1;   // techo de 100
}

message VetCommissionTierSummary {
  string vet_profile_id = 1;
  string tier = 2;
  int32 platform_fee_percent = 3;

  // Pagos CAPTURADOS, que es lo que de verdad cuenta el escalón de volumen. El
  // unario lo llama `completed_appointments` y cuenta lo mismo; el nombre de
  // allá está mal y no se repite acá.
  int32 captured_payments = 4;

  // De dónde salió el tier de esta fila: "last_known" (la última decisión de
  // calidad persistida) o "volume" (el escalón por número de pagos). Nunca
  // "quality": este RPC no consulta a rating.
  string source = 5;
}

message GetCommissionTiersByVetsResponse {
  repeated VetCommissionTierSummary tiers = 1;
}

