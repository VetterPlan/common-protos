syntax = "proto3";

package profile;

import "google/protobuf/timestamp.proto";

service VaccineFridgeService {
  rpc GetVaccineFridge (GetVaccineFridgeRequest) returns (VaccineFridge);
  rpc SignVaccinationDeclaration (SignVaccinationDeclarationRequest) returns (VaccineFridge);
  rpc SetVaccineOffer (SetVaccineOfferRequest) returns (VaccineFridge);
  rpc RemoveVaccineOffer (RemoveVaccineOfferRequest) returns (VaccineFridge);
  rpc GetVaccineOffersOfVets (GetVaccineOffersOfVetsRequest) returns (GetVaccineOffersOfVetsResponse);
  rpc GetVaccinationRequirements (GetVaccinationRequirementsRequest) returns (VaccinationRequirements);
  rpc OpenVaccineFridge (OpenVaccineFridgeRequest) returns (VaccineFridge);
}

message VaccineType {
  string key = 1;
  string label = 2;
  string protects_against = 3;
  bool for_dogs = 4;
  bool for_cats = 5;
}

message VaccineOffer {
  string vaccine_type = 1;
  string label = 2;
  string price = 3;
  bool paused = 4;
  bool atypical = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message VaccineFridge {
  string vet_profile_id = 1;
  bool declaration_signed = 2;
  google.protobuf.Timestamp declaration_signed_at = 3;
  string declaration_version = 4;
  repeated VaccineOffer offers = 5;
  repeated VaccineType catalog = 6;
  string current_declaration_version = 7;
  string visit_price = 8;
  bool opened = 9;
  google.protobuf.Timestamp opened_at = 10;
  bool active = 11;
}

message GetVaccineFridgeRequest {
  string vet_profile_id = 1;
}

message SignVaccinationDeclarationRequest {
  string vet_profile_id = 1;
  string declaration_version = 2;
  bool lawful_supplier = 3;
  bool cold_chain = 4;
}

message SetVaccineOfferRequest {
  string vet_profile_id = 1;
  string vaccine_type = 2;
  string price = 3;
  bool paused = 4;
}

message RemoveVaccineOfferRequest {
  string vet_profile_id = 1;
  string vaccine_type = 2;
}

message GetVaccineOffersOfVetsRequest {
  repeated string vet_profile_ids = 1;
  repeated string vaccine_types = 2;
}

message VetVaccineOffers {
  string vet_profile_id = 1;
  repeated VaccineOffer offers = 2;
}

message GetVaccineOffersOfVetsResponse {
  repeated VetVaccineOffers vets = 1;
}

message GetVaccinationRequirementsRequest {
  string vet_profile_id = 1;
}

message VaccinationRequirement {
  string key = 1;
  bool met = 2;
  string detail = 3;
}

message VaccinationRequirements {
  string vet_profile_id = 1;
  repeated VaccinationRequirement requirements = 2;
  bool all_met = 3;
  bool tax_profile_declared = 4;
  bool iva_responsible = 5;
}

message VaccinePrice {
  string vaccine_type = 1;
  string price = 2;
}

message OpenVaccineFridgeRequest {
  string vet_profile_id = 1;
  string visit_price = 2;
  repeated VaccinePrice offers = 3;
}
