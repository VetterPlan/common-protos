syntax = "proto3";

package profile;

import "google/protobuf/timestamp.proto";

// ============================================================================
// VET PROFILE SERVICE
// ============================================================================

service VetProfileService {
  rpc CreateVetProfile (CreateVetProfileRequest) returns (VetProfileResponse);
  rpc GetVetProfile (GetVetProfileRequest) returns (VetProfileResponse);
  rpc UpdateVetProfile (UpdateVetProfileRequest) returns (VetProfileResponse);
  rpc DeleteVetProfile (DeleteVetProfileRequest) returns (DeleteVetProfileResponse);
  rpc UpdateVetProfileStatus (UpdateVetProfileStatusRequest) returns (VetProfileResponse);

  // ─── Vet Service Pricing ───
  rpc SetServicePrice (SetServicePriceRequest) returns (ServicePriceResponse);
  rpc GetVetServicePrices (GetVetServicePricesRequest) returns (VetServicePricesResponse);
  rpc GetVetPriceForService (GetVetPriceForServiceRequest) returns (ServicePriceResponse);
  rpc RemoveServicePrice (RemoveServicePriceRequest) returns (RemoveServicePriceResponse);
  rpc GetVetsByService (GetVetsByServiceRequest) returns (VetsByServiceResponse);
  rpc GetServiceTypePriceRanges (GetServiceTypePriceRangesRequest) returns (ServiceTypePriceRangesResponse);

  // ─── Working Hours ───
  rpc SetWorkingHours (SetWorkingHoursRequest) returns (WorkingHoursResponse);
  rpc SetBulkWorkingHours (SetBulkWorkingHoursRequest) returns (BulkWorkingHoursResponse);
  rpc GetWorkingHours (GetWorkingHoursRequest) returns (BulkWorkingHoursResponse);
  rpc RemoveWorkingDay (RemoveWorkingDayRequest) returns (RemoveWorkingDayResponse);

  // ─── Time Off ───
  rpc AddTimeOff (AddTimeOffRequest) returns (TimeOffResponse);
  rpc GetTimeOff (GetTimeOffRequest) returns (TimeOffListResponse);
  rpc RemoveTimeOff (RemoveTimeOffRequest) returns (RemoveTimeOffResponse);

  // ─── Availability Check (inter-service, called by Appointment Service) ───
  rpc CheckVetAvailability (CheckVetAvailabilityRequest) returns (CheckVetAvailabilityResponse);
  rpc CheckBulkVetAvailability (CheckBulkVetAvailabilityRequest) returns (BulkVetAvailabilityResponse);
  rpc GetVetAvailableSlots (GetVetAvailableSlotsRequest) returns (VetAvailableSlotsResponse);

  // ─── Cancellation Strikes (inter-service, called by Appointment Service) ───
  // Deprecado por E1-A8 F-2: un incremento no se puede reintentar sin saber si
  // se aplicó. Usa SetCancellationStrikes, que escribe un valor absoluto.
  // No se elimina: protobuf solo admite cambios aditivos.
  rpc IncrementCancellationStrike (IncrementCancellationStrikeRequest) returns (IncrementCancellationStrikeResponse) {
    option deprecated = true;
  }
  rpc SetCancellationStrikes (SetCancellationStrikesRequest) returns (SetCancellationStrikesResponse);

  // ─── Rating (S2-4) — called by Appointment Service on SubmitReview ───
  rpc UpdateVetRating (UpdateVetRatingRequest) returns (UpdateVetRatingResponse);

  rpc SetVetRating (SetVetRatingRequest) returns (UpdateVetRatingResponse);

  // ─── Admin: list all vet profiles ───
  // A1.3 — lote con autorizacion POR ELEMENTO y proyeccion POR NIVEL. Un mismo
  // lote puede producir OWNER, ADMIN, PUBLIC y NONE a la vez.
  rpc GetVetProfilesByIds (GetVetProfilesByIdsRequest) returns (GetVetProfilesByIdsResponse);

  rpc ListVetProfiles (ListVetProfilesRequest) returns (ListVetProfilesResponse);

  // ─── Avatar Upload ───
  // Generate a presigned URL for direct avatar upload to R2 storage
  rpc GenerateAvatarUploadUrl (GenerateVetAvatarUploadUrlRequest) returns (GenerateVetAvatarUploadUrlResponse);
}

// ============================================================================
// ENUMS
// ============================================================================

enum VetProfileStatus {
  VET_PROFILE_STATUS_UNSPECIFIED = 0;
  INCOMPLETE = 1;                 // Missing required information
  PENDING_VERIFICATION = 2;       // Ready for admin review
  ACTIVE = 3;                     // Verified and can practice
  SUSPENDED = 4;                  // Temporarily disabled
}

// ============================================================================
// MESSAGES
// ============================================================================

message VetProfile {
  string id = 1;
  string user_id = 2;
  
  // Basic Information
  string first_name = 3;
  string last_name = 4;
  string avatar_url = 5;
  
  // Professional Information
  string professional_title = 7;  // e.g., "DVM", "VMD"
  string bio = 8;
  string years_of_experience = 9;
  
  // Practice Information
  string clinic_name = 10;
  string clinic_phone = 11;
  string clinic_email = 12;
  
  // Specialties (declared by vet, NOT certified)
  // Certified specialties are in vet-certification-service
  repeated string declared_specialties = 13;
  
  // Languages spoken (ISO 639-1 codes)
  repeated string languages = 14;
  
  // Availability settings (JSON string)
  string availability_settings = 15;
  
  // Localization
  string locale = 16;
  
  // Status (profile completion, NOT certification)
  VetProfileStatus status = 18;
  
  // Completion status
  bool is_completed = 19;
  
  // Timestamps
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;

  // Cancellation strikes (no-show / late cancellations)
  int32 cancellation_strikes = 22;

  // Denormalized rating (S2-4) — updated by appointment-service on SubmitReview
  double rating = 23;           // Rolling average 1-5
  int32 review_count = 24;

  // Location (for on-demand matching, distance ranking, ETA)
  double latitude = 25;         // 0.0 if not set
  double longitude = 26;        // 0.0 if not set
  string address = 27;          // Full address text
  string city = 28;
  string country_code = 29;     // ISO 3166-1 alpha-2
}

message CreateVetProfileRequest {
  string user_id = 1;  // Required: user from auth-service

  // Optional initial data
  optional string first_name = 2;
  optional string last_name = 3;
  optional string professional_title = 5;
  optional string clinic_name = 6;
  optional string locale = 7;
}

message GetVetProfileRequest {
  oneof identifier {
    string user_id = 1;
    string profile_id = 2;
  }
}

message UpdateVetProfileRequest {
  string user_id = 1;  // Required: identifies which profile to update

  // All fields optional - only provided fields will be updated
  optional string first_name = 2;
  optional string last_name = 3;
  optional string avatar_url = 4;
  optional string professional_title = 6;
  optional string bio = 7;
  optional string years_of_experience = 8;
  optional string clinic_name = 9;
  optional string clinic_phone = 10;
  optional string clinic_email = 11;
  repeated string declared_specialties = 12;  // Replaces existing list
  repeated string languages = 13;  // Replaces existing list
  optional string availability_settings = 14;  // JSON string
  optional string locale = 15;
  optional double latitude = 16;
  optional double longitude = 17;
  optional string address = 18;
  optional string city = 19;
  optional string country_code = 20;  // ISO 3166-1 alpha-2
}

message UpdateVetProfileStatusRequest {
  string user_id = 1;
  VetProfileStatus status = 2;
  optional string reason = 3;  // For audit trail
}

message DeleteVetProfileRequest {
  string user_id = 1;
}

message VetProfileResponse {
  VetProfile profile = 1;
}

message DeleteVetProfileResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// VET SERVICE PRICING
// ============================================================================

enum VetServiceType {
  VET_SERVICE_TYPE_UNSPECIFIED = 0;
  VET_SERVICE_TYPE_CONSULTATION = 1;
  VET_SERVICE_TYPE_VACCINATION = 2;
  VET_SERVICE_TYPE_DEWORMING = 3;
  VET_SERVICE_TYPE_FOLLOW_UP = 4;
  VET_SERVICE_TYPE_MEDICAL_CERTIFICATE = 5;
  VET_SERVICE_TYPE_ULTRASOUND = 6;
  VET_SERVICE_TYPE_ELECTROCARDIOGRAM = 7;
}

message ServicePrice {
  string id = 1;
  string vet_profile_id = 2;
  VetServiceType service_type = 3;
  double price = 4;
  bool is_active = 5;
  string notes = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SetServicePriceRequest {
  string vet_profile_id = 1;
  VetServiceType service_type = 2;
  double price = 3;
  string notes = 4;
}

message ServicePriceResponse {
  ServicePrice price = 1;
}

message GetVetServicePricesRequest {
  string vet_profile_id = 1;
}

message VetServicePricesResponse {
  repeated ServicePrice prices = 1;
}

message GetVetPriceForServiceRequest {
  string vet_profile_id = 1;
  VetServiceType service_type = 2;
}

message RemoveServicePriceRequest {
  string vet_profile_id = 1;
  VetServiceType service_type = 2;
}

message RemoveServicePriceResponse {
  bool success = 1;
  string message = 2;
}

message GetVetsByServiceRequest {
  VetServiceType service_type = 1;

  // Caja envolvente opcional. Sin ella la respuesta trae todos los vets activos
  // del pais que ofrecen el servicio: con 800 son 196 KB por busqueda, y el
  // coste no es el cable sino serializar 800 mensajes aqui y parsearlos alla.
  //
  // Solo aditivo: un cliente que no la mande recibe exactamente lo que recibia
  // antes. Los cuatro campos van juntos o no van — tres de cuatro se ignora,
  // porque una caja a medias filtraria por un lado y no por el otro.
  //
  // Es un prefiltro barato, no la decision: quien decide el radio sigue siendo
  // appointment-service con su haversine. La caja es un cuadrado y el radio un
  // circulo, asi que la caja deja pasar de mas y nunca de menos.
  optional double min_lat = 2;
  optional double max_lat = 3;
  optional double min_lng = 4;
  optional double max_lng = 5;
}

message VetByService {
  string vet_profile_id = 1;
  double price = 2;
  string notes = 3;
  string display_name = 4;
  double lat = 5;              // From vet_profile.latitude (0.0 if not set)
  double lng = 6;              // From vet_profile.longitude (0.0 if not set)
  string avatar_url = 7;
  double rating = 8;
  int32 review_count = 9;
  repeated string specialties = 10;
}

message VetsByServiceResponse {
  repeated VetByService vets = 1;
  int32 total_count = 2;
}

message GetServiceTypePriceRangesRequest {
  // Empty — returns all service types that have active vets
}

message ServiceTypePriceRange {
  string service_type = 1;       // "consultation", "vaccination", etc.
  double min_price = 2;          // Lowest price across active vets (COP)
  double max_price = 3;          // Highest price across active vets (COP)
  int32 vet_count = 4;           // Number of active vets offering this service
}

message ServiceTypePriceRangesResponse {
  repeated ServiceTypePriceRange ranges = 1;
  int32 total_service_types = 2;
}

// ============================================================================
// WORKING HOURS
// ============================================================================

message WorkingHoursEntry {
  string id = 1;
  string vet_profile_id = 2;
  int32 day_of_week = 3;        // 0=Monday, 6=Sunday
  string start_time = 4;        // "08:00"
  string end_time = 5;          // "18:00"
  bool is_active = 6;
}

message SetWorkingHoursRequest {
  string vet_profile_id = 1;
  int32 day_of_week = 2;
  string start_time = 3;        // "08:00"
  string end_time = 4;          // "18:00"
}

message WorkingHoursResponse {
  bool success = 1;
  WorkingHoursEntry working_hours = 2;
  string error = 3;
}

message SetBulkWorkingHoursRequest {
  string vet_profile_id = 1;
  repeated SetWorkingHoursEntry entries = 2;
}

message SetWorkingHoursEntry {
  int32 day_of_week = 1;
  string start_time = 2;
  string end_time = 3;
}

message BulkWorkingHoursResponse {
  bool success = 1;
  repeated WorkingHoursEntry working_hours = 2;
  string error = 3;
}

message GetWorkingHoursRequest {
  repeated string vet_profile_ids = 1;  // 1 or N vets; response entries include vet_profile_id
  bool active_only = 2;                 // default true
}

message RemoveWorkingDayRequest {
  string vet_profile_id = 1;
  int32 day_of_week = 2;
}

message RemoveWorkingDayResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================================
// TIME OFF
// ============================================================================

message TimeOffEntry {
  string id = 1;
  string vet_profile_id = 2;
  string start_datetime = 3;    // ISO 8601 UTC
  string end_datetime = 4;      // ISO 8601 UTC
  string reason = 5;
  string created_at = 6;
}

message AddTimeOffRequest {
  string vet_profile_id = 1;
  string start_datetime = 2;    // ISO 8601 UTC
  string end_datetime = 3;      // ISO 8601 UTC
  string reason = 4;
}

message TimeOffResponse {
  bool success = 1;
  TimeOffEntry time_off = 2;
  string error = 3;
}

message GetTimeOffRequest {
  string vet_profile_id = 1;
  bool upcoming_only = 2;       // default true
}

message TimeOffListResponse {
  repeated TimeOffEntry time_off = 1;
  int32 total_count = 2;
}

message RemoveTimeOffRequest {
  string vet_profile_id = 1;
  string time_off_id = 2;
}

message RemoveTimeOffResponse {
  bool success = 1;
  string error = 2;
}

// ============================================================================
// AVAILABILITY CHECK (inter-service)
// ============================================================================

message CheckVetAvailabilityRequest {
  string vet_profile_id = 1;
  string check_start = 2;       // ISO 8601 UTC — start of window to verify
  string check_end = 3;         // ISO 8601 UTC — end of window to verify
}

message CheckVetAvailabilityResponse {
  bool is_available = 1;        // true if within working_hours AND no time_off
  string unavailable_reason = 2; // "OUTSIDE_WORKING_HOURS" / "TIME_OFF" / ""
}

message GetVetAvailableSlotsRequest {
  string vet_profile_id = 1;
  string date = 2;              // "2026-02-15" — date to get slots for
}

message VetAvailableSlotsResponse {
  repeated TimeSlot available_slots = 1;
  string date = 2;
  string vet_profile_id = 3;
}

message TimeSlot {
  string start_time = 1;        // "08:00"
  string end_time = 2;          // "12:00"
}

// ============================================================================
// AVATAR UPLOAD
// ============================================================================

message GenerateVetAvatarUploadUrlRequest {
  string file_extension = 1;    // e.g., "jpg", "png", "webp"
  string content_type = 2;      // e.g., "image/jpeg", "image/png"
}

message GenerateVetAvatarUploadUrlResponse {
  string upload_url = 1;        // Presigned PUT URL for direct upload to R2
  string file_url = 2;          // Public CDN URL (to save in avatar_url after upload)
}

// ============================================================================
// BULK AVAILABILITY CHECK (P1.9 — replaces N+1 CheckVetAvailability loop)
// ============================================================================

message CheckBulkVetAvailabilityRequest {
  repeated string vet_profile_ids = 1;
  string check_start = 2;       // ISO 8601 UTC
  string check_end = 3;         // ISO 8601 UTC
}

message VetAvailabilityResult {
  string vet_profile_id = 1;
  bool is_available = 2;
  string unavailable_reason = 3;  // "" | "OUTSIDE_WORKING_HOURS" | "TIME_OFF"
}

message BulkVetAvailabilityResponse {
  repeated VetAvailabilityResult results = 1;
}

// ============================================================================
// CANCELLATION STRIKES (P1.8 — vet cancellation fee system)
// ============================================================================

message IncrementCancellationStrikeRequest {
  string vet_profile_id = 1;
}

message IncrementCancellationStrikeResponse {
  int32 strike_count = 1;         // Total strikes active (within 30-day window)
  bool suspended = 2;             // True if vet was suspended (3+ strikes)
}

// El conteo lo hace appointment-service desde appointment_status_history, que
// es donde el hecho ya está escrito una sola vez por viaje. Profile almacena el
// resultado: reintentar escribe el mismo número, así que la entrega no necesita
// saber si la anterior llegó.
message SetCancellationStrikesRequest {
  string vet_profile_id = 1;
  int32 cancellation_strikes = 2;   // valor ABSOLUTO, nunca un delta
}

message SetCancellationStrikesResponse {
  int32 strike_count = 1;
  bool suspended = 2;               // la suspensión es trinquete: bajar no reactiva
}

// ============================================================================
// RATING (S2-4 — denormalized from reviews, called by Appointment Service)
// ============================================================================

message UpdateVetRatingRequest {
  string vet_profile_id = 1;
  double new_rating = 2;          // 1-5 from this review; profile computes rolling average
}

message SetVetRatingRequest {
  string vet_profile_id = 1;
  double average_rating = 2;
  int32 review_count = 3;
}

message UpdateVetRatingResponse {
  double average_rating = 1;
  int32 review_count = 2;
}

// ============================================================================
// ADMIN LIST
// ============================================================================

message GetVetProfilesByIdsRequest {
  repeated string vet_profile_ids = 1;   // techo de 100
}

message GetVetProfilesByIdsResponse {
  // SOLO los autorizados, cada uno con la proyeccion de SU nivel
  // (OWNER / ADMIN / PUBLIC). La ausencia no distingue inexistente de prohibido.
  repeated VetProfile profiles = 1;
}

message ListVetProfilesRequest {
  optional int32 limit = 1;          // default 50, max 200
  optional int32 offset = 2;         // for pagination
  optional string status_filter = 3; // "active", "pending_verification", "suspended", "incomplete" — empty = all
}

message ListVetProfilesResponse {
  repeated VetProfile profiles = 1;
  int32 total_count = 2;
}
