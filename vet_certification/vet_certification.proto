syntax = "proto3";

package vet_certification;

import "google/protobuf/timestamp.proto";

// ═══════════════════════════════════════════════════════════════════════════
// VET CERTIFICATION SERVICE
//
// Manages veterinary professional certifications and authorization to practice.
// This service is the single source of truth for determining if a veterinarian
// can legally practice in a given jurisdiction.
// ═══════════════════════════════════════════════════════════════════════════

service VetCertificationService {
  // ─── CERTIFICATION LIFECYCLE ───

  rpc SubmitCertification (SubmitCertificationRequest) returns (CertificationResponse);
  rpc GetCertification (GetCertificationRequest) returns (CertificationResponse);
  rpc GetCertificationsByVetProfile (GetCertificationsByVetProfileRequest) returns (CertificationsResponse);

  // ─── PRACTICE VALIDATION ───

  rpc ValidateCanPractice (ValidateCanPracticeRequest) returns (ValidateCanPracticeResponse);
  rpc GetActiveCertification (GetActiveCertificationRequest) returns (CertificationResponse);

  // ─── STATUS HISTORY ───

  rpc GetStatusHistory (GetStatusHistoryRequest) returns (StatusHistoryResponse);

  // ─── ADMIN ACTIONS ───

  rpc ReviewCertification (ReviewCertificationRequest) returns (CertificationResponse);
  rpc ListCertificationsForReview (ListCertificationsForReviewRequest) returns (ListCertificationsForReviewResponse);
  rpc HardDeleteVetCertifications (HardDeleteVetCertificationsRequest) returns (HardDeleteVetCertificationsResponse);

  // ─── SUPPORTING DOCUMENTS (private R2) ───

  rpc GenerateCertificationDocumentUploadUrl (GenerateCertificationDocumentUploadUrlRequest) returns (GenerateCertificationDocumentUploadUrlResponse);
  rpc AddCertificationDocument (AddCertificationDocumentRequest) returns (CertificationDocumentResponse);
  rpc GetCertificationDocuments (GetCertificationDocumentsRequest) returns (CertificationDocumentsResponse);
  rpc VerifyCertificationDocument (VerifyCertificationDocumentRequest) returns (CertificationDocumentResponse);
  rpc RemoveCertificationDocument (RemoveCertificationDocumentRequest) returns (RemoveCertificationDocumentResponse);

  // ─── ACADEMIC CREDENTIALS ───

  rpc SubmitAcademicCredential (SubmitAcademicCredentialRequest) returns (AcademicCredentialResponse);
  rpc GenerateAcademicDocumentUploadUrl (GenerateAcademicDocumentUploadUrlRequest) returns (GenerateAcademicDocumentUploadUrlResponse);
  rpc GetAcademicCredentials (GetAcademicCredentialsRequest) returns (AcademicCredentialsResponse);
  rpc ReviewAcademicCredential (ReviewAcademicCredentialRequest) returns (AcademicCredentialResponse);
  rpc GetVetPublicCredentials (GetVetPublicCredentialsRequest) returns (GetVetPublicCredentialsResponse);
  rpc GetCertificationRequirements (GetCertificationRequirementsRequest) returns (GetCertificationRequirementsResponse);
}

enum AcademicDegree {
  ACADEMIC_DEGREE_UNSPECIFIED    = 0;
  ACADEMIC_DEGREE_PREGRADO       = 1;
  ACADEMIC_DEGREE_ESPECIALIZACION = 2;
  ACADEMIC_DEGREE_MAESTRIA       = 3;
  ACADEMIC_DEGREE_DOCTORADO      = 4;
  ACADEMIC_DEGREE_DIPLOMADO      = 5;
}

enum AcademicStatus {
  ACADEMIC_STATUS_UNSPECIFIED = 0;
  ACADEMIC_STATUS_PENDING     = 1;
  ACADEMIC_STATUS_VERIFIED    = 2;
  ACADEMIC_STATUS_REJECTED    = 3;
  ACADEMIC_STATUS_REVOKED     = 4;
}

enum VerificationMethod {
  VERIFICATION_METHOD_UNSPECIFIED           = 0;
  VERIFICATION_METHOD_DOCUMENT              = 1;
  VERIFICATION_METHOD_INSTITUTIONAL_REGISTRY = 2;
  VERIFICATION_METHOD_CONVALIDATION         = 3;
}

message AcademicCredential {
  string id = 1;
  string vet_profile_id = 2;
  AcademicDegree degree = 3;
  string title = 4;
  string institution = 5;
  string country = 6;
  int32 year = 7;
  AcademicStatus status = 8;
  VerificationMethod verification_method = 9;
  string rejection_reason = 10;
  google.protobuf.Timestamp verified_at = 11;
  google.protobuf.Timestamp created_at = 12;
}

message SubmitAcademicCredentialRequest {
  string vet_profile_id = 1;
  AcademicDegree degree = 2;
  string title = 3;
  string institution = 4;
  string country = 5;
  int32 year = 6;
  string object_key = 7;
  string original_filename = 8;
  string mime_type = 9;
}

message AcademicCredentialResponse {
  AcademicCredential credential = 1;
}

message GenerateAcademicDocumentUploadUrlRequest {
  string vet_profile_id = 1;
  string file_extension = 2;
  string content_type = 3;
}

message GenerateAcademicDocumentUploadUrlResponse {
  string upload_url = 1;
  string object_key = 2;
  int32 expires_in_seconds = 3;
}

message GetAcademicCredentialsRequest {
  string vet_profile_id = 1;
  bool only_pending = 2;
}

message AcademicCredentialsResponse {
  repeated AcademicCredential credentials = 1;
  int32 total_count = 2;
}

message ReviewAcademicCredentialRequest {
  string credential_id = 1;
  AcademicStatus new_status = 2;
  VerificationMethod verification_method = 3;
  string reviewed_by = 4;
  string rejection_reason = 5;
}

message PublicCredential {
  AcademicDegree degree = 1;
  string title = 2;
  string institution = 3;
  int32 year = 4;
}

message PublicLicense {
  string license_number = 1;
  string issuing_authority = 2;
  LicenseType license_type = 3;
  PracticeScope scope = 4;
  repeated string species_allowed = 5;
  string valid_until = 6;
}

message GetCertificationRequirementsRequest {
  // Vacio = la jurisdiccion por defecto del despliegue.
  string country = 1;
}

message LicenseFormat {
  string label = 1;        // "Matricula profesional"
  string pattern = 2;      // regex completo, sin anclas
  string requirement = 3;  // "3 a 10 digitos"
  string example = 4;      // "635"
}

message CertificationRequirements {
  string country = 1;
  string country_name = 2;
  LicenseFormat license = 3;
  string authority_name = 4;
  string authority_short = 5;
  bool license_expires = 6;
  repeated DocumentType required_documents = 7;
  repeated DocumentType optional_documents = 8;
  repeated DocumentIdType id_document_types = 9;
  repeated AcademicDegree optional_credentials = 10;
  bool has_registry_check = 11;
}

message GetCertificationRequirementsResponse {
  CertificationRequirements requirements = 1;
  repeated string enabled_countries = 2;
  string default_country = 3;
}

message GetVetPublicCredentialsRequest {
  string vet_profile_id = 1;
}

message PublicVerificationClaim {
  string type = 1;
  string source = 2;
  google.protobuf.Timestamp verified_at = 3;
}

message GetVetPublicCredentialsResponse {
  PublicLicense license = 1;
  bool has_active_license = 2;
  repeated PublicCredential credentials = 3;
  repeated PublicVerificationClaim verifications = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// ENUMS
// ═══════════════════════════════════════════════════════════════════════════

enum CertificationStatus {
  CERTIFICATION_STATUS_UNSPECIFIED = 0;
  CERTIFICATION_STATUS_PENDING = 1;
  CERTIFICATION_STATUS_APPROVED = 2;
  CERTIFICATION_STATUS_REJECTED = 3;
  CERTIFICATION_STATUS_SUSPENDED = 4;
  CERTIFICATION_STATUS_EXPIRED = 5;
  CERTIFICATION_STATUS_REVOKED = 6;
}

enum LicenseType {
  LICENSE_TYPE_UNSPECIFIED = 0;
  LICENSE_TYPE_NATIONAL = 1;
  LICENSE_TYPE_STATE = 2;
  LICENSE_TYPE_PROVISIONAL = 3;
  LICENSE_TYPE_SPECIALIST = 4;
}

enum PracticeScope {
  PRACTICE_SCOPE_UNSPECIFIED = 0;
  PRACTICE_SCOPE_GENERAL = 1;
  PRACTICE_SCOPE_SURGERY = 2;
  PRACTICE_SCOPE_EMERGENCY = 3;
  PRACTICE_SCOPE_DERMATOLOGY = 4;
  PRACTICE_SCOPE_ONCOLOGY = 5;
  PRACTICE_SCOPE_CARDIOLOGY = 6;
  PRACTICE_SCOPE_OPHTHALMOLOGY = 7;
  PRACTICE_SCOPE_NEUROLOGY = 8;
  PRACTICE_SCOPE_DENTISTRY = 9;
  PRACTICE_SCOPE_EXOTIC = 10;
  PRACTICE_SCOPE_LARGE_ANIMALS = 11;
  PRACTICE_SCOPE_REHABILITATION = 12;
}

enum DocumentIdType {
  DOCUMENT_ID_TYPE_UNSPECIFIED = 0;
  DOCUMENT_ID_TYPE_CC = 1;
  DOCUMENT_ID_TYPE_CE = 2;
  DOCUMENT_ID_TYPE_PASSPORT = 3;
}

enum RegistryStatus {
  REGISTRY_STATUS_UNSPECIFIED = 0;
  REGISTRY_STATUS_UNCHECKED = 1;
  REGISTRY_STATUS_VERIFIED = 2;
  REGISTRY_STATUS_NOT_FOUND = 3;
  REGISTRY_STATUS_SUSPENDED = 4;
  REGISTRY_STATUS_IDENTITY_MISMATCH = 5;
  REGISTRY_STATUS_POSSIBLE_SANCTION = 6;
  REGISTRY_STATUS_ERROR = 7;
}

// ═══════════════════════════════════════════════════════════════════════════
// CORE MESSAGES
// ═══════════════════════════════════════════════════════════════════════════

message Certification {
  string id = 1;
  string vet_profile_id = 2;
  string license_number = 3;
  LicenseType license_type = 4;
  string country = 5;                    // ISO 3166-1 alpha-2
  string state_province = 6;             // Optional sub-national
  string issuing_authority = 7;
  PracticeScope scope = 8;
  repeated string species_allowed = 9;
  CertificationStatus status = 10;
  string valid_from = 11;                // ISO8601 date (YYYY-MM-DD)
  string valid_until = 12;               // ISO8601 date (YYYY-MM-DD)
  google.protobuf.Timestamp submitted_at = 13;
  google.protobuf.Timestamp reviewed_at = 14;
  string reviewed_by = 15;
  string rejection_reason = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  bool is_active = 19;
  int32 days_until_expiration = 20;      // -1 if no expiration
  DocumentIdType document_type = 21;
  string document_number_masked = 22;    // ****9502
  bool document_verified = 23;           // un admin lo cotejó contra la cédula
  RegistryStatus registry_status = 24;
  google.protobuf.Timestamp registry_checked_at = 25;
  string registry_matricula = 26;
  string registry_detail = 27;
}

message StatusHistoryEntry {
  string id = 1;
  string certification_id = 2;
  CertificationStatus previous_status = 3;
  CertificationStatus new_status = 4;
  string reason = 5;
  string reason_details = 6;
  string changed_by = 7;
  google.protobuf.Timestamp changed_at = 8;
}

// ═══════════════════════════════════════════════════════════════════════════
// SUBMIT CERTIFICATION
// ═══════════════════════════════════════════════════════════════════════════

message SubmitCertificationRequest {
  string vet_profile_id = 1;             // Required: UUID of the vet profile
  string license_number = 2;             // Required
  LicenseType license_type = 3;          // Optional, defaults to NATIONAL
  string country = 4;                    // Required: ISO 3166-1 alpha-2
  string state_province = 5;             // Optional
  string issuing_authority = 6;          // Required
  PracticeScope scope = 7;               // Optional, defaults to GENERAL
  repeated string species_allowed = 8;   // Optional, defaults to ["small_animals"]
  string valid_from = 9;                 // Optional: ISO8601 date
  string valid_until = 10;               // Optional: ISO8601 date
  string submitted_by = 11;              // Required: UUID of submitter (usually same as vet_profile owner)
  string document_number = 12;           // Optional en el contrato, necesario para el cotejo
  DocumentIdType document_type = 13;     // Por defecto CC
}

message CertificationResponse {
  Certification certification = 1;
}

message CertificationsResponse {
  repeated Certification certifications = 1;
  int32 total_count = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// GET CERTIFICATION
// ═══════════════════════════════════════════════════════════════════════════

message GetCertificationRequest {
  string certification_id = 1;
}

message GetCertificationsByVetProfileRequest {
  string vet_profile_id = 1;
  bool include_inactive = 2;             // Include expired/revoked/etc
}

message GetActiveCertificationRequest {
  string vet_profile_id = 1;
  string country = 2;                    // ISO 3166-1 alpha-2
}

// ═══════════════════════════════════════════════════════════════════════════
// VALIDATE CAN PRACTICE
//
// This is the main validation endpoint used by other services.
// Designed for:
// - High-frequency calls (appointments, medical records, etc.)
// - Caching support (response includes cache hints)
// - Idempotency (same input = same output for given timestamp)
// ═══════════════════════════════════════════════════════════════════════════

message ValidateCanPracticeRequest {
  string vet_profile_id = 1;             // Required: UUID of the vet profile
  string country = 2;                    // Required: ISO 3166-1 alpha-2
  PracticeScope required_scope = 3;      // e.g., SURGERY for surgical procedures
  string required_species = 4;           // e.g., "exotic" for exotic animals
  string check_date = 5;                 // ISO8601 date, defaults to today
}

message ValidateCanPracticeResponse {
  bool can_practice = 1;                 // Main result: can the vet practice?
  string certification_id = 2;
  CertificationStatus status = 3;
  string valid_until = 4;                // ISO8601 date
  string reason = 5;
  repeated string missing_requirements = 6;
  int32 cache_ttl_seconds = 7;           // Suggested cache TTL
  string cache_key = 8;                  // Suggested cache key for clients
}

// ═══════════════════════════════════════════════════════════════════════════
// STATUS HISTORY
// ═══════════════════════════════════════════════════════════════════════════

message GetStatusHistoryRequest {
  string certification_id = 1;
  int32 limit = 2;                       // Optional, defaults to 50
  int32 offset = 3;                      // Optional, for pagination
}

message StatusHistoryResponse {
  repeated StatusHistoryEntry entries = 1;
  int32 total_count = 2;
}

// ═══════════════════════════════════════════════════════════════════════════
// REVIEW CERTIFICATION (Admin)
// ═══════════════════════════════════════════════════════════════════════════

message ReviewCertificationRequest {
  string certification_id = 1;      // Required: UUID of the certification
  string reviewer_id = 2;           // Required: UUID of the admin user
  CertificationStatus new_status = 3; // Required: target status
  string reason = 4;                // Required: StatusChangeReason value
  string notes = 5;                 // Optional: human-readable notes / rejection reason
  string verified_document_number = 6;
  DocumentIdType verified_document_type = 7;
}

// ═══════════════════════════════════════════════════════════════════════════
// COLA DE REVISION (Admin)
// ═══════════════════════════════════════════════════════════════════════════

message ListCertificationsForReviewRequest {
  repeated CertificationStatus statuses = 1;
  string country = 2;
  repeated RegistryStatus registry_statuses = 3;
  int32 limit = 4;                       // default 25, techo 100
  int32 offset = 5;
}

message CertificationReviewItem {
  Certification certification = 1;
  int32 required_documents_total = 2;
  int32 required_documents_verified = 3;
  repeated DocumentType missing_documents = 4;
  int32 documents_uploaded = 5;
  int32 pending_academic_credentials = 6;
  google.protobuf.Timestamp waiting_since = 7;
  bool ready_to_approve = 8;
}

message ListCertificationsForReviewResponse {
  repeated CertificationReviewItem items = 1;
  int32 total_count = 2;
}

message HardDeleteVetCertificationsRequest {
  string vet_profile_id = 1;
}

message HardDeleteVetCertificationsResponse {
  bool success = 1;
  string message = 2;
  int32 deleted_count = 3;
  repeated string orphaned_object_keys = 4;
}

// ═══════════════════════════════════════════════════════════════════════════
// SUPPORTING DOCUMENTS (private R2)
// ═══════════════════════════════════════════════════════════════════════════

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_LICENSE_SCAN = 1;    // Scanned professional license
  DOCUMENT_TYPE_DIPLOMA = 2;         // University diploma
  DOCUMENT_TYPE_ID_CARD = 3;         // Government ID
  DOCUMENT_TYPE_PHOTO = 4;           // Professional photo
  DOCUMENT_TYPE_CERTIFICATE = 5;     // Additional certificates
  DOCUMENT_TYPE_TRANSCRIPT = 6;      // Academic transcript
  DOCUMENT_TYPE_INSURANCE = 7;       // Professional liability insurance
  DOCUMENT_TYPE_BACKGROUND_CHECK = 8;// Background check results
  DOCUMENT_TYPE_OTHER = 9;           // Other
  DOCUMENT_TYPE_DISCIPLINARY_RECORD = 10;// Antecedentes disciplinarios (Procuraduria)
}

message CertificationDocument {
  string id = 1;
  string certification_id = 2;
  DocumentType document_type = 3;
  string original_filename = 4;
  string mime_type = 5;
  int64 file_size_bytes = 6;
  bool is_verified = 7;
  google.protobuf.Timestamp verified_at = 8;
  string verified_by = 9;
  string verification_notes = 10;
  string expires_at = 11;                // ISO8601 date (YYYY-MM-DD), optional
  google.protobuf.Timestamp uploaded_at = 12;
  string view_url = 13;
}

message GenerateCertificationDocumentUploadUrlRequest {
  string certification_id = 1;      // Required
  string vet_profile_id = 2;        // Required: owner (ownership check)
  DocumentType document_type = 3;   // Required
  string file_extension = 4;        // Required: pdf, jpg, png, webp
  string content_type = 5;          // Required: MIME type
}

message GenerateCertificationDocumentUploadUrlResponse {
  string upload_url = 1;            // Presigned PUT URL (short TTL)
  string object_key = 2;           // R2 key to send back in AddCertificationDocument
}

message AddCertificationDocumentRequest {
  string certification_id = 1;      // Required
  string vet_profile_id = 2;        // Required: owner (ownership check)
  DocumentType document_type = 3;   // Required
  string object_key = 4;            // Required: from the upload-url response
  string original_filename = 5;     // Optional
  string mime_type = 6;             // Optional
  int64 file_size_bytes = 7;        // Optional
  string expires_at = 8;            // Optional: ISO8601 date
}

message CertificationDocumentResponse {
  CertificationDocument document = 1;
}

message GetCertificationDocumentsRequest {
  string certification_id = 1;      // Required
  string requester_vet_profile_id = 2; // Optional: set when the caller is the vet
  bool is_admin = 3;                    // Set by the gateway for admin callers
}

message CertificationDocumentsResponse {
  repeated CertificationDocument documents = 1;
  int32 total_count = 2;
}

message VerifyCertificationDocumentRequest {
  string document_id = 1;           // Required
  string verified_by = 2;           // Required: admin UUID
  bool is_verified = 3;             // true = verify, false = un-verify
  string verification_notes = 4;    // Optional
}

message RemoveCertificationDocumentRequest {
  string document_id = 1;           // Required
  string vet_profile_id = 2;        // Required: owner (ownership check)
}

message RemoveCertificationDocumentResponse {
  bool success = 1;
}
